###############################################
## TEMPLATES ENTITIES
###############################################
template:
  - binary_sensor:
      - name: Monolith Speakers Above Power Threshold
        # On = speakers actively playing (power above 12 W)
        # Backlight + speakers active = ~32W, backlight + speakers standby = ~8W
        state: "{{ states('sensor.monolith_speakers_active_power') | float(0) > 12 }}"

###############################################
## SCRIPTS
###############################################
script:
  # Script that fixes the Samsung TV toggling instead of turning off when the TV is already off
  turn_off_samsung_tv:
    alias: Turn Off Samsung TV
    description: Turns the Samsung TV off only if it is on, because turn_off toggles it when it is already off.
    sequence:
      - if:
          - condition: state
            entity_id: media_player.samsung_tv
            state: "on"
        then:
          - action: media_player.turn_off
            target:
              entity_id: media_player.samsung_tv

###############################################
## AUTOMATIONS
###############################################
automation:
  # The core Samsung TV integration can only switch the TV off by itself; turning it on is handled here
  # when HA (UI, Alice, scripts) asks the TV to turn on
  - id: samsung_tv_turn_on_wake_on_lan
    alias: Samsung TV Turn On via Wake-on-LAN
    description: >-
      Turns the Samsung TV on when media_player.samsung_tv is asked to turn on: a Wake-on-LAN packet
      (for a TV that is fully off), then, if it is still off after 5 s, the power key over the network
      (retried once after 15 s).
      In network standby this QE55QE1D ignores Wake-on-LAN but accepts KEY_POWER (tested 2026-11-15).
    mode: single
    triggers:
      - trigger: samsungtv.turn_on
        entity_id: media_player.samsung_tv
    actions:
      - action: wake_on_lan.send_magic_packet
        data:
          mac: !secret SAMSUNG_TV_MAC
          broadcast_address: 192.168.1.255
      - wait_template: "{{ is_state('media_player.samsung_tv', 'on') }}"
        timeout: "00:00:05"
      # KEY_POWER toggles, so only while the TV is still off. Right after switching off the TV ignores it
      # for a short while, so one retry after 15 s (HA sees the TV on within ~8 s, so no double toggle)
      - repeat:
          count: 2
          sequence:
            - condition: state
              entity_id: media_player.samsung_tv
              state: "off"
            - action: remote.send_command
              continue_on_error: true
              target:
                entity_id: remote.living_room_tv
              data:
                command: KEY_POWER
            - wait_template: "{{ is_state('media_player.samsung_tv', 'on') }}"
              timeout: "00:00:15"

  - id: living_room_tv_lights_by_sunset_or_tv_on
    alias: Living Room TV Lights by Sunset or TV ON
    description: "Turn on TV lights automatically by sunset or when TV is turned on"
    mode: restart
    triggers:
      - trigger: numeric_state
        entity_id: sun.sun
        attribute: elevation
        below: 4.0
      - trigger: state
        entity_id: media_player.samsung_tv
        to: "on"
    conditions:
      # For elevation trigger
      - condition: state
        entity_id: media_player.samsung_tv
        state: "on"
      # For TV trigger
      - condition: numeric_state
        entity_id: sun.sun
        attribute: elevation
        below: 4.0
    actions:
      - action: light.turn_on
        target:
          entity_id: light.tv_lights

  - id: movies_scene_by_sunset_or_tv_on
    alias: Movies Scene by Sunset or TV ON
    description: >-
      In the evening (20:00-22:30, sun below 4 degrees) with the TV on and Sen home, activates the
      Movies scene once nobody is in the kitchen (waits up to 1 hour) and the TV is still on.
    mode: restart
    triggers:
      - trigger: numeric_state
        entity_id: sun.sun
        attribute: elevation
        below: 4.0
      - trigger: state
        entity_id: media_player.samsung_tv
        to: "on"
    conditions:
      # For elevation trigger
      - condition: state
        entity_id: media_player.samsung_tv
        state: "on"
      # For TV trigger
      - condition: numeric_state
        entity_id: sun.sun
        attribute: elevation
        below: 4.0
      # Only if Sen is home
      - condition: state
        entity_id: person.sen
        state: "home"
      # Only from 20:00 to 22:30
      - condition: time
        after: "20:00:00"
        before: "22:30:00"
    actions:
      # Wait till nobody is detected in the kitchen
      - wait_template: >
          {{ states('binary_sensor.presence_sensor_fp2_detection_zone_presence') == 'off' and
            states('binary_sensor.kitchen_motion_alarm') == 'off' }}
        timeout: 01:00:00
        continue_on_timeout: false
      # Check if it's still needed (TV is on)
      - if:
          - condition: state
            entity_id: media_player.samsung_tv
            state: "on"
        then:
          - action: scene.turn_on
            target:
              entity_id: scene.movies

  - id: living_room_tv_lights_by_tv_off
    alias: Living Room TV Lights by TV OFF
    description: "Turn off TV lights automatically when TV is turned off"
    mode: restart
    triggers:
      - trigger: state
        entity_id: media_player.samsung_tv
        from: "on"
        to: "off"
        for:
          minutes: 5
    actions:
      - action: light.turn_off
        target:
          entity_id: light.tv_lights

  - id: living_room_speakers_power_on_with_tv
    alias: Living Room Speakers Power On with TV
    description: "Turn on speakers automatically when TV is turned on"
    mode: restart
    triggers:
      - trigger: state
        entity_id: media_player.samsung_tv
        to: "on"
    conditions:
      - condition: state
        entity_id: switch.monolith_speakers
        state: "off"
    actions:
      - action: switch.turn_on
        target:
          entity_id: switch.monolith_speakers

  - id: living_room_speakers_auto_power_down
    alias: Living Room Speakers Auto Power Down
    description: >-
      Turns the Monolith speakers off if, within 5 minutes after they are switched on, the TV turns off
      or their power drops, the power stays below the threshold and the TV is off.
    mode: restart
    triggers:
      # When speakers are turned on
      - trigger: state
        entity_id: switch.monolith_speakers
        to: "on"
      # When TV is turned off
      - trigger: state
        entity_id: media_player.samsung_tv
        to: "off"
      # When power consumption drops below threshold
      - trigger: state
        entity_id: binary_sensor.monolith_speakers_above_power_threshold
        to: "off"
    conditions:
      - condition: state
        entity_id: switch.monolith_speakers
        state: "on"
    actions:
      # Wait up to 5 minutes to see if power consumption goes above threshold
      - alias: Check if power consumption exceeds threshold
        wait_for_trigger:
          - trigger: state
            entity_id: binary_sensor.monolith_speakers_above_power_threshold
            to: "on"
        timeout:
          minutes: 5
      # Check if power consumption was not exceeded during the wait and TV is off
      - if:
          - "{{ not wait.completed }}"
          - condition: state
            entity_id: media_player.samsung_tv
            state: "off"
        then:
          - alias: Power off if threshold not exceeded
            action: switch.turn_off
            target:
              entity_id: switch.monolith_speakers
