###############################################
## TEMPLATES ENTITIES
###############################################
template:
  - binary_sensor:
      - name: Monolith Speakers Above Power Threshold
        # On = speakers actively playing music (power above 55 W). Since 11/2026 the speakers have no
        # standby mode and a new RGB backlight (red by default): speakers + backlight idle = ~40-50 W
        # (~30 W with the backlight off), playing = 60-220 W peaks
        state: "{{ states('sensor.monolith_speakers_active_power') | float(0) > 55 }}"

  # The TV's own local API reports its real power state instantly ("on" / "standby"); the core
  # integration learns it with a delay, which made its power-key toggles turn the TV on instead of off.
  # Unavailable = TV fully off / unplugged.

input_select:
  # Expected TV state while a power command is in progress: the UI shows it at once (the TV reports
  # standby only ~4 s after the screen goes dark); "none" = show the real state
  samsung_tv_pending:
    name: Samsung TV Pending Power State
    options: ["none", "on", "off"]
    icon: mdi:television-shimmer

rest:
  - resource: !secret SAMSUNG_TV_API_URL
    scan_interval: 5
    timeout: 3
    binary_sensor:
      - name: Samsung TV Power
        unique_id: samsung_tv_power
        device_class: power
        value_template: "{{ value_json.device.PowerState == 'on' }}"

###############################################
## MEDIA PLAYERS
###############################################
media_player:
  # media_player.samsung_tv: everything (volume, source, remote, media info) comes from the core
  # Samsung TV entity (renamed to media_player.samsung_tv_raw); state and on/off come from the TV's
  # power state and the guarded scripts below, so an "off" command can never switch the TV on.
  - platform: universal
    name: TV
    unique_id: samsung_tv_universal
    device_class: tv
    children:
      - media_player.samsung_tv_raw
    state_template: >-
      {% set pending = states('input_select.samsung_tv_pending') %}
      {{ pending if pending in ['on', 'off'] else ('on' if is_state('binary_sensor.samsung_tv_power', 'on') else 'off') }}
    # The scripts run in the background (script.turn_on returns at once): callers such as Alice get an
    # immediate answer and see the optimistic state, the power checks and retries continue afterwards
    commands:
      turn_on:
        action: script.turn_on
        target:
          entity_id: script.samsung_tv_power_on
      turn_off:
        action: script.turn_on
        target:
          entity_id: script.samsung_tv_power_off
      toggle:
        action: script.turn_on
        target:
          entity_id: "{{ 'script.samsung_tv_power_off' if is_state('binary_sensor.samsung_tv_power', 'on') else 'script.samsung_tv_power_on' }}"
    browse_media_entity: media_player.samsung_tv_raw

###############################################
## SCRIPTS
###############################################
script:
  # The TV's power key toggles, so it is sent only from the opposite state and repeated only while
  # the TV is verifiably still in that state (right after switching off it ignores the key for a while)
  samsung_tv_power_on:
    alias: Samsung TV Power On
    description: >-
      Turns the TV on: nothing if it is already on; Wake-on-LAN if it is unreachable (fully off);
      the power key while it is in network standby, up to 3 times until the TV reports "on".
    mode: single
    max_exceeded: silent
    sequence:
      - condition: state
        entity_id: binary_sensor.samsung_tv_power
        state: ["off", "unavailable", "unknown"]
      - if:
          - condition: state
            entity_id: binary_sensor.samsung_tv_power
            state: ["unavailable", "unknown"]
        then:
          - action: wake_on_lan.send_magic_packet
            data:
              mac: !secret SAMSUNG_TV_MAC
      - action: input_select.select_option
        target:
          entity_id: input_select.samsung_tv_pending
        data:
          option: "on"
      - repeat:
          count: 3
          sequence:
            - condition: state
              entity_id: binary_sensor.samsung_tv_power
              state: "off"
            - action: remote.send_command
              continue_on_error: true
              target:
                entity_id: remote.living_room_tv
              data:
                command: KEY_POWER
            # In the background (script.turn_on does not wait), so the wait below ends as soon as the TV reports
            - action: script.turn_on
              target:
                entity_id: script.samsung_tv_refresh_power
            - wait_template: "{{ is_state('binary_sensor.samsung_tv_power', 'on') }}"
              timeout: "00:00:06"

  samsung_tv_power_off:
    alias: Samsung TV Power Off
    description: >-
      Turns the TV off with the power key, only while the TV reports "on" (never toggles a TV that is
      already in standby back on), retried up to 3 times until it reports standby.
    mode: single
    max_exceeded: silent
    sequence:
      - condition: state
        entity_id: binary_sensor.samsung_tv_power
        state: "on"
      - action: input_select.select_option
        target:
          entity_id: input_select.samsung_tv_pending
        data:
          option: "off"
      - repeat:
          count: 3
          sequence:
            - condition: state
              entity_id: binary_sensor.samsung_tv_power
              state: "on"
            - action: remote.send_command
              continue_on_error: true
              target:
                entity_id: remote.living_room_tv
              data:
                command: KEY_POWER
            # In the background (script.turn_on does not wait), so the wait below ends as soon as the TV reports
            - action: script.turn_on
              target:
                entity_id: script.samsung_tv_refresh_power
            - wait_template: "{{ not is_state('binary_sensor.samsung_tv_power', 'on') }}"
              timeout: "00:00:06"

  samsung_tv_refresh_power:
    alias: Samsung TV Refresh Power
    description: Polls the TV power state every 0.5 s for 6 seconds after a power key, for a fast UI update.
    mode: restart
    sequence:
      - repeat:
          count: 12
          sequence:
            - delay:
                milliseconds: 500
            - action: homeassistant.update_entity
              continue_on_error: true
              target:
                entity_id: binary_sensor.samsung_tv_power

  # Kept for its callers (leave home / night routine); the guard now lives in samsung_tv_power_off
  turn_off_samsung_tv:
    alias: Turn Off Samsung TV
    description: Turns the Samsung TV off (no-op when it is already off, see Samsung TV Power Off).
    sequence:
      - action: script.samsung_tv_power_off

###############################################
## AUTOMATIONS
###############################################
automation:
  - id: samsung_tv_pending_state_clear
    alias: Samsung TV Pending State Clear
    description: >-
      Clears the optimistic TV state once the TV reports the expected power state, or after 25 s if it
      never does (then the UI shows the real state again).
    mode: queued
    triggers:
      - trigger: state
        entity_id: binary_sensor.samsung_tv_power
      - trigger: state
        entity_id: input_select.samsung_tv_pending
        to: ["on", "off"]
        for: "00:00:25"
    conditions:
      - "{{ not is_state('input_select.samsung_tv_pending', 'none') }}"
      - >-
        {{ trigger.platform != 'state' or trigger.entity_id == 'input_select.samsung_tv_pending'
           or (is_state('input_select.samsung_tv_pending', 'on') and trigger.to_state.state == 'on')
           or (is_state('input_select.samsung_tv_pending', 'off') and trigger.to_state.state != 'on') }}
    actions:
      - action: input_select.select_option
        target:
          entity_id: input_select.samsung_tv_pending
        data:
          option: "none"

  - id: living_room_tv_lights_by_sunset_or_tv_on
    alias: Living Room TV Lights by Sunset or TV ON
    description: "Turn on TV lights automatically by sunset or when TV is turned on"
    mode: restart
    triggers:
      - trigger: numeric_state
        entity_id: sun.sun
        attribute: elevation
        below: 4.0
      - trigger: state
        entity_id: media_player.samsung_tv
        to: "on"
    conditions:
      # For elevation trigger
      - condition: state
        entity_id: media_player.samsung_tv
        state: "on"
      # For TV trigger
      - condition: numeric_state
        entity_id: sun.sun
        attribute: elevation
        below: 4.0
    actions:
      - action: light.turn_on
        target:
          entity_id: light.tv_lights

  - id: movies_scene_by_sunset_or_tv_on
    alias: Movies Scene by Sunset or TV ON
    description: >-
      In the evening (20:00-22:30, sun below 4 degrees) with the TV on and Sen home, activates the
      Movies scene once nobody is in the kitchen (waits up to 1 hour) and the TV is still on.
    mode: restart
    triggers:
      - trigger: numeric_state
        entity_id: sun.sun
        attribute: elevation
        below: 4.0
      - trigger: state
        entity_id: media_player.samsung_tv
        to: "on"
    conditions:
      # For elevation trigger
      - condition: state
        entity_id: media_player.samsung_tv
        state: "on"
      # For TV trigger
      - condition: numeric_state
        entity_id: sun.sun
        attribute: elevation
        below: 4.0
      # Only if Sen is home
      - condition: state
        entity_id: person.sen
        state: "home"
      # Only from 20:00 to 22:30
      - condition: time
        after: "20:00:00"
        before: "22:30:00"
    actions:
      # Wait till nobody is detected in the kitchen
      - wait_template: >
          {{ states('binary_sensor.presence_sensor_fp2_detection_zone_presence') == 'off' and
            states('binary_sensor.kitchen_motion_alarm') == 'off' }}
        timeout: 01:00:00
        continue_on_timeout: false
      # Check if it's still needed (TV is on)
      - if:
          - condition: state
            entity_id: media_player.samsung_tv
            state: "on"
        then:
          - action: scene.turn_on
            target:
              entity_id: scene.movies

  - id: living_room_tv_lights_by_tv_off
    alias: Living Room TV Lights by TV OFF
    description: "Turn off TV lights automatically when TV is turned off"
    mode: restart
    triggers:
      - trigger: state
        entity_id: media_player.samsung_tv
        from: "on"
        to: "off"
        for:
          minutes: 5
    actions:
      - action: light.turn_off
        target:
          entity_id: light.tv_lights

  - id: living_room_speakers_power_on_with_tv
    alias: Living Room Speakers Power On with TV
    description: "Turn on speakers automatically when TV is turned on"
    mode: restart
    triggers:
      - trigger: state
        entity_id: media_player.samsung_tv
        to: "on"
    conditions:
      - condition: state
        entity_id: switch.monolith_speakers
        state: "off"
    actions:
      - action: switch.turn_on
        target:
          entity_id: switch.monolith_speakers

  - id: living_room_speakers_auto_power_down
    alias: Living Room Speakers Auto Power Down
    description: >-
      Turns the Monolith speakers off when the TV is off, the Philips floor lamps (same plug) are off and
      no music has played for 5 minutes (power never above the 55 W "playing" threshold): checked after
      they are switched on, when the TV or the lamps turn off and when the music stops. The speakers have
      no standby of their own any more, so the plug is the only off.
    mode: restart
    triggers:
      # When speakers are turned on
      - trigger: state
        entity_id: switch.monolith_speakers
        to: "on"
      # When TV is turned off
      - trigger: state
        entity_id: media_player.samsung_tv
        to: "off"
      # When the floor lamps are turned off: the plug powers them too, so it stays on while they light
      - trigger: state
        entity_id: light.philips_floor_lamps
        to: "off"
      # When power consumption drops below threshold
      - trigger: state
        entity_id: binary_sensor.monolith_speakers_above_power_threshold
        to: "off"
    conditions:
      - condition: state
        entity_id: switch.monolith_speakers
        state: "on"
    actions:
      # Wait up to 5 minutes to see if power consumption goes above threshold
      - alias: Check if power consumption exceeds threshold
        wait_for_trigger:
          - trigger: state
            entity_id: binary_sensor.monolith_speakers_above_power_threshold
            to: "on"
        timeout:
          minutes: 5
      # Check if power consumption was not exceeded during the wait, TV is off and the lamps are off
      - if:
          - "{{ not wait.completed }}"
          - condition: state
            entity_id: media_player.samsung_tv
            state: "off"
          - condition: state
            entity_id: light.philips_floor_lamps
            state: "off"
        then:
          - alias: Power off if threshold not exceeded
            action: switch.turn_off
            target:
              entity_id: switch.monolith_speakers
