###############################################
## SETTINGS AND VARIABLES
###############################################
homeassistant:
  customize:
    package.node_anchors:
      quarantine_duration_min: &quarantine_duration_min "50"
      short_heating_duration_min: &short_heating_duration_min "10"
      pause_heating_duration_min: &pause_heating_duration_min "60"

###############################################
## SCHEDULERS
###############################################
schedule:
  bathroom_heating_evening:
    name: "Bathroom Heating Evening"
    monday: &bathroom_heating_schedule
      - from: "17:40:00"
        to: "17:45:00"
    tuesday: *bathroom_heating_schedule
    wednesday: *bathroom_heating_schedule
    thursday: *bathroom_heating_schedule
    friday: *bathroom_heating_schedule
    saturday: *bathroom_heating_schedule
    sunday: *bathroom_heating_schedule

###############################################
## INPUT TEXTS
###############################################
input_text:
  heating_log:
    name: Heating Log

###############################################
## INPUT BOOLEANS
###############################################
input_boolean:
  heating_season:
    name: Heating Season
    icon: mdi:snowflake
  heating_allowed:
    # Flag used to block heating manually for some time or by any external automation
    name: Heating Allowed
    icon: mdi:check-circle-outline
    initial: on

###############################################
## TIMERS
###############################################
timer:
  heating_quarantine:
    name: Heating Quarantine
    duration:
      minutes: *quarantine_duration_min
    icon: mdi:radiator-off
    restore: true
  short_heating:
    name: Short Heating
    duration:
      minutes: *short_heating_duration_min
    icon: mdi:timer-sand
    restore: true
  pause_heating:
    name: Pause Heating
    duration:
      minutes: *pause_heating_duration_min
    icon: mdi:check-circle-outline
    restore: true

###############################################
## BINARY SENSORS
###############################################
binary_sensor:
  - platform: group
    name: Windows
    unique_id: windows
    device_class: window
    entities:
      - binary_sensor.bedroom_window_contact
      - binary_sensor.kitchen_window_contact
      - binary_sensor.living_room_window_contact
  - platform: group
    name: ETRVs requesting heat
    unique_id: etrvs_requesting_heat
    device_class: heat
    entities:
      - binary_sensor.heating_request_bedroom
      - binary_sensor.heating_request_kitchen
      - binary_sensor.heating_request_living_room

###############################################
## TEMPLATE ENTITIES
###############################################
template:
  - binary_sensor:
      - name: Thermostat heating
        unique_id: thermostat_heating
        device_class: heat
        state: "{{ is_state_attr('climate.nestlocal_thermostat', 'hvac_action', 'heating') }}"
      - name: Thermostat Active
        unique_id: thermostat_active
        device_class: running
        state: >
          {{ not is_state_attr('climate.nestlocal_thermostat', 'hvac_action', 'off') and
          not is_state_attr('climate.nestlocal_thermostat', 'preset_mode', 'eco') }}
      - name: Freeze Alert at Night
        unique_id: freeze_alert_at_night
        device_class: cold
        # Detects if temperature drops below 20°C during night hours (21:00-06:00) when people are home or guest mode is enabled
        # Unavailable/unknown sensors are ignored (they must not count as 0 °C)
        state: >
          {% set temps = [state_attr('climate.nestlocal_thermostat', 'current_temperature'),
                          states('sensor.ble_temperature_atc_bedroom'),
                          states('sensor.ble_temperature_atc_living_room')]
                         | select('is_number') | map('float') | list %}
          {{ (now().hour >= 21 or now().hour < 6)
             and (is_state('binary_sensor.people_home', 'on') or is_state('input_boolean.guest_mode', 'on'))
             and temps | count > 0 and temps | min < 20.0 }}
      - name: Heating Request Bedroom
        unique_id: heating_request_bedroom
        device_class: heat
        state: >
          {{ is_state('binary_sensor.danfoss_etrv0100_bedroom_heat_required', 'on') and
            states('sensor.danfoss_etrv0100_bedroom_pi_heating_demand') | int(0) >=
            states('input_number.pi_heating_demand_threshold') | int(20) }}
      - name: Heating Request Kitchen
        unique_id: heating_request_kitchen
        device_class: heat
        state: >
          {{ is_state('binary_sensor.danfoss_etrv0103_kitchen_heat_required', 'on') and
            states('sensor.danfoss_etrv0103_kitchen_pi_heating_demand') | int(0) >=
            states('input_number.pi_heating_demand_threshold') | int(20) }}
      - name: Heating Request Living Room
        unique_id: heating_request_living_room
        device_class: heat
        state: >
          {{ is_state('binary_sensor.danfoss_etrv0103_living_room_heat_required', 'on') and
            states('sensor.danfoss_etrv0103_living_room_pi_heating_demand') | int(0) >=
            states('input_number.pi_heating_demand_threshold') | int(20) }}
      - name: Heating Request Bathroom
        unique_id: heating_request_bathroom
        device_class: heat
        state: >
          {% set t = states('sensor.ble_temperature_atc_bathroom') %}
          {{ t | is_number
             and t | float < states('input_number.bathroom_heating_target_temperature') | float(24)
             and is_state('schedule.bathroom_heating_evening', 'on') }}

###############################################
## HISTORY STATS SENSORS
###############################################
sensor:
  - platform: history_stats
    name: Heating Today
    entity_id: binary_sensor.thermostat_heating
    state: "on"
    type: time
    start: "{{ today_at('00:00:00') }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: Heating Yesterday
    entity_id: binary_sensor.thermostat_heating
    state: "on"
    type: time
    end: "{{ today_at('00:00:00') }}"
    duration:
      days: 1

###############################################
## INPUT BUTTONS
###############################################
input_button:
  # Button to start manual heating for 10 minutes from the UI / voice assistant
  thermostat_10_minutes_heating:
    name: Heat 10 Minutes
    icon: mdi:radiator

###############################################
## INPUT NUMBERS
###############################################
input_number:
  pi_heating_demand_threshold:
    name: PI Heating Demand Threshold
    step: 1
    min: 0
    max: 100
  thermostat_default_target_temperature:
    name: Thermostat Default Target Temperature
    min: 18.0
    max: 25.0
  thermostat_new_target_temperature:
    name: Thermostat New Target Temperature
    min: 15.0
    max: 30.0
  etrv_bedroom_default_temperature:
    name: ETRV Bedroom Default Temperature
    step: 0.5
    min: 18.0
    max: 25.0
  etrv_kitchen_default_temperature:
    name: ETRV Kitchen Default Temperature
    step: 0.5
    min: 18.0
    max: 25.0
  etrv_living_room_default_temperature:
    name: ETRV Living Room Default Temperature
    step: 0.5
    min: 18.0
    max: 25.0
  etrv_min_target_temperature:
    name: ETRV Min Target Temperature
    step: 0.5
    min: 17.0
    max: 21.0
  etrv_max_target_temperature:
    name: ETRV Max Target Temperature
    step: 0.5
    min: 21.0
    max: 25.0
  bathroom_heating_target_temperature:
    name: Bathroom Heating Target Temperature
    step: 0.5
    min: 20.0
    max: 25.0

###############################################
## SCRIPTS
###############################################
script:
  thermostat_start_heating:
    alias: Thermostat Start Heating
    description: >-
      Force the Nest to start heating by setting its target 2 °C above the current
      temperature, then log the reason: the caller's message if given, otherwise which rooms
      are requesting heat.
    mode: restart
    fields:
      message:
        description: Optional heating log text (e.g. for short heating, when no room requests heat)
        example: Включен кратковременный подогрев квартиры
        selector:
          text:
    # Forces the thermostat to start heating by adding 2°C to the current temperature
    sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.thermostat_new_target_temperature
        data:
          value: "{{ (state_attr('climate.nestlocal_thermostat', 'current_temperature') | float(24)) + 2 }}"
      # Set thermostat new target temperature
      - action: script.thermostat_set_temperature
        data:
          temperature: "{{ states('input_number.thermostat_new_target_temperature') | float(24) }}"
      # Log the caller's message, or what rooms are requesting heat
      # Builds "... в спальне, кухне и гостиной" from raw ETRV heat_required sensors + bathroom request
      - action: input_text.set_value
        target:
          entity_id: input_text.heating_log
        data:
          value: >-
            {% if message is defined and message %}
            {{ message }}
            {% else %}
            {% set room_names = {
              'binary_sensor.danfoss_etrv0100_bedroom_heat_required': 'спальне',
              'binary_sensor.danfoss_etrv0103_kitchen_heat_required': 'кухне',
              'binary_sensor.danfoss_etrv0103_living_room_heat_required': 'гостиной',
              'binary_sensor.heating_request_bathroom': 'ванной'
            } %}
            {% set rooms = namespace(list=[]) %}
            {% for entity_id, room_name in room_names.items() %}
              {% if is_state(entity_id, 'on') %}
                {% set rooms.list = rooms.list + [room_name] %}
              {% endif %}
            {% endfor %}
            {% if rooms.list | length == 0 %}
            Отопление включено без запроса от комнат
            {% else %}
            ETRVs запрашивают отопление в
            {{ rooms.list[:-1] | join(', ') }}
            {% if rooms.list | length > 1 %}и{% endif %}
            {{ rooms.list[-1] }}
            {% endif %}
            {% endif %}

  thermostat_stop_heating:
    alias: Thermostat Stop Heating
    description: >-
      End forced heating by returning the Nest to the default target temperature.
      Optional `message` is written to the heating log.
    mode: restart
    # Stop forced heating by setting default target temperature
    sequence:
      # Log the message if provided
      - if: "{{ message is defined }}"
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.heating_log
            data:
              value: "{{ message }}"
      # Set default thermostat target temperature
      - action: script.thermostat_set_temperature
        data:
          temperature: "{{ states('input_number.thermostat_default_target_temperature') | float(22) }}"

  thermostat_set_temperature:
    alias: Thermostat Set Temperature
    description: >-
      Make sure the Nest is in heat mode without the eco preset, then set the target
      `temperature`, retrying each step with growing delays because Nest commands may not apply on the first try.
    mode: restart
    sequence:
      # Check if thermostat is in "heat" mode and set it if not
      - if:
          - condition: template
            value_template: "{{ not is_state('climate.nestlocal_thermostat', 'heat') }}"
        then:
          # Repeat the command to ensure that the thermostat is enabled
          - repeat:
              sequence:
                - action: climate.set_hvac_mode
                  target:
                    entity_id: climate.nestlocal_thermostat
                  continue_on_error: true
                  data:
                    hvac_mode: "heat"
                # Back off 5, 10, 15... s between attempts; give up after 6 tries
                - delay: "{{ 5 * repeat.index }}"
              until: "{{ is_state('climate.nestlocal_thermostat', 'heat') or repeat.index > 5 }}"
      # Disable "eco" mode if it is active
      - if:
          - condition: template
            value_template: "{{ is_state_attr('climate.nestlocal_thermostat', 'preset_mode', 'eco') }}"
        then:
          # Repeat the command to ensure that the thermostat is set to the default temperature
          - repeat:
              sequence:
                - action: climate.set_preset_mode
                  target:
                    entity_id: climate.nestlocal_thermostat
                  continue_on_error: true
                  data:
                    preset_mode: "none"
                - delay: "{{ 5 * repeat.index }}"
              until: "{{ is_state_attr('climate.nestlocal_thermostat', 'preset_mode', 'none') or repeat.index > 5 }}"
      # Repeat the command to ensure that the thermostat is set to the default temperature
      - repeat:
          sequence:
            - action: climate.set_temperature
              target:
                entity_id: climate.nestlocal_thermostat
              continue_on_error: true
              data:
                temperature: "{{ temperature }}"
            - delay: "{{ 5 * repeat.index }}"
          # Done when the Nest reports a target within 0.3 °C of the requested one (allows for rounding)
          until: "{{ (state_attr('climate.nestlocal_thermostat', 'temperature') | float(0) - temperature | float(0)) | abs < 0.3 or repeat.index > 5 }}"

  thermostat_set_eco_mode:
    alias: Thermostat Set Eco Mode
    description: >-
      Put the Nest into eco preset (used when windows are open or nobody is home).
      Resets the target to default first; optional `message` is written to the heating log.
    mode: restart
    sequence:
      # Check if thermostat is not already in "eco" mode and set it if not
      - if:
          - condition: template
            value_template: "{{ not is_state_attr('climate.nestlocal_thermostat', 'preset_mode', 'eco') }}"
        then:
          # Reset the thermostat target temperature
          - action: script.thermostat_stop_heating
          # Wait for the script to finish
          - wait_template: "{{ is_state('script.thermostat_stop_heating', 'off') }}"
            timeout: "00:01:00"
          # Log the message if provided
          - if: "{{ message is defined }}"
            then:
              - action: input_text.set_value
                target:
                  entity_id: input_text.heating_log
                data:
                  value: "{{ message }}"
          - alias: Repeat until thermostat is in 'eco' mode
            repeat:
              sequence:
                # Nest may reject a retry (FAILED_PRECONDITION) while the first command is still applying
                - action: climate.set_preset_mode
                  continue_on_error: true
                  target:
                    entity_id: climate.nestlocal_thermostat
                  data:
                    preset_mode: "eco"
                - wait_template: "{{ is_state_attr('climate.nestlocal_thermostat', 'preset_mode', 'eco') }}"
                  timeout: "00:00:30"
              until: "{{ is_state_attr('climate.nestlocal_thermostat', 'preset_mode', 'eco') or repeat.index >= 3 }}"

  notify_if_some_window_is_opened_during_heating_season:
    alias: Notify If Some Window Opened During Heating Season
    description: During heating season, notify the phone which rooms have an open window.
    mode: restart
    sequence:
      - condition: state
        entity_id: input_boolean.heating_season
        state: "on"
      - condition: state
        entity_id: binary_sensor.windows
        state: "on"
      - action: script.notify
        data:
          level: warning
          persistent: false
          # Russian names of the areas of the window contacts that are currently open
          title: >-
            {% from 'ru.jinja' import room_ru %}
            {% set ns = namespace(rooms=[]) %}
            {% for e in expand('binary_sensor.windows') | selectattr('state', 'eq', 'on') %}
              {% set ns.rooms = ns.rooms + [room_ru(area_name(e.entity_id))] %}
            {% endfor %}
            🪟 Открыто окно: {{ ns.rooms | join(', ') }}
          message: Отопление на паузе, пока окно открыто

###############################################
## AUTOMATIONS
###############################################
automation:
  ###############################################
  ## Window Opened Control
  ###############################################
  - id: stop_heating_by_window_opened
    alias: Stop Heating by Window Opened
    description: >-
      When any window has been open for 10 s during heating season, cancel all heating
      timers (announcing an interrupted short heating) and switch the Nest to eco.
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.windows
        from: "off"
        to: "on"
        for: "00:00:10"
    conditions:
      - condition: state
        entity_id: input_boolean.heating_season
        state: "on"
    actions:
      # Stop "Pause Heating" timer if it is active without restoring the thermostat mode
      - action: timer.cancel
        target:
          entity_id: timer.pause_heating
      # Stop "Heating Quarantine" timer if it is active and log it
      - if:
          - condition: state
            entity_id: timer.heating_quarantine
            state: "active"
        then:
          - action: timer.cancel
            target:
              entity_id: timer.heating_quarantine
          - action: input_text.set_value
            target:
              entity_id: input_text.heating_log
            data:
              value: "Открыто окно → карантин перед включением отопления отменён"
      # Stop "Short Heating" timer if it is active and notify about it
      - if:
          - condition: state
            entity_id: timer.short_heating
            state: "active"
        then:
          # Stop "Short Heating" timer without restoring the thermostat mode
          - action: timer.cancel
            target:
              entity_id: timer.short_heating
          - action: input_text.set_value
            target:
              entity_id: input_text.heating_log
            data:
              value: "Открыто окно → кратковременное отопление отменено"
          - action: media_player.play_media
            target:
              entity_id: media_player.yandex_station_midi
            data:
              media_content_id: Окно открыто — подогрев квартиры отменён.
              media_content_type: text
      # Set "eco" mode on thermostat
      - action: script.thermostat_set_eco_mode
        data:
          message: "Открыто окно → переход в режим экономии"

  - id: start_quarantine_by_window_closed
    alias: Start Quarantine by Window Closed
    description: >-
      When all windows are closed for 10 s, start the heating quarantine timer so the
      apartment is not heated right after airing.
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.windows
        from: "on"
        to: "off"
        for: "00:00:10"
    conditions:
      - condition: state
        entity_id: input_boolean.heating_season
        state: "on"
    actions:
      # Start "Heating Quarantine" timer
      - action: timer.start
        target:
          entity_id: timer.heating_quarantine
      - action: input_text.set_value
        target:
          entity_id: input_text.heating_log
        data:
          value: Окна закрыты → карантин перед включением отопления начат

  - id: restore_heating_after_quarantine
    alias: Restore Heating after Quarantine
    description: >-
      When the quarantine ends and all windows are still closed, return the Nest from
      eco to the default target, unless heating is paused or nobody (and no guest) is home.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.heating_quarantine
    conditions:
      - condition: state
        entity_id: input_boolean.heating_season
        state: "on"
      # All windows should be closed
      - condition: state
        entity_id: binary_sensor.windows
        state: "off"
    actions:
      # Set thermostat mode to «heat» only if someone is home
      - if:
          # Proceed only if heating is not paused and either people are home or guest mode is enabled
          - condition: state
            entity_id: timer.pause_heating
            state: "idle"
          - or:
              - condition: state
                entity_id: binary_sensor.people_home
                state: "on"
              - condition: state
                entity_id: input_boolean.guest_mode
                state: "on"
        then:
          # Stop heating by setting default temperature on thermostat
          - action: script.thermostat_stop_heating
            data:
              message: "Карантин перед включением отопления окончен → отопление включено"
        else:
          - action: input_text.set_value
            target:
              entity_id: input_text.heating_log
            data:
              value: "Карантин перед включением отопления окончен, но обогрев запрещён → отопление не включено"

  # AR-05: the window automations react only to off<->on transitions. A window opened or
  # closed while HA was down/restarting comes back as unavailable -> on/off and was missed.
  - id: heating_reconcile_windows_on_start
    alias: Heating Reconcile Windows on Start
    description: >-
      After an HA start, re-applies the window logic once the sensors are back: an open window
      runs "Stop Heating by Window Opened" (eco) if the Nest is not in eco yet; closed windows
      with the Nest still in eco (and someone home) run "Start Quarantine by Window Closed",
      which restores heating when the quarantine ends.
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_boolean.heating_season
        state: "on"
    actions:
      # Give Zigbee window contacts and the Nest time to come back after the restart
      - delay: "00:02:00"
      - choose:
          # A window is open, but heating was not stopped
          - conditions:
              - condition: state
                entity_id: binary_sensor.windows
                state: "on"
              - condition: template
                value_template: "{{ not is_state_attr('climate.nestlocal_thermostat', 'preset_mode', 'eco') }}"
            sequence:
              - action: automation.trigger
                target:
                  entity_id: automation.stop_heating_by_window_opened
                data:
                  skip_condition: false
          # Windows are closed, but the Nest is still in eco from an earlier opening.
          # Eco is also used when nobody is home, so only act if someone (or a guest) is home.
          - conditions:
              - condition: state
                entity_id: binary_sensor.windows
                state: "off"
              - condition: template
                value_template: "{{ is_state_attr('climate.nestlocal_thermostat', 'preset_mode', 'eco') }}"
              - condition: state
                entity_id: timer.heating_quarantine
                state: "idle"
              - condition: template
                value_template: >
                  {{ is_state('binary_sensor.people_home', 'on') or
                    is_state('input_boolean.guest_mode', 'on') }}
            sequence:
              - action: automation.trigger
                target:
                  entity_id: automation.start_quarantine_by_window_closed
                data:
                  skip_condition: false
        # Otherwise (windows unavailable, or state already consistent) nothing to do

  ###############################################
  ## Thermostat Emergency Control
  ###############################################

  - id: thermostat_freeze_alert_at_night
    alias: Thermostat Freeze Alert at Night
    description: >-
      Safety net: if it gets below 20 °C at night while someone is home, cancel all
      heating timers, notify, set the Nest to the default target and turn on the hall heater.
      Re-checked hourly while the alert stays on (rescue actions repeat silently; notifications
      are sent only once per cold episode). Night = 21:00-05:59.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.freeze_alert_at_night
        from: "off"
        to: "on"
        for: "00:05:00"
      # Hourly re-check: repeat the rescue if it is still cold
      - trigger: time_pattern
        hours: "/1"
    conditions:
      - condition: state
        entity_id: input_boolean.heating_season
        state: "on"
      - condition: state
        entity_id: binary_sensor.freeze_alert_at_night
        state: "on"
      # Continue if people are home or if guest mode is enabled
      - condition: template
        value_template: >
          {{ is_state('binary_sensor.people_home', 'on') or
            is_state('input_boolean.guest_mode', 'on')}}
    actions:
      - variables:
          # [room, temperature] of the coldest of the sensors used by binary_sensor.freeze_alert_at_night
          coldest: >-
            {% set pairs = [['Термостат', state_attr('climate.nestlocal_thermostat', 'current_temperature')],
                            ['Спальня', states('sensor.ble_temperature_atc_bedroom')],
                            ['Гостиная', states('sensor.ble_temperature_atc_living_room')]] %}
            {% set ns = namespace(best=['', 99.0]) %}
            {% for p in pairs if p[1] is number or p[1] | is_number %}
              {% if p[1] | float < ns.best[1] %}{% set ns.best = [p[0], p[1] | float] %}{% endif %}
            {% endfor %}
            {{ ns.best }}
      # Reset all active timers that could affect heating
      - action: timer.cancel
        target:
          entity_id:
            - timer.heating_quarantine
            - timer.short_heating
            - timer.pause_heating
      # Notify only on the first trigger of a cold episode; the hourly re-checks repeat the
      # rescue actions below silently instead of re-sending the same notifications every hour
      - if:
          - condition: template
            value_template: "{{ trigger.platform == 'state' }}"
        then:
          # One push + persistent notification for the whole episode (E-3: was two messages)
          - action: script.notify
            data:
              level: warning
              persistent: true
              title: >-
                {% from 'ru.jinja' import num %}
                🥶 Холодно: {{ num(coldest[1]) }} °C
              message: "{{ coldest[0] }} · температура ниже порога · включено отопление"
          # Log the event
          - action: input_text.set_value
            target:
              entity_id: input_text.heating_log
            data:
              value: "Температура упала ниже порога"
      # Set default temperature on thermostat
      - action: script.thermostat_stop_heating
        data:
          message: "Температура упала ниже порога ночью → термостат переведён на 22°C"
      # Enable hall heater too
      - action: switch.turn_on
        target:
          entity_id: switch.hall_heater

  - id: thermostat_preheat_alert
    alias: Thermostat Preheat Alert
    description: >-
      Safety net: if it is above 25 °C while the Nest is still targeting 25 °C or more
      (e.g. forced heating left on), notify and reset the Nest to the default target.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: numeric_state
        entity_id: climate.nestlocal_thermostat
        attribute: current_temperature
        above: 25.0
        for: "00:05:00"
      # Hourly re-check while the temperature stays high
      - trigger: time_pattern
        hours: "/1"
    conditions:
      - condition: state
        entity_id: input_boolean.heating_season
        state: "on"
      - condition: numeric_state
        entity_id: climate.nestlocal_thermostat
        attribute: current_temperature
        above: 25.0
      # If thermostat is in «heat» mode and temperature is above the threshold
      # (a target >= 25 °C means forced heating is still applied)
      - condition: template
        value_template: >
          {{ states('climate.nestlocal_thermostat') == 'heat' and
              state_attr('climate.nestlocal_thermostat', 'temperature') | float(0) >= 25.0 }}
    actions:
      - action: script.notify
        data:
          level: warning
          persistent: true
          title: >-
            {% from 'ru.jinja' import num %}
            🥵 Жарко: {{ num(state_attr('climate.nestlocal_thermostat', 'current_temperature')) }} °C
          message: Температура выше порога · термостат переведён в авто-режим
      # Stop heating by setting default temperature on thermostat
      - action: script.thermostat_stop_heating
        data:
          message: "Температура поднялась выше порога → термостат переведён на 22°C"

  # If Thermostat is heating for more then 1 hour - notify about it and disable heating for 1 hour
  - id: thermostat_heating_duration_alert
    alias: Thermostat Heating Duration Alert
    description: >-
      If the boiler has been heating continuously for an hour, notify, pause heating
      for 1 hour (pause timer) and reset the Nest to the default target.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.thermostat_heating
        from: "off"
        to: "on"
        for: "01:00:00"
    conditions:
      - condition: state
        entity_id: input_boolean.heating_season
        state: "on"
    actions:
      # Cancel all active timers that could affect heating
      - action: timer.cancel
        target:
          entity_id:
            - timer.heating_quarantine
            - timer.short_heating
            - timer.pause_heating
      - action: script.notify
        data:
          level: warning
          persistent: true
          title: ⏸️ Отопление на паузе 1 ч
          message: >-
            Котёл работал больше часа подряд · возобновлю в {{ (now() + timedelta(hours=1)).strftime('%H:%M') }}
      # Start "Pause Heating" timer
      - action: timer.start
        target:
          entity_id: timer.pause_heating
      # Stop heating by setting default temperature on thermostat
      - action: script.thermostat_stop_heating
        data:
          message: "Термостат работает более часа → отопление отключено на 1 час"

  ###############################################
  ## Short Heating
  ###############################################

  - id: short_heating_start
    alias: Short Heating Start
    description: >-
      The "Heat 10 Minutes" button starts forced heating for the short heating timer
      duration, unless the boiler is already heating or a short heating is running.
    mode: single
    max_exceeded: silent
    triggers:
      # input_button state is its last-press timestamp, so any change = a press
      - trigger: state
        entity_id: input_button.thermostat_10_minutes_heating
    actions:
      - if:
          - or:
              - condition: state
                entity_id: binary_sensor.thermostat_heating
                state: "on"
              - condition: state
                entity_id: timer.short_heating
                state: "active"
        then:
          - action: media_player.play_media
            target:
              entity_id: media_player.yandex_station_midi
            data:
              media_content_id: Квартира уже подогревается.
              media_content_type: text
        else:
          # Reset all active timers that could affect heating
          - action: timer.cancel
            target:
              entity_id:
                - timer.heating_quarantine
                - timer.short_heating
                - timer.pause_heating
          # Start "Short Heating" timer
          - action: timer.start
            target:
              entity_id: timer.short_heating
          # Notify about heating start
          - action: media_player.play_media
            target:
              entity_id: media_player.yandex_station_midi
            data:
              # Duration from the timer itself, with the right plural form (accusative: минуту/минуты/минут)
              media_content_id: >-
                {% from 'ru.jinja' import plural %}
                Подогреваю квартиру
                {{ plural((state_attr('timer.short_heating', 'duration') | as_timedelta).total_seconds() // 60,
                          'минуту', 'минуты', 'минут') }}.
              media_content_type: text
          # Start heating
          - action: script.thermostat_start_heating
            data:
              message: "Включен кратковременный подогрев квартиры"

  - id: short_heating_end
    alias: Short Heating End
    description: >-
      When the short heating timer finishes, announce it and reset the Nest to the
      default target unless some room still requests heat. Runs in and out of the heating
      season, because the start button is not limited to the season either.
    mode: single
    max_exceeded: silent
    triggers:
      # Trigger on timer finish (not on cancel, so a window/manual stop does not land here)
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.short_heating
    # No heating_season condition: otherwise an off-season short heating left the Nest at +2 °C
    actions:
      - action: media_player.play_media
        target:
          entity_id: media_player.yandex_station_midi
        data:
          media_content_id: >-
            {% from 'ru.jinja' import plural %}
            {% set t = state_attr('climate.nestlocal_thermostat', 'current_temperature') %}
            Подогрев закончен{% if t is number %}, температура: {{ plural(t | round(0), 'градус', 'градуса', 'градусов') }}{% endif %}.
          media_content_type: text
      - if:
          # ETRVs should not be requesting heat
          - condition: state
            entity_id: binary_sensor.etrvs_requesting_heat
            state: "off"
          # Bathroom heating should not be requested
          - condition: state
            entity_id: binary_sensor.heating_request_bathroom
            state: "off"
        then:
          # Stop heating by setting default temperature on thermostat
          - action: script.thermostat_stop_heating
            data:
              message: "Кратковременный подогрев квартиры окончен"

  ###############################################
  ## Presence Control
  ###############################################

  - id: disable_heating_when_noone_home
    alias: Disable Heating When Noone Home
    description: >-
      5 minutes after everyone leaves (and guest mode is off), turn off the hall heater
      and, if the Nest is active in heating season, cancel heating timers and switch to eco.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.people_home
        from: "on"
        to: "off"
        for: "00:05:00"
    conditions:
      - condition: state
        entity_id: input_boolean.guest_mode
        state: "off"
    actions:
      # Disable hall heater regardless of the thermostat state (it may be on while a window put the Nest in eco)
      - action: switch.turn_off
        continue_on_error: true
        target:
          entity_id: switch.hall_heater
      - if:
          - condition: state
            entity_id: input_boolean.heating_season
            state: "on"
          - condition: state
            entity_id: binary_sensor.thermostat_active
            state: "on"
        then:
          # Reset all active timers that could affect heating
          - action: timer.cancel
            target:
              entity_id:
                - timer.heating_quarantine
                - timer.short_heating
                - timer.pause_heating
          # Set "eco" mode on thermostat
          - action: script.thermostat_set_eco_mode
            data:
              message: "Никого нет дома → переход в режим экономии"

  - id: restore_heating_when_someone_home
    alias: Restore Heating When Someone Home
    description: >-
      When someone comes home and the Nest is idle/eco, turn on the hall heater and
      restore the default target; if a window is open, keep the Nest in eco instead.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.people_home
        from: "off"
        to: "on"
    conditions:
      - condition: state
        entity_id: input_boolean.heating_season
        state: "on"
      - condition: state
        entity_id: binary_sensor.thermostat_active
        state: "off"
    actions:
      # Enable hall heater
      - action: switch.turn_on
        target:
          entity_id: switch.hall_heater
      # If some window is opened, restore thermostat in "off" mode
      - if:
          - condition: state
            entity_id: binary_sensor.windows
            state: "on"
        then:
          # Set "eco" mode on thermostat
          - action: script.thermostat_set_eco_mode
            data:
              message: "Окно открыто при возращении домой → сохранение режима экономии"
        # If all windows are closed, restore thermostat in "heat" mode
        else:
          # Stop heating by setting default temperature on thermostat
          - action: script.thermostat_stop_heating
            data:
              message: "Возвращение домой → отопление включено"

  ###############################################
  ## Heat request handlers
  ###############################################

  # If one of ETRV is in "heat" state and climate.nestlocal_thermostat is not in "heat" state,
  # and all windows are closed - set new thermostat target temperature by adding 2°C to
  # the current temperature to force enable heating.
  - id: start_heating_by_etrv_request
    alias: Start Heating by ETRV Request
    description: >-
      Force the boiler on when any ETRV requests heat, all windows have been closed for
      5 minutes, no timer (quarantine, pause, short heating) is running and someone is home.
      Also re-allows heating (clears a manual block).
    mode: single
    max_exceeded: silent
    # Runs every 2 minutes; keep enough traces to see a real run
    trace:
      stored_traces: 20
    triggers:
      # Trigger if some of ETRVs are requesting heat
      - trigger: state
        entity_id: binary_sensor.etrvs_requesting_heat
        from: "off"
        to: "on"
        for: 00:01:00
      # Trigger every 2 minutes to account for any changes in conditions
      - trigger: time_pattern
        minutes: "/2"
    conditions:
      - condition: state
        entity_id: input_boolean.heating_season
        state: "on"
      # If some of ETRVs are requesting heat (in case if automation was triggered by time_pattern)
      - condition: state
        entity_id: binary_sensor.etrvs_requesting_heat
        state: "on"
      # If all windows are closed for at least 5 minutes (time gap between window close and timer start)
      - condition: state
        entity_id: binary_sensor.windows
        state: "off"
        for: "00:05:00"
      # If not in quarantine time after windows were closed
      - condition: state
        entity_id: timer.heating_quarantine
        state: "idle"
      # If heating is not manually paused
      - condition: state
        entity_id: timer.pause_heating
        state: "idle"
      # If short heating is not in progress
      - condition: state
        entity_id: timer.short_heating
        state: "idle"
      # If people are home or if guest mode is enabled
      - condition: template
        value_template: >
          {{ is_state('binary_sensor.people_home', 'on') or
            is_state('input_boolean.guest_mode', 'on')}}
      # If not already heating
      - condition: state
        entity_id: binary_sensor.thermostat_heating
        state: "off"
    actions:
      # Start heating
      - action: script.thermostat_start_heating
      # Reset flag cause all conditions are met and we could allow heating again
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.heating_allowed

  - id: start_heating_in_bathroom
    alias: Start Heating in Bathroom
    description: >-
      Force the boiler on for the scheduled evening bathroom heating when the bathroom is
      below its target, regardless of windows (and the window quarantine), unless heating is
      paused or a short heating runs. Re-checked every 2 minutes, so a request that was blocked
      when it started (pause, short heating, nobody home) is picked up once the block ends.
    mode: single
    max_exceeded: silent
    # Runs every 2 minutes; keep enough traces to see a real run
    trace:
      stored_traces: 20
    triggers:
      - trigger: state
        entity_id: binary_sensor.heating_request_bathroom
        from: "off"
        to: "on"
      # Re-check while the request stays on (same pattern as "Start Heating by ETRV Request")
      - trigger: time_pattern
        minutes: "/2"
    conditions: # Ignore windows state, we need to heat the bathroom
      - condition: state
        entity_id: input_boolean.heating_season
        state: "on"
      # Bathroom still requests heat (needed for the time_pattern trigger)
      - condition: state
        entity_id: binary_sensor.heating_request_bathroom
        state: "on"
      # If heating is not manually paused
      - condition: state
        entity_id: timer.pause_heating
        state: "idle"
      # If short heating is not in progress
      - condition: state
        entity_id: timer.short_heating
        state: "idle"
      # Continue if people are home or if guest mode is enabled
      - condition: template
        value_template: >
          {{ is_state('binary_sensor.people_home', 'on') or
            is_state('input_boolean.guest_mode', 'on')}}
      # If not already heating
      - condition: state
        entity_id: binary_sensor.thermostat_heating
        state: "off"
    actions:
      - action: script.thermostat_start_heating

  # If all ETRVs are not in "heat" state - restore climate.nestlocal_thermostat target temperature.
  - id: stop_heating_by_etrv_request
    alias: Stop Heating by ETRV Request
    description: >-
      When no ETRV and not the bathroom requests heat any more but the boiler is still
      heating (and no short heating runs), reset the Nest to the default target.
    mode: single
    max_exceeded: silent
    # Runs every 2 minutes; keep enough traces to see a real run
    trace:
      stored_traces: 20
    triggers:
      # Trigger if all ETRVs are not requesting heat
      - trigger: state
        entity_id: binary_sensor.etrvs_requesting_heat
        from: "on"
        to: "off"
        for: 00:01:00
      # Trigger if bathroom is not requesting heat
      - trigger: state
        entity_id: binary_sensor.heating_request_bathroom
        from: "on"
        to: "off"
        for: 00:01:00
      # Trigger every 2 minutes (catches a still-heating boiler after missed transitions)
      - trigger: time_pattern
        minutes: "/2"
    conditions:
      - condition: state
        entity_id: input_boolean.heating_season
        state: "on"
      # If all ETRVs are not requesting heat
      - condition: state
        entity_id: binary_sensor.etrvs_requesting_heat
        state: "off"
      # If bathroom is not requesting heat
      - condition: state
        entity_id: binary_sensor.heating_request_bathroom
        state: "off"
      # If short heating is not in progress
      - condition: state
        entity_id: timer.short_heating
        state: "idle"
      # If actually heating
      - condition: state
        entity_id: binary_sensor.thermostat_heating
        state: "on"
    actions:
      # Stop heating by setting default temperature on thermostat
      - action: script.thermostat_stop_heating
        data:
          message: "ETRVs не запрашивают отопление → температура возвращена на 22°C"

  ###############################################
  ## Extra Heating Control
  ###############################################

  # Start "Pause Heating" timer if "Heating Allowed" flag was reset
  # Heating will be enabled again in "Start Heating by ETRV Request" automation
  - id: start_pause_heating_manually
    alias: Start Pause Heating Manually
    description: >-
      Turning off "Heating Allowed" blocks heating: cancel all heating timers, start the
      pause timer and reset the Nest to the default target.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: input_boolean.heating_allowed
        from: "on"
        to: "off"
    conditions:
      - condition: state
        entity_id: input_boolean.heating_season
        state: "on"
      # Pause always (also while the boiler is idle); "Start Heating by ETRV Request" waits for the timer
    actions:
      # If short heating is in progress, notify that heating was stopped
      - if:
          - condition: state
            entity_id: timer.short_heating
            state: "active"
        then:
          # Notify that heating was stopped
          - action: media_player.play_media
            target:
              entity_id: media_player.yandex_station_midi
            data:
              media_content_id: Подогрев остановлен.
              media_content_type: text
      # Reset all active timers that could affect heating
      - action: timer.cancel
        target:
          entity_id:
            - timer.heating_quarantine
            - timer.short_heating
            - timer.pause_heating
      # Start "Pause Heating" timer
      - action: timer.start
        target:
          entity_id: timer.pause_heating
      # Stop heating by setting default temperature on thermostat
      - action: script.thermostat_stop_heating
        data:
          message: "Отопление заблокировано вручную → температура возвращена на 22°C"

  # Cancel "Pause Heating" timer if "Heating Allowed" flag was set
  - id: cancel_pause_heating_manually
    alias: Cancel Pause Heating Manually
    description: >-
      Turning "Heating Allowed" back on while the pause timer runs cancels the pause and
      announces it.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: input_boolean.heating_allowed
        from: "off"
        to: "on"
    conditions:
      - condition: state
        entity_id: input_boolean.heating_season
        state: "on"
      # If "Pause Heating" timer is active
      - condition: state
        entity_id: timer.pause_heating
        state: "active"
    actions:
      # Cancel "Pause Heating" timer
      - action: timer.cancel
        target:
          entity_id: timer.pause_heating
      # Notify that heating was restored
      - action: media_player.play_media
        target:
          entity_id: media_player.yandex_station_midi
        data:
          media_content_id: Отопление снова работает.
          media_content_type: text
      # Log the message
      - action: input_text.set_value
        target:
          entity_id: input_text.heating_log
        data:
          value: "Блокировка отопления отменена вручную"

  ###############################################
  ## Logging
  ###############################################

  # Log changes of all heating-related entities
  - id: log_heating_changes
    alias: Log Heating Changes
    description: >-
      Write every state change of heating-related entities to the heating log
      for troubleshooting.
    mode: parallel
    max: 10
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.thermostat_heating
          - binary_sensor.thermostat_active
          - binary_sensor.etrvs_requesting_heat
          - binary_sensor.heating_request_bathroom
          - binary_sensor.freeze_alert_at_night
          - binary_sensor.windows
          - binary_sensor.people_home
          - input_boolean.heating_season
          - input_boolean.guest_mode
          - input_boolean.heating_allowed
          - input_number.thermostat_new_target_temperature
          - timer.heating_quarantine
          - timer.short_heating
          - timer.pause_heating
    actions:
      # Log changes only if from_state and to_state are defined (skips entity add/remove)
      - condition: template
        value_template: >-
          {{ trigger.from_state is not none and trigger.to_state is not none }}
      - action: input_text.set_value
        target:
          entity_id: input_text.heating_log
        data:
          value: >-
            {% set entity_name = states[trigger.entity_id].name | default(trigger.entity_id) %}
            {% set new_state = trigger.to_state.state %}
            {% set old_state = trigger.from_state.state %}
            Изменено состояние "{{ entity_name }}" с {{ old_state }} на {{ new_state }}

  ###############################################
  ## DANFOSS ETRV WINDOW SENSOR MAPPING
  ###############################################

  - id: sync_danfoss_etrv_window_contact_kitchen
    alias: Sync Danfoss ETRV Window Contact Kitchen
    description: >-
      Mirror the kitchen window contact to the Danfoss ETRV external window sensor
      switch so the valve closes while the window is open.
    mode: queued
    max: 3
    triggers:
      - trigger: state
        entity_id: binary_sensor.kitchen_window_contact
        for: "00:00:10"
      # Trigger every X minutes
      - trigger: time_pattern
        minutes: "/10"
    conditions:
      - condition: state
        entity_id: input_boolean.heating_season
        state: "on"
      - condition: template
        value_template: >
          {{ states('binary_sensor.kitchen_window_contact') in ['on', 'off'] }}
    actions:
      # Window open -> switch on (ETRV sees open window), closed -> off
      - action: "switch.turn_{{ states('binary_sensor.kitchen_window_contact') }}"
        target:
          entity_id: switch.danfoss_etrv0103_kitchen_external_window_sensor

  - id: sync_danfoss_etrv_window_contact_bedroom
    alias: Sync Danfoss ETRV Window Contact Bedroom
    description: >-
      Mirror the bedroom window contact to the Danfoss ETRV external window sensor
      switch so the valve closes while the window is open.
    mode: queued
    max: 3
    triggers:
      - trigger: state
        entity_id: binary_sensor.bedroom_window_contact
        for: "00:00:10"
      # Trigger every X minutes
      - trigger: time_pattern
        minutes: "/10"
    conditions:
      - condition: state
        entity_id: input_boolean.heating_season
        state: "on"
      - condition: template
        value_template: >
          {{ states('binary_sensor.bedroom_window_contact') in ['on', 'off'] }}
    actions:
      - action: "switch.turn_{{ states('binary_sensor.bedroom_window_contact') }}"
        target:
          entity_id: switch.danfoss_etrv0100_bedroom_external_window_sensor

  - id: sync_danfoss_etrv_window_contact_living_room
    alias: Sync Danfoss ETRV Window Contact Living Room
    description: >-
      Mirror the living room window contact to the Danfoss ETRV external window sensor
      switch so the valve closes while the window is open.
    mode: queued
    max: 3
    triggers:
      - trigger: state
        entity_id: binary_sensor.living_room_window_contact
        for: "00:00:10"
      # Trigger every X minutes
      - trigger: time_pattern
        minutes: "/10"
    conditions:
      - condition: state
        entity_id: input_boolean.heating_season
        state: "on"
      - condition: template
        value_template: >
          {{ states('binary_sensor.living_room_window_contact') in ['on', 'off'] }}
    actions:
      - action: "switch.turn_{{ states('binary_sensor.living_room_window_contact') }}"
        target:
          entity_id: switch.danfoss_etrv0103_living_room_external_window_sensor
