######################################################################
# File: morning_report.yaml                                          #
# Author: SenMorgan https://github.com/SenMorgan                     #
# Date: 2026-11-17                                                   #
#                                                                    #
# Info: morning report spoken by Alice when the night mode ends:     #
# today's weather and what went wrong in the house overnight         #
# (alerts, failed integrations, offline devices, backup, restarts,   #
# night door, disk, batteries). Wording in                           #
# custom_templates/morning_report.jinja. Plain                       #
# templates, no AI: predictable text, no cloud, nothing invented.    #
# Devices labelled "Offline OK" (PC-powered, fully switched off)     #
# are ignored.                                                       #
#                                                                    #
# Copyright (c) 2026 Sen Morgan                                      #
######################################################################

###############################################
## TEMPLATE ENTITIES
###############################################
template:
  # Start of the last night with a snapshot of the devices that were already offline then: in the morning
  # only devices offline now and not in the snapshot count as "went offline overnight". A snapshot, not
  # last_changed: a Core restart resets last_changed of every unavailable entity.
  - triggers:
      - trigger: state
        entity_id: input_boolean.home_night_mode
        to: "on"
    sensor:
      - name: Night Mode Started
        unique_id: night_mode_started
        device_class: timestamp
        icon: mdi:weather-night
        state: "{{ now().isoformat() }}"
        attributes:
          offline_devices: >-
            {% from 'devices.jinja' import offline_devices %}
            {{ offline_devices() | from_json }}

###############################################
## SCRIPTS
###############################################
script:
  morning_report:
    alias: Morning Report
    description: >-
      Builds the morning report and returns it as {speech, message}: speech is a short Russian text for Alice
      (weather, then overnight problems or "all quiet"), message is the full text for the phone (weather,
      devices that went offline overnight, alerts, low batteries, overdue backup, everything offline now).
      Does not speak or notify itself; the caller decides where it goes.
    icon: mdi:weather-sunset-up
    mode: parallel
    sequence:
      # Daily forecast for the temperature, hourly for when it rains. The report must still work if Met.no
      # is down: then the weather part says so
      - action: weather.get_forecasts
        continue_on_error: true
        target:
          entity_id: weather.home_assistant_blue
        data:
          type: daily
        response_variable: daily_response
      - action: weather.get_forecasts
        continue_on_error: true
        target:
          entity_id: weather.home_assistant_blue
        data:
          type: hourly
        response_variable: hourly_response
      # collect() reads the facts, render() words them (custom_templates/morning_report.jinja; render() is
      # tested with made-up facts, see the header there)
      - variables:
          report: >-
            {% from 'morning_report.jinja' import collect, render %}
            {% set key = 'weather.home_assistant_blue' %}
            {% set daily = (daily_response | default({})).get(key, {}).get('forecast', []) %}
            {% set hourly = (hourly_response | default({})).get(key, {}).get('forecast', []) %}
            {{ render(collect(daily, hourly) | from_json) | from_json }}
      - stop: Report ready
        response_variable: report
