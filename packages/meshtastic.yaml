###############################################
## Automations
###############################################
automation:
  - id: meshtastic_echo_morgans_channel
    alias: Meshtastic Echo Morgans Channel
    description: >-
      Diagnostic echo for the Meshtastic "Morgans" channel: replies with "PONG: <original text>"
      to any message containing "test" or "ping" so senders can verify the gateway is alive.
    mode: single
    triggers:
      - domain: meshtastic
        device_id: 947c380b053ad3e802a5f3cea373825f
        type: channel_message.received
        entity_id: meshtastic.gateway_lrnr_channel_morgans
        trigger: device
    conditions:
      # Case-insensitive match on the received message text
      - condition: template
        value_template: '{{ "test" in (trigger.event.data.message | lower) or "ping" in (trigger.event.data.message | lower) }}'
    actions:
      # Short pause so the reply doesn't collide with the incoming transmission
      - delay:
          seconds: 2
      - action: meshtastic.broadcast_channel_message
        metadata: {}
        data:
          ack: true
          channel: meshtastic.gateway_lrnr_channel_morgans
          message: "PONG: {{ trigger.event.data.message }}"

  - id: meshtastic_echo_home_temperature_sensors
    alias: Meshtastic Echo Home Temperature Sensors
    description: >-
      When a message containing "status" arrives on the Meshtastic "Morgans" channel, replies
      with current readings of the home BLE (ATC) and IKEA Vindstyrka sensors, split into
      several messages to fit the mesh message size limit.
    mode: single
    triggers:
      - domain: meshtastic
        device_id: 947c380b053ad3e802a5f3cea373825f
        type: channel_message.received
        entity_id: meshtastic.gateway_lrnr_channel_morgans
        trigger: device
    conditions:
      - condition: template
        value_template: '{{ "status" in (trigger.event.data.message | lower) }}'
    actions:
      - delay:
          seconds: 2
      - variables:
          entity_pattern: 'sensor.ble_temperature_atc_.*|sensor.ikea_vindstyrka_.*'  # Pattern to match relevant sensors
          max_message_length: 200  # 200 characters is a common limit for mesh messages
          message_header: "Home Sensors:"  # Header for each message chunk
          # Build a list of message chunks: each starts with the header and gets rows appended
          # until the next row would exceed max_message_length, then a new chunk is started
          message_chunks: >-
            {% set lines = states.sensor | selectattr('entity_id', 'match', entity_pattern) | map(attribute='entity_id') | list %}
            {% set ns = namespace(chunks=[], current=message_header) %}
            {% for line in lines %}
              {% set state_value = states(line) | float(0) | round(2) if (states(line) | is_number) else 'N/A' %}
              {% set state_name = state_attr(line, 'friendly_name') | default(line) %}
              {% set state_time = states[line].last_updated | default('N/A') %}
              {% set row = '🌡' ~(state_value) ~ '°C — ' ~ state_name ~ ' (' ~ (state_time | relative_time) ~ ' ago)' %}
              {% set candidate = ns.current ~ '\n' ~ row %}
              {% if candidate | length > max_message_length and ns.current != message_header %}
                {% set ns.chunks = ns.chunks + [ns.current] %}
                {% set ns.current = message_header ~ '\n' ~ row %}
              {% else %}
                {% set ns.current = candidate %}
              {% endif %}
            {% endfor %}
            {% if ns.current != message_header %}
              {% set ns.chunks = ns.chunks + [ns.current] %}
            {% endif %}
            {% if ns.chunks | length == 0 %}
              {% set ns.chunks = [message_header ~ '\nNo sensor data available'] %}
            {% endif %}
            {{ ns.chunks }}
      # Send chunks one by one with a short gap to avoid flooding the mesh
      - repeat:
          for_each: "{{ message_chunks }}"
          sequence:
            - action: meshtastic.broadcast_channel_message
              metadata: {}
              data:
                ack: true
                channel: meshtastic.gateway_lrnr_channel_morgans
                message: "{{ repeat.item }}"
            - delay:
                seconds: 1

  - id: meshtastic_notification_internet_connection
    alias: Meshtastic Notification Internet Connection
    description: >-
      Broadcasts internet connection loss/restore to the Meshtastic "Morgans" channel, which
      still works when the internet is down (unlike mobile push notifications).
    mode: queued
    triggers:
      - trigger: state
        entity_id: binary_sensor.internet_connection
    conditions:
      # Ignore transitions to/from unavailable/unknown (e.g. during startup)
      - condition: template
        value_template: "{{ trigger.to_state.state in ['on', 'off'] }}"
    actions:
      - if:
          - condition: state
            entity_id: binary_sensor.internet_connection
            state: "off"
        then:
          - action: meshtastic.broadcast_channel_message
            metadata: {}
            data:
              ack: true
              channel: meshtastic.gateway_lrnr_channel_morgans
              message: "⚠️ Home Assistant: Интернет соединение потеряно в {{ states('sensor.time') }}"
        else:
          - action: meshtastic.broadcast_channel_message
            metadata: {}
            data:
              ack: true
              channel: meshtastic.gateway_lrnr_channel_morgans
              message: "✅ Home Assistant: Интернет соединение восстановлено в {{ states('sensor.time') }}"
