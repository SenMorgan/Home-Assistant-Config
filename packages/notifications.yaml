###############################################
## SETTINGS AND VARIABLES
###############################################
homeassistant:
  customize:
    package.node_anchors:
      sys_notify_title_info: &sys_notify_title_info "💬 Системное уведомление"
      sys_notify_title_warning: &sys_notify_title_warning "⚠️ Предупреждение"
      sys_notify_title_critical: &sys_notify_title_critical "🚨 Внимание!"

###############################################
## BINARY SENSORS
###############################################
binary_sensor:
  - platform: trend
    sensors:
      diesel_price_ono_trend:
        friendly_name: "Diesel Price ONO Trend"
        entity_id: sensor.diesel_price_ono
      gasoline_price_ono_trend:
        friendly_name: "Gasoline Price ONO Trend"
        entity_id: sensor.gasoline_price_ono

###############################################
## SCRIPTS
###############################################
script:
  ###############################################
  ## Central notification script (AR-02)
  ###############################################
  # One entry point for all notifications, see docs/notifications_catalog.md (section 0).
  # Levels: critical -> both phones, alarm stream (bypasses DND), always spoken (speaker + phone voice);
  #         warning  -> Sen, high priority, spoken only if someone is home and not night/silent mode;
  #         info     -> Sen, default importance, spoken under the same conditions;
  #         status   -> Sen, silent low-importance status that replaces itself by tag.
  notify:
    alias: Notify
    description: >-
      Central notification script. Sends a push with level-specific Android channel/priority, the event
      time (data.when, so a late-delivered push still shows when it happened), optional tag, tap URL and
      action buttons; optionally a persistent notification and a voice announcement on Yandex Station Midi
      (critical: also spoken on both phones via the alarm stream).
    mode: parallel
    max: 25
    fields:
      level:
        description: critical / warning / info / status
        default: info
        selector:
          select:
            options: [critical, warning, info, status]
      title:
        description: Title (category emoji + 2-4 words)
        required: true
        selector:
          text:
      message:
        description: Body (facts separated by " · ")
        selector:
          text:
            multiline: true
      tag:
        description: Replace the previous push with the same tag (statuses only, never safety events)
        selector:
          text:
      url:
        description: What a tap opens (dashboard path or URL)
        selector:
          text:
      actions:
        description: "Action buttons: list of {action, title[, uri]}"
        selector:
          object:
      tts:
        description: Spoken text (no emoji or abbreviations); omit for no voice
        selector:
          text:
      persistent:
        description: Also create a persistent notification (default on for critical/warning)
        selector:
          boolean:
      notification_id:
        description: Persistent notification ID (same ID replaces the previous one)
        selector:
          text:
      when:
        description: Event time as a UNIX timestamp (default now)
        selector:
          number:
            min: 0
            max: 9999999999
            mode: box
      data:
        description: Extra push data merged last (e.g. image)
        selector:
          object:
      recipients:
        description: Override recipients (list of notify actions without "notify.")
        selector:
          object:
    sequence:
      - variables:
          lvl: "{{ level | default('info') }}"
          # Critical goes to both phones (Sen + Kris), everything else to Sen only
          targets: >-
            {% if recipients is defined and recipients %}{{ recipients }}
            {% elif lvl == 'critical' %}{{ ['mobile_app_sen_s25', 'mobile_app_sm_s931b'] }}
            {% else %}{{ ['mobile_app_sen_s25'] }}{% endif %}
          # Android channels: the channel's sound/importance is fixed on first use, so names stay stable
          level_data: >-
            {% if lvl == 'critical' %}{{ {'channel': 'alarm_stream', 'importance': 'high', 'priority': 'high', 'ttl': 0} }}
            {% elif lvl == 'warning' %}{{ {'channel': 'Предупреждения', 'importance': 'high', 'priority': 'high', 'ttl': 0} }}
            {% elif lvl == 'status' %}{{ {'channel': 'Статус', 'importance': 'low', 'alert_once': true} }}
            {% else %}{{ {'channel': 'Дом', 'importance': 'default'} }}{% endif %}
          push_data: >-
            {% set d = dict(level_data, when=(when | default(as_timestamp(now())) | int)) %}
            {% if tag is defined and tag %}{% set d = dict(d, tag=tag) %}{% endif %}
            {% if url is defined and url %}{% set d = dict(d, clickAction=url, url=url) %}{% endif %}
            {% if actions is defined and actions %}{% set d = dict(d, actions=actions) %}{% endif %}
            {% if data is defined and data %}{% set d = dict(d, **data) %}{% endif %}
            {{ d }}
          make_persistent: "{{ persistent if persistent is defined else lvl in ['critical', 'warning'] }}"
          # Speaker: critical always; otherwise only if someone is home and neither night nor silent mode
          speak: >-
            {{ tts is defined and tts != '' and (lvl == 'critical' or (
                 is_state('binary_sensor.people_home', 'on')
                 and is_state('input_boolean.home_night_mode', 'off')
                 and is_state('input_boolean.silent_mode', 'off'))) }}
      - repeat:
          for_each: "{{ targets }}"
          sequence:
            # One unreachable phone must not block the other one or the speaker
            - action: notify.{{ repeat.item }}
              continue_on_error: true
              data:
                title: "{{ title }}"
                message: "{{ message | default('') }}"
                data: "{{ push_data }}"
      - if:
          - "{{ make_persistent }}"
        then:
          - action: persistent_notification.create
            data:
              title: "{{ title }}"
              message: "{{ message | default('') }}"
              notification_id: "{{ notification_id | default(tag | default(none)) }}"
      - if:
          - "{{ speak }}"
        then:
          - action: media_player.play_media
            continue_on_error: true
            target:
              entity_id: media_player.yandex_station_midi
            data:
              media_content_id: "{{ tts }}"
              media_content_type: text
      # Critical: also speak on the phones through the alarm stream (audible even in silent mode)
      - if:
          - "{{ lvl == 'critical' and tts is defined and tts != '' }}"
        then:
          - repeat:
              for_each: "{{ targets }}"
              sequence:
                - action: notify.{{ repeat.item }}
                  continue_on_error: true
                  data:
                    message: TTS
                    data:
                      tts_text: "{{ tts }}"
                      media_stream: alarm_stream_max

  notify_and_create_persistent_notification:
    alias: Notify and Create Persistent Notification
    description: >-
      Helper used by other automations: sends a push notification to Sen's phone (with optional
      extra `data`, e.g. action buttons) and creates the same persistent notification in HA.
      Fields: title, message, data (optional).
    sequence:
      - action: notify.mobile_app_sen_s25
        data:
          title: "{{ title }}"
          message: "{{ message }}"
          # If data is not empty, then add it to the notification
          data: >
            {% if data is defined %}
              {{ data }}
            {% else %}
              {}
            {% endif %}
      - action: persistent_notification.create
        data:
          title: "{{ title }}"
          message: "{{ message }}"

###############################################
## TEMPLATE ENTITIES
###############################################
template:
  # Snow expected in the next 3 hours according to the Met.no hourly forecast
  - triggers:
      - trigger: time_pattern
        minutes: 7
      - trigger: homeassistant
        event: start
    actions:
      - action: weather.get_forecasts
        continue_on_error: true
        target:
          entity_id: weather.home_assistant_blue
        data:
          type: hourly
        response_variable: fc
    binary_sensor:
      - name: Snow Expected Soon
        unique_id: snow_expected_soon
        icon: mdi:weather-snowy
        state: >-
          {% set f = fc['weather.home_assistant_blue'].forecast[:3] if fc is defined and fc else [] %}
          {{ f | selectattr('condition', 'in', ['snowy', 'snowy-rainy']) | list | count > 0 }}
        attributes:
          precipitation_mm: >-
            {% set f = fc['weather.home_assistant_blue'].forecast[:3] if fc is defined and fc else [] %}
            {{ f | selectattr('condition', 'in', ['snowy', 'snowy-rainy']) | map(attribute='precipitation') | map('float', 0) | sum | round(1) }}
          first_hour: >-
            {% set f = fc['weather.home_assistant_blue'].forecast[:3] if fc is defined and fc else [] %}
            {% set snowy = f | selectattr('condition', 'in', ['snowy', 'snowy-rainy']) | list %}
            {{ (snowy[0].datetime | as_datetime | as_local).strftime('%H:%M') if snowy else none }}
          min_temperature: >-
            {% set f = fc['weather.home_assistant_blue'].forecast[:3] if fc is defined and fc else [] %}
            {% set snowy = f | selectattr('condition', 'in', ['snowy', 'snowy-rainy']) | list %}
            {{ snowy | map(attribute='temperature') | min if snowy else none }}

###############################################
## AUTOMATIONS
###############################################
automation:
  # Snow forecast from Met.no (replaces the OpenWeatherMap snow sensor, API 2.5 is deprecated)
  - id: notification_snow
    alias: Notification Snow
    description: >-
      Push notification when Met.no forecasts snow within the next 3 hours (binary_sensor.snow_expected_soon
      turns on), with start time, expected precipitation and minimum temperature.
    triggers:
      - trigger: state
        entity_id: binary_sensor.snow_expected_soon
        from: "off"
        to: "on"
    actions:
      - action: script.notify
        data:
          level: info
          tag: SNOW_ALERT
          title: ❄️ Ожидается снег
          message: >-
            {% from 'ru.jinja' import num %}
            Сегодня с {{ state_attr('binary_sensor.snow_expected_soon', 'first_hour') }} ·
            {{ num(state_attr('binary_sensor.snow_expected_soon', 'precipitation_mm')) }} мм ·
            до {{ num(state_attr('binary_sensor.snow_expected_soon', 'min_temperature')) }} °C
          data:
            notification_icon: mdi:snowflake

  - id: notification_diesel_price_changed
    alias: Notification Diesel Price Changed
    description: >-
      Notifies Sen when the ONO diesel price changes (arrow up/down, old price, difference) with a chart
      button; tagged per fuel, so only the latest price stays in the notification shade.
    triggers:
      - trigger: state
        entity_id: sensor.diesel_price_ono
    conditions:
      # Only real numeric price changes: skip attribute-only updates and unavailable/unknown states
      - condition: template
        value_template: >
          {{ trigger.from_state.state != trigger.to_state.state }}
      - condition: template
        value_template: >
          {{ is_number(trigger.from_state.state) and is_number(trigger.to_state.state) }}
    actions:
      - variables:
          old: "{{ trigger.from_state.state | float(0) }}"
          new: "{{ trigger.to_state.state | float(0) }}"
      - action: script.notify
        data:
          level: info
          tag: fuel_diesel
          title: >-
            {% from 'ru.jinja' import num %}
            ⛽ Дизель {{ '↑' if new > old else '↓' }} {{ num(new, 2) }} Kč/л
          message: >-
            {% from 'ru.jinja' import num %}
            Было {{ num(old, 2) }} · {{ '+' if new > old else '−' }}{{ num((new - old) | abs, 2) }}
          actions:
            - action: URI
              title: 📈 График
              uri: /lovelace/diesel-price

  - id: notification_gasoline_price_changed
    alias: Notification Gasoline Price Changed
    description: >-
      Notifies Kris when the ONO gasoline price changes (arrow up/down, old price, difference) with a chart
      button; tagged, so only the latest price stays in the notification shade.
    triggers:
      - trigger: state
        entity_id: sensor.gasoline_price_ono
    conditions:
      # Only real numeric price changes: skip attribute-only updates and unavailable/unknown states
      - condition: template
        value_template: >
          {{ trigger.from_state.state != trigger.to_state.state }}
      - condition: template
        value_template: >
          {{ is_number(trigger.from_state.state) and is_number(trigger.to_state.state) }}
    actions:
      - variables:
          old: "{{ trigger.from_state.state | float(0) }}"
          new: "{{ trigger.to_state.state | float(0) }}"
      - action: script.notify
        data:
          level: info
          recipients: [mobile_app_sm_s931b]
          tag: fuel_gasoline
          title: >-
            {% from 'ru.jinja' import num %}
            ⛽ Бензин {{ '↑' if new > old else '↓' }} {{ num(new, 2) }} Kč/л
          message: >-
            {% from 'ru.jinja' import num %}
            Было {{ num(old, 2) }} · {{ '+' if new > old else '−' }}{{ num((new - old) | abs, 2) }}
          actions:
            - action: URI
              title: 📈 График
              uri: /lovelace/gasoline-price

  - id: notification_solar_panel_power_above_threshold
    alias: Notification Solar Panel Power Above Threshold
    description: Notifies when the solar panel produces more than 40 W for 5 minutes.
    triggers:
      - trigger: numeric_state
        entity_id: sensor.solar_panel_power
        above: 40
        for: "00:05:00"
    actions:
      - action: script.notify
        data:
          level: info
          title: "☀️ Солнце: {{ states('sensor.solar_panel_power') | float(0) | round(0) | int }} Вт"
          message: >-
            {% from 'ru.jinja' import num %}
            Выработано {{ num(states('sensor.solar_panel_energy') | float(0) / 1000, 2) }} кВт·ч

  # Notify on washing finish
  - id: notification_washing_finish
    alias: Notification Washing Finish
    description: When the SmartThings washing machine reports a finished job, runs the Yandex script that announces it (with a joke).
    triggers:
      - trigger: state
        entity_id: sensor.washing_machine_washer_job_state
        to: "finish"
    # Ignore "finish" after SmartThings reconnects (from unavailable/unknown/none) or repeated finish
    conditions:
      - condition: template
        value_template: "{{ trigger.from_state.state not in ['unavailable', 'unknown', 'none', 'finish'] }}"
    actions:
      - action: script.yandex_joke_after_washing_clothes

  - id: notification_shopping_list_sen
    alias: Notification Shopping List for Sen
    description: >-
      Shopping list reminder when Sen has been in the JIP supermarket zone for 2 minutes and
      the list is not empty; refreshes the list first and offers to open it on the phone.
    mode: single
    triggers:
      - trigger: state
        entity_id: person.sen
        to: "JIP"
        for: "00:02:00"
    conditions:
      - condition: numeric_state
        entity_id: todo.shopping_list
        above: 0
    actions:
      - action: script.update_shopping_list
      # First three open items for the preview
      - action: todo.get_items
        target:
          entity_id: todo.shopping_list
        data:
          status: needs_action
        response_variable: shopping
      - variables:
          items: "{{ shopping['todo.shopping_list']['items'] | map(attribute='summary') | list }}"
      - action: script.notify
        data:
          level: info
          recipients: [mobile_app_sen_s25]
          title: "🛒 Рядом {{ states('person.sen') }}"
          message: >-
            В списке {{ items | count }}: {{ items[:3] | join(', ') }}{{ '…' if items | count > 3 }}
          url: /todo?entity_id=todo.shopping_list

  - id: notification_shopping_list_kris
    alias: Notification Shopping List for Kris
    description: >-
      Shopping list reminder when Kris has been in the JIP supermarket zone for 2 minutes and
      the list is not empty; refreshes the list first and offers to open it on the phone.
    mode: single
    triggers:
      - trigger: state
        entity_id: person.kris
        to: "JIP"
        for: "00:02:00"
    conditions:
      - condition: numeric_state
        entity_id: todo.shopping_list
        above: 0
    actions:
      - action: script.update_shopping_list
      # First three open items for the preview
      - action: todo.get_items
        target:
          entity_id: todo.shopping_list
        data:
          status: needs_action
        response_variable: shopping
      - variables:
          items: "{{ shopping['todo.shopping_list']['items'] | map(attribute='summary') | list }}"
      - action: script.notify
        data:
          level: info
          recipients: [mobile_app_sm_s931b]
          title: "🛒 Рядом {{ states('person.kris') }}"
          message: >-
            В списке {{ items | count }}: {{ items[:3] | join(', ') }}{{ '…' if items | count > 3 }}
          url: /todo?entity_id=todo.shopping_list

  - id: weather_forecast_alert_helper
    alias: Weather Forecast Alert Helper
    description: >-
      Every morning at 06:00 checks the hourly forecast for the next 12 hours and sends a sticky
      push notification (Russian) if cold, rain or snow (hot is disabled) is expected for more than 2 hours.
      Based on a community weather-alert blueprint; tune behaviour via the variables below.
    mode: single
    triggers:
      - trigger: time
        at: "06:00:00"
    actions:
      # Tunable parameters: which alerts are enabled, thresholds and lookahead window
      - variables:
          weather_entity: weather.home_assistant_blue
          temp_unit: "{{ state_attr(weather_entity, 'temperature_unit') }}"
          notify_group: mobile_app_sen_s25
          enable_snow: true
          enable_rain: true
          enable_cold: true
          enable_hot: false
          low_temp_threshold: 0
          high_temp_threshold: 100
          num_hours_threshold: 2
          num_hours_lookahead: 12
        alias: Define variables from input params
      - action: weather.get_forecasts
        metadata: {}
        data:
          type: hourly
        target:
          entity_id: "{{ weather_entity }}"
        response_variable: action_response
        alias: Get hourly weather for given entity
      - variables:
          forecast: "{{ action_response[weather_entity]['forecast'][:num_hours_lookahead] }}"
          datetimes: >-
            {{ forecast | map(attribute='datetime') | map('as_datetime') |
            map('as_local') | list }}
          temps: "{{ forecast | map(attribute='temperature') | list }}"
          min_temp: "{{ temps | min }}"
          max_temp: "{{ temps | max }}"
          min_temp_idx: "{{ temps.index(min_temp) }}"
          max_temp_idx: "{{ temps.index(max_temp) }}"
          min_temp_hour: "{{ forecast[min_temp_idx]['datetime'] | as_datetime | as_local }}"
          max_temp_hour: "{{ forecast[max_temp_idx]['datetime'] | as_datetime | as_local }}"
          avg_temp: "{{ temps | average | round(1) }}"
          cold_hours: >-
            {{ forecast | selectattr('temperature', 'le', low_temp_threshold) | list
            }}
          hot_hours: >-
            {{ forecast | selectattr('temperature', 'ge', high_temp_threshold) |
            list }}
          snowy_hours: >-
            {{ forecast | selectattr('condition', 'search', '(?i)snow|flurr(y|ies)')
            | list }}
          rainy_hours: "{{ forecast | selectattr('condition', 'search', '(?i)rain') | list }}"
          precip_prob_snowy_hours: "{{ snowy_hours | map(attribute='precipitation_probability') | list }}"
          precip_prob_rainy_hours: "{{ rainy_hours | map(attribute='precipitation_probability') | list }}"
          # An alert fires only if the condition lasts longer than num_hours_threshold hours
          cold_alert: "{{ enable_cold and cold_hours | count > num_hours_threshold }}"
          hot_alert: "{{ enable_hot and hot_hours | count > num_hours_threshold }}"
          rain_alert: "{{ enable_rain and rainy_hours | count > num_hours_threshold }}"
          snow_alert: "{{ enable_snow and snowy_hours | count > num_hours_threshold }}"
        alias: Parse response and define new variables
      - alias: If any weather conditions warrant notification
        condition: template
        value_template: "{{ cold_alert or rain_alert or snow_alert or hot_alert}}"
      # Russian message, one line per active alert (catalog rule: one language)
      - variables:
          notification_message: >-
            {% from 'ru.jinja' import num, plural %}
            {%- set lines = [] %}
            {%- if cold_alert %}{% set lines = lines + ['🥶 Мороз ' ~ plural(cold_hours | count, 'час', 'часа', 'часов') ~ ', до ' ~ num(min_temp) ~ ' °C в ' ~ min_temp_hour.strftime('%H:%M')] %}{% endif %}
            {%- if hot_alert %}{% set lines = lines + ['🥵 Жара ' ~ plural(hot_hours | count, 'час', 'часа', 'часов') ~ ', до ' ~ num(max_temp) ~ ' °C в ' ~ max_temp_hour.strftime('%H:%M')] %}{% endif %}
            {%- if rain_alert %}{% set lines = lines + ['🌧️ Дождь ' ~ plural(rainy_hours | count, 'час', 'часа', 'часов') ~ ', вероятность до ' ~ ((precip_prob_rainy_hours | reject('none') | list) or [0]) | max ~ ' %'] %}{% endif %}
            {%- if snow_alert %}{% set lines = lines + ['❄️ Снег ' ~ plural(snowy_hours | count, 'час', 'часа', 'часов') ~ ', вероятность до ' ~ ((precip_prob_snowy_hours | reject('none') | list) or [0]) | max ~ ' %'] %}{% endif %}
            {{ lines | join(' · ') }}
          notification_title: >-
            🌦️ Прогноз на {{ num_hours_lookahead }} ч: {{ ['мороз' if cold_alert, 'жара' if hot_alert, 'дождь' if
            rain_alert, 'снег' if snow_alert] | select() | join(', ') }}
      - action: script.notify
        data:
          level: info
          recipients: ["{{ notify_group }}"]
          tag: WEATHER_ALERT
          title: "{{ notification_title }}"
          message: "{{ notification_message }}"
          url: entityId:{{ weather_entity }}
          data:
            sticky: true
            notification_icon: mdi:weather-cloudy-alert

  - id: notification_github_repo_stars_changed
    alias: Notification GitHub Repo Stars Changed
    description: Notifies when the star count of one of the tracked GitHub repositories goes up or down.
    triggers:
      - trigger: state
        entity_id:
          - sensor.senmorgan_ex_habridge_stars
          - sensor.senmorgan_home_assistant_config_stars
    conditions:
      # Both states numeric and different: ignore unavailable/unknown and attribute-only updates
      - condition: template
        value_template: >
          {{ trigger.from_state.state | is_number and trigger.to_state.state | is_number
             and trigger.from_state.state != trigger.to_state.state }}
    actions:
      # Real difference, not always "one star" (E-7)
      - variables:
          diff: "{{ trigger.to_state.state | int - trigger.from_state.state | int }}"
      - action: script.notify
        data:
          level: info
          title: >-
            ⭐ {{ state_attr(trigger.entity_id, 'friendly_name') | replace(' Stars', '') }}: {{ trigger.to_state.state }}
          message: >-
            {% from 'ru.jinja' import plural_form %}
            {{ '+' if diff > 0 else '−' }}{{ diff | abs }} {{ plural_form(diff | abs, 'звезда', 'звезды', 'звёзд') }}

  - id: notification_christmas_devices_season
    alias: Notification Christmas Devices Season
    description: >-
      Twice a year reminds to enable (last Saturday of November) or disable
      (first Saturday of February) all devices labelled "Christmas".
      HA has no action to enable/disable devices, so this is a reminder that
      opens the device list filtered by the label.
    mode: single
    triggers:
      # Check once a day; the date logic lives in the condition below
      - trigger: time
        at: "09:30:00"
    conditions:
      # weekday() == 5 is Saturday.
      # November has 30 days, so its last Saturday is always on day 24-30.
      # The first Saturday of February is always on day 1-7.
      - condition: template
        value_template: >
          {% set n = now() %}
          {{ n.weekday() == 5 and ((n.month == 11 and n.day > 23) or (n.month == 2 and n.day <= 7)) }}
    actions:
      - variables:
          # True in November (season starts), false in February (season ends)
          season_start: "{{ now().month == 11 }}"
          # Device list filtered by the label. In November the devices are disabled,
          # and disabled devices are hidden by default, so status=disabled shows them too.
          # In February they are enabled and shown without the extra filter.
          devices_url: >-
            /config/devices/dashboard?historyBack=1&label=christmas{{ '&status=disabled' if now().month == 11 else '' }}
          # Display names of everything labelled "Christmas".
          # Labels are read dynamically, so newly labelled devices are included automatically.
          devices: >
            {% set ns = namespace(names=[]) %}
            {% for d in label_devices('christmas') %}
              {% set ns.names = ns.names + [device_attr(d, 'name_by_user') or device_attr(d, 'name')] %}
            {% endfor %}
            {{ ns.names }}
      - action: notify.mobile_app_sen_s25
        data:
          title: "{{ '🎄 Рождественский сезон' if season_start else '📦 Рождество закончилось' }}"
          # Folded block: the blank line below becomes a line break in the message
          message: >
            {{ 'Пора включить' if season_start else 'Пора отключить' }} рождественские устройства:
            {{ devices | join(', ') }}.

            Нажмите, чтобы открыть список.
          data:
