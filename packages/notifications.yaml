###############################################
## SETTINGS AND VARIABLES
###############################################
homeassistant:
  customize:
    package.node_anchors:
      sys_notify_title_info: &sys_notify_title_info "💬 Системное уведомление"
      sys_notify_title_warning: &sys_notify_title_warning "⚠️ Предупреждение"
      sys_notify_title_critical: &sys_notify_title_critical "🚨 Внимание!"

###############################################
## BINARY SENSORS
###############################################
binary_sensor:
  - platform: trend
    sensors:
      diesel_price_ono_trend:
        friendly_name: "Diesel Price ONO Trend"
        entity_id: sensor.diesel_price_ono
      gasoline_price_ono_trend:
        friendly_name: "Gasoline Price ONO Trend"
        entity_id: sensor.gasoline_price_ono

###############################################
## SCRIPTS
###############################################
script:
  notify_and_create_persistent_notification:
    alias: Notify and Create Persistent Notification
    sequence:
      - action: notify.mobile_app_sen_s25
        data:
          title: "{{ title }}"
          message: "{{ message }}"
          # If data is not empty, then add it to the notification
          data: >
            {% if data is defined %}
              {{ data }}
            {% else %}
              {}
            {% endif %}
      - action: persistent_notification.create
        data:
          title: "{{ title }}"
          message: "{{ message }}"

###############################################
## TEMPLATE ENTITIES
###############################################
template:
  # Snow expected in the next 3 hours according to the Met.no hourly forecast
  - triggers:
      - trigger: time_pattern
        minutes: 7
      - trigger: homeassistant
        event: start
    actions:
      - action: weather.get_forecasts
        continue_on_error: true
        target:
          entity_id: weather.home_assistant_blue
        data:
          type: hourly
        response_variable: fc
    binary_sensor:
      - name: Snow Expected Soon
        unique_id: snow_expected_soon
        icon: mdi:weather-snowy
        state: >-
          {% set f = fc['weather.home_assistant_blue'].forecast[:3] if fc is defined and fc else [] %}
          {{ f | selectattr('condition', 'in', ['snowy', 'snowy-rainy']) | list | count > 0 }}
        attributes:
          precipitation_mm: >-
            {% set f = fc['weather.home_assistant_blue'].forecast[:3] if fc is defined and fc else [] %}
            {{ f | selectattr('condition', 'in', ['snowy', 'snowy-rainy']) | map(attribute='precipitation') | map('float', 0) | sum | round(1) }}
          first_hour: >-
            {% set f = fc['weather.home_assistant_blue'].forecast[:3] if fc is defined and fc else [] %}
            {% set snowy = f | selectattr('condition', 'in', ['snowy', 'snowy-rainy']) | list %}
            {{ (snowy[0].datetime | as_datetime | as_local).strftime('%H:%M') if snowy else none }}
          min_temperature: >-
            {% set f = fc['weather.home_assistant_blue'].forecast[:3] if fc is defined and fc else [] %}
            {% set snowy = f | selectattr('condition', 'in', ['snowy', 'snowy-rainy']) | list %}
            {{ snowy | map(attribute='temperature') | min if snowy else none }}

###############################################
## AUTOMATIONS
###############################################
automation:
  # Snow forecast from Met.no (replaces the OpenWeatherMap snow sensor, API 2.5 is deprecated)
  - id: "notification_snow"
    alias: Notification Snow
    triggers:
      - trigger: state
        entity_id: binary_sensor.snow_expected_soon
        from: "off"
        to: "on"
    actions:
      - action: notify.mobile_app_sen_s25
        data:
          title: ❄️ Ожидается снег
          message: >-
            С {{ state_attr('binary_sensor.snow_expected_soon', 'first_hour') }}
            · {{ state_attr('binary_sensor.snow_expected_soon', 'precipitation_mm') }} мм осадков
            · до {{ state_attr('binary_sensor.snow_expected_soon', 'min_temperature') }} °C
          data:
            tag: SNOW_ALERT
            notification_icon: mdi:snowflake

  - id: "notification_diesel_price_changed"
    alias: Notification Diesel Price Changed
    triggers:
      - trigger: state
        entity_id: sensor.diesel_price_ono
    conditions:
      - condition: template
        value_template: >
          {{ trigger.from_state.state != trigger.to_state.state }}
      - condition: template
        value_template: >
          {{ is_number(trigger.from_state.state) and is_number(trigger.to_state.state) }}
    actions:
      - action: script.notify_and_create_persistent_notification
        data:
          title: *sys_notify_title_info
          message: >
            Цена дизеля {{ 'упала' if trigger.from_state.state | float(0) > trigger.to_state.state | float(0) else 'возрасла' }}
            с {{ trigger.from_state.state }} до {{ trigger.to_state.state }} Kč/L
          data:
            actions:
              - action: "URI"
                title: 📈 Open Chart
                uri: "/lovelace/diesel-price"

  - id: "notification_gasoline_price_changed"
    alias: Notification Gasoline Price Changed
    triggers:
      - trigger: state
        entity_id: sensor.gasoline_price_ono
    conditions:
      - condition: template
        value_template: >
          {{ trigger.from_state.state != trigger.to_state.state }}
      - condition: template
        value_template: >
          {{ is_number(trigger.from_state.state) and is_number(trigger.to_state.state) }}
    actions:
      - action: notify.mobile_app_sm_s931b
        data:
          title: *sys_notify_title_info
          message: >
            Цена бензина {{ 'упала' if trigger.from_state.state | float(0) > trigger.to_state.state | float(0) else 'возрасла' }}
            с {{ trigger.from_state.state }} до {{ trigger.to_state.state }} Kč/L
          data:
            actions:
              - action: "URI"
                title: 📈 Open Chart
                uri: "/lovelace/gasoline-price"

  - id: "notification_solar_panel_power_above_threshold"
    alias: Notification Solar Panel Power Above Threshold
    triggers:
      - trigger: numeric_state
        entity_id: sensor.solar_panel_power
        above: 40
        for: "00:05:00"
    actions:
      - action: notify.mobile_app_sen_s25
        data:
          title: "🌞 Солнечная панель"
          message: "Мощность выше порога: {{ states('sensor.solar_panel_power') }} W"

  # Notify on washing finish
  - id: "notification_washing_finish"
    alias: Notification Washing Finish
    triggers:
      - trigger: state
        entity_id: sensor.washing_machine_washer_job_state
        to: "finish"
    # Ignore "finish" after SmartThings reconnects (from unavailable/unknown/none) or repeated finish
    conditions:
      - condition: template
        value_template: "{{ trigger.from_state.state not in ['unavailable', 'unknown', 'none', 'finish'] }}"
    actions:
      - action: script.yandex_joke_after_washing_clothes

  - id: "notification_shopping_list_sen"
    alias: Notification Shopping List for Sen
    description: Shopping list reminder when Sen enters the supermarket
    mode: single
    trigger:
      - platform: state
        entity_id: person.sen
        to: "JIP"
        for: "00:02:00"
    condition:
      - condition: numeric_state
        entity_id: todo.shopping_list
        above: 0
    action:
      - action: script.update_shopping_list
      - action: notify.mobile_app_sen_s25
        data:
          message: "🛒 Открыть список покупок?"
          data:
            clickAction: /todo?entity_id=todo.shopping_list
            url: /todo?entity_id=todo.shopping_list

  - id: "notification_shopping_list_kris"
    alias: Notification Shopping List for Kris
    description: Shopping list reminder when Kris enters the supermarket
    mode: single
    trigger:
      - platform: state
        entity_id: person.kris
        to: "JIP"
        for: "00:02:00"
    condition:
      - condition: numeric_state
        entity_id: todo.shopping_list
        above: 0
    action:
      - action: script.update_shopping_list
      - action: notify.mobile_app_sm_s931b
        data:
          message: "🛒 Открыть список покупок?"
          data:
            clickAction: /todo?entity_id=todo.shopping_list
            url: /todo?entity_id=todo.shopping_list

  - id: "weather_forecast_alert_helper"
    alias: Weather Forecast Alert Helper
    mode: single
    triggers:
      - trigger: time
        at: "06:00:00"
    actions:
      - variables:
          weather_entity: weather.home_assistant_blue
          temp_unit: "{{ state_attr(weather_entity, 'temperature_unit') }}"
          notify_group: mobile_app_sen_s25
          enable_snow: true
          enable_rain: true
          enable_cold: true
          enable_hot: false
          low_temp_threshold: 0
          high_temp_threshold: 100
          num_hours_threshold: 2
          num_hours_lookahead: 12
        alias: Define variables from input params
      - action: weather.get_forecasts
        metadata: {}
        data:
          type: hourly
        target:
          entity_id: "{{ weather_entity }}"
        response_variable: action_response
        alias: Get hourly weather for given entity
      - variables:
          forecast: "{{ action_response[weather_entity]['forecast'][:num_hours_lookahead] }}"
          datetimes: >-
            {{ forecast | map(attribute='datetime') | map('as_datetime') |
            map('as_local') | list }}
          temps: "{{ forecast | map(attribute='temperature') | list }}"
          min_temp: "{{ temps | min }}"
          max_temp: "{{ temps | max }}"
          min_temp_idx: "{{ temps.index(min_temp) }}"
          max_temp_idx: "{{ temps.index(max_temp) }}"
          min_temp_hour: "{{ forecast[min_temp_idx]['datetime'] | as_datetime | as_local }}"
          max_temp_hour: "{{ forecast[max_temp_idx]['datetime'] | as_datetime | as_local }}"
          avg_temp: "{{ temps | average | round(1) }}"
          cold_hours: >-
            {{ forecast | selectattr('temperature', 'le', low_temp_threshold) | list
            }}
          hot_hours: >-
            {{ forecast | selectattr('temperature', 'ge', high_temp_threshold) |
            list }}
          snowy_hours: >-
            {{ forecast | selectattr('condition', 'search', '(?i)snow|flurr(y|ies)')
            | list }}
          rainy_hours: "{{ forecast | selectattr('condition', 'search', '(?i)rain') | list }}"
          precip_prob_snowy_hours: "{{ snowy_hours | map(attribute='precipitation_probability') | list }}"
          precip_prob_rainy_hours: "{{ rainy_hours | map(attribute='precipitation_probability') | list }}"
          cold_alert: "{{ enable_cold and cold_hours | count > num_hours_threshold }}"
          hot_alert: "{{ enable_hot and hot_hours | count > num_hours_threshold }}"
          rain_alert: "{{ enable_rain and rainy_hours | count > num_hours_threshold }}"
          snow_alert: "{{ enable_snow and snowy_hours | count > num_hours_threshold }}"
        alias: Parse response and define new variables
      - alias: If any weather conditions warrant notification
        condition: template
        value_template: "{{ cold_alert or rain_alert or snow_alert or hot_alert}}"
      - variables:
          notification_message: >
            {% macro format_datetime(d) %}{{ d | as_timestamp |
            timestamp_custom("%I:%M %p") }}{% endmacro %}


            Over the next {{ num_hours_lookahead }} hours:

            {% if cold_alert %}

            Temperature: Temps will dip below {{ low_temp_threshold }}{{ temp_unit
            }} for {{ cold_hours | count }} hours, initially reaching a minimum of
            {{ min_temp }}{{ temp_unit }} at {{format_datetime(min_temp_hour)}}
            (avg={{ avg_temp }}{{ temp_unit }}).{%endif%}

            {%- if hot_alert %}

            Temperature: Temps will rise_above {{ high_temp_threshold }}{{ temp_unit
            }} for {{ hot_hours | count }} hours, initially reaching a maximum of {{
            max_temp }}{{ temp_unit }} at {{format_datetime(max_temp_hour)}} (avg={{
            avg_temp }}{{ temp_unit }}).{%endif%}

            {%- if rain_alert %}

            Rain: It will be rainy for {{ rainy_hours | count }} hours (max_prob={{
            (precip_prob_rainy_hours or [0]) | max }}%,
            avg_prob={{(precip_prob_rainy_hours or [0]) | average | round(1) }}%).
            {% endif%}

            {%- if snow_alert %}

            Snow: It will be snowy for {{ snowy_hours | count }} hours (max_prob={{
            (precip_prob_snowy_hours or [0]) | max }}%,
            avg_prob={{(precip_prob_snowy_hours or [0]) | average | round(1) }}%).
            {% endif%}
          notification_title: >-
            Weather alert: {{ ["Temperature" if (cold_alert or hot_alert), "Rain" if
            rain_alert, "Snow" if snow_alert] | select() | join(", ") }}
      - action: notify.{{ notify_group }}
        metadata: {}
        data:
          message: "{{ notification_message }}"
          title: "{{ notification_title }}"
          data:
            ttl: 0
            priority: high
            tag: WEATHER_ALERT
            sticky: true
            clickAction: entityId:{{ weather_entity }}
            notification_icon: mdi:weather-cloudy-alert

  - id: "notification_github_repo_stars_changed"
    alias: Notification GitHub Repo Stars Changed
    trigger:
      - trigger: state
        entity_id:
          - sensor.senmorgan_ex_habridge_stars
          - sensor.senmorgan_home_assistant_config_stars
    condition:
      - condition: template
        value_template: >
          {{ trigger.from_state.state | is_number and trigger.to_state.state | is_number
             and trigger.from_state.state != trigger.to_state.state }}
    action:
      - action: notify.mobile_app_sen_s25
        data:
          title: "⭐ GitHub Repository Stars"
          message: >
            Репозиторий {{ state_attr(trigger.entity_id, 'friendly_name') | replace(' Stars', '') }}
            {{ 'получил' if trigger.from_state.state | int < trigger.to_state.state | int else 'потерял' }}
            звезду!
            Звёзд сейчас: {{ trigger.to_state.state }} (было: {{ trigger.from_state.state }})

  - id: "notification_christmas_devices_season"
    alias: Notification Christmas Devices Season
    description: >-
      Twice a year reminds to enable (last Saturday of November) or disable
      (first Saturday of February) all devices labelled "Christmas".
      HA has no action to enable/disable devices, so this is a reminder that
      opens the device list filtered by the label.
    mode: single
    triggers:
      # Check once a day; the date logic lives in the condition below
      - trigger: time
        at: "09:30:00"
    conditions:
      # weekday() == 5 is Saturday.
      # November has 30 days, so its last Saturday is always on day 24-30.
      # The first Saturday of February is always on day 1-7.
      - condition: template
        value_template: >
          {% set n = now() %}
          {{ n.weekday() == 5 and ((n.month == 11 and n.day > 23) or (n.month == 2 and n.day <= 7)) }}
    actions:
      - variables:
          # True in November (season starts), false in February (season ends)
          season_start: "{{ now().month == 11 }}"
          # Device list filtered by the label. In November the devices are disabled,
          # and disabled devices are hidden by default, so status=disabled shows them too.
          # In February they are enabled and shown without the extra filter.
          devices_url: >-
            /config/devices/dashboard?historyBack=1&label=christmas{{ '&status=disabled' if now().month == 11 else '' }}
          # Display names of everything labelled "Christmas".
          # Labels are read dynamically, so newly labelled devices are included automatically.
          devices: >
            {% set ns = namespace(names=[]) %}
            {% for d in label_devices('christmas') %}
              {% set ns.names = ns.names + [device_attr(d, 'name_by_user') or device_attr(d, 'name')] %}
            {% endfor %}
            {{ ns.names }}
      - action: notify.mobile_app_sen_s25
        data:
          title: "{{ '🎄 Рождественский сезон' if season_start else '📦 Рождество закончилось' }}"
          # Folded block: the blank line below becomes a line break in the message
          message: >
            {{ 'Пора включить' if season_start else 'Пора отключить' }} рождественские устройства:
            {{ devices | join(', ') }}.

            Нажмите, чтобы открыть список.
          data:
            # Same tag for both reminders: the February one replaces the November one
            tag: CHRISTMAS_DEVICES
            notification_icon: mdi:pine-tree
            # Tapping the notification opens the filtered device list
            clickAction: "{{ devices_url }}"
            url: "{{ devices_url }}"
