###############################################
## INPUT BOOLEANS
###############################################
input_boolean:
  last_kitchen_spotlights_state:
    name: Last Kitchen Spotlights State
    icon: mdi:lightbulb
    initial: off

###############################################
## SCRIPTS
###############################################
script:
  notify_via_kitchen_spotlights:
    description: >-
      Blinks the kitchen spotlights 3 times as a visual notification and then
      restores their previous on/off state (saved in an input_boolean).
    # Save current light state, blink 3 times, then restore light state
    sequence:
      # Remember whether the spotlights were on before blinking
      - if:
          - condition: state
            entity_id: light.kitchen_spotlights
            state: "on"
        then:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.last_kitchen_spotlights_state
        else:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.last_kitchen_spotlights_state
      - repeat:
          count: 3
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.kitchen_spotlights
            - delay: 0.5
            - action: light.turn_off
              target:
                entity_id: light.kitchen_spotlights
            - delay: 0.5
      # Restore the remembered on/off state (brightness/colour are not restored)
      - if:
          - condition: state
            entity_id: input_boolean.last_kitchen_spotlights_state
            state: "on"
        then:
          - action: light.turn_on
            target:
              entity_id: light.kitchen_spotlights
        else:
          - action: light.turn_off
            target:
              entity_id: light.kitchen_spotlights
