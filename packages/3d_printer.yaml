###############################################
## SETTINGS AND VARIABLES
###############################################
homeassistant:
  customize:
    package.node_anchors:
      sys_notify_title_info: &sys_notify_title_info "💬 Системное уведомление"
      sys_notify_title_warning: &sys_notify_title_warning "⚠️ Предупреждение"
      sys_notify_title_critical: &sys_notify_title_critical "🚨 Внимание!"

###############################################
## INPUT BOOLEANS
###############################################
input_boolean:
  3d_printer_power:
    name: 3D Printer Power
    icon: mdi:printer-3d

###############################################
## AUTOMATIONS
###############################################
automation:
  ###############################################
  ## Turn on light during preparation
  ###############################################
  - id: 3d_printer_preparation_light
    alias: 3D Printer - Preparation Light
    description: >-
      When a print enters the "prepare" stage, waits until nobody is in the hall
      (FP2 presence and motion both clear for 1 minute, max 20 minutes) and then
      turns on the hall bulb and the printer chamber light.
    mode: restart
    triggers:
      - trigger: state
        entity_id: sensor.3d_printer_bambu_lab_a1_print_status
        to: "prepare"
    actions:
      # Wait till both presence and motion sensors are off
      - wait_for_trigger:
          - trigger: template
            value_template: >
              {{ is_state('binary_sensor.presence_sensor_fp2_hall', 'off') and
              is_state('binary_sensor.aqara_hall_motion_sensor_motion', 'off') }}
            for:
              minutes: 1
        timeout:
          minutes: 20
      - action: light.turn_on
        target:
          entity_id:
            - light.hall_edison_bulb
            - light.3d_printer_bambu_lab_a1_chamber_light

  ###############################################
  ## Turn off light after some time after print started
  ###############################################
  - id: 3d_printer_print_light_off
    alias: 3D Printer - Print Light Off
    description: Turns off the hall bulb 10 minutes after the print moves from "prepare" to "running".
    mode: restart
    triggers:
      - trigger: state
        entity_id: sensor.3d_printer_bambu_lab_a1_print_status
        from: "prepare"
        to: "running"
    actions:
      - delay: "00:10:00"
      - action: light.turn_off
        target:
          entity_id: light.hall_edison_bulb

  ###############################################
  ## Remind me when the print is done
  ###############################################
  - id: 3d_printer_print_done
    alias: 3D Printer - Print Done
    description: >-
      When a print finishes, lights the hall and chamber if someone is home, sends a phone
      notification with job name, duration, weight and filament length, and announces it on
      the Yandex Station unless silent mode is on.
    triggers:
      - trigger: state
        entity_id: sensor.3d_printer_bambu_lab_a1_print_status
        from: "running"
        to: "finish"
    actions:
      # Light up if somebody is home
      - if:
          - condition: state
            entity_id: binary_sensor.people_home
            state: "on"
        then:
          - action: light.turn_on
            target:
              entity_id:
                - light.hall_edison_bulb
                - light.3d_printer_bambu_lab_a1_chamber_light
      # Set variables for print details
      - variables:
          # Fall back to the moment the printer entered "running" when start_time is unknown/unavailable
          start_time: >-
            {{ as_timestamp(states('sensor.3d_printer_bambu_lab_a1_start_time'),
                            as_timestamp(trigger.from_state.last_changed)) }}
          spent_time: "{{ (now().timestamp() - start_time) | int }}"
          spent_hours: "{{ (spent_time / 3600) | int }}"
          spent_minutes: "{{ ((spent_time % 3600) / 60) | int }}"
          task_name: "{{ states('sensor.3d_printer_bambu_lab_a1_task_name') }}"
          print_weight: "{{ states('sensor.3d_printer_bambu_lab_a1_print_weight') }}"
          print_length: "{{ states('sensor.3d_printer_bambu_lab_a1_print_length') }}"
      - action: notify.mobile_app_sen_s25
        data:
          title: "3D Printer"
          message: |
            🎉 Печать завершена ({{ task_name }})
            ⏱️ Время печати: {{ spent_hours }}ч {{ spent_minutes }}мин
            ⚖️ Вес: {{ print_weight }}
            📏 Длина прутка: {{ print_length }}
      - if:
          - condition: state
            entity_id: input_boolean.silent_mode
            state: "off"
        then:
          - action: media_player.play_media
            target:
              entity_id: media_player.yandex_station_midi
            data:
              media_content_type: text
              media_content_id: >
                3Д печать детали {{ task_name }} завершена! Время печати:
                {% if spent_hours > 0 %} {{ spent_hours }} {% if spent_hours == 1 %} час {% else %} часов {% endif %} {% endif %}
                {% if spent_minutes > 0 %} {{ spent_minutes }} {% if spent_minutes == 1 %} минута {% else %} минут {% endif %} {% endif %}
                Использовано {{ print_weight }} грамм пластика.

  ###############################################
  ## Remind me about print progress
  ###############################################
  - id: 3d_printer_print_progress
    alias: 3D Printer - Print Progress
    description: Sends a phone notification with progress and remaining time at every 20% step (20, 40, 60, 80).
    triggers:
      - trigger: state
        entity_id: sensor.3d_printer_bambu_lab_a1_print_progress
    conditions:
      # Only real progress changes that land on a multiple of 20% (excluding 0 and 100)
      - condition: template
        value_template: >
          {{ (trigger.to_state.state | int(0)) > 0 and (trigger.to_state.state | int(0)) < 100 and
            ((trigger.to_state.state | int(0)) != (trigger.from_state.state | int(0))) and
            (trigger.to_state.state | int(0)) % 20 == 0 }}
    actions:
      # Remaining time sensor is in hours (float); split it into whole hours and minutes
      - variables:
          remaining_time: "{{ states('sensor.3d_printer_bambu_lab_a1_remaining_time') | float(0) }}"
          remaining_hours: "{{ (remaining_time | int) }}"
          remaining_minutes: "{{ ((remaining_time % 1) * 60) | int }}"
      - action: notify.mobile_app_sen_s25
        data:
          title: "3D Printer"
          message: >
            📈 Деталь готова на {{ trigger.to_state.state | int(0) }}%
            ⏱️ Осталось {{ remaining_hours }}ч {{ remaining_minutes }}мин

  ###############################################
  ## Remind me when print is paused
  ###############################################
  - id: 3d_printer_print_paused
    alias: 3D Printer - Print Paused
    description: Notifies the phone when a running print is paused or fails.
    triggers:
      - trigger: state
        entity_id: sensor.3d_printer_bambu_lab_a1_print_status
        from: "running"
        to:
          - "pause"
          - "failed"
    actions:
      - action: notify.mobile_app_sen_s25
        data:
          title: "⚠️ 3D Printer"
          message: "Печать приостановлена!"

  ###############################################
  ## Remind me when print is resumed
  ###############################################
  - id: 3d_printer_print_resumed
    alias: 3D Printer - Print Resumed
    description: Notifies the phone when a paused or failed print goes back to running.
    triggers:
      - trigger: state
        entity_id: sensor.3d_printer_bambu_lab_a1_print_status
        from:
          - "pause"
          - "failed"
        to: "running"
    actions:
      - action: notify.mobile_app_sen_s25
        data:
          title: "⚠️ 3D Printer"
          message: "Печать возобновлена"

  ###############################################
  ## Power control
  ###############################################
  - id: 3d_printer_power_on
    alias: 3D Printer - Power On
    description: >-
      Turns the printer socket on when the virtual power switch
      (input_boolean.3d_printer_power) is switched on.
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_boolean.3d_printer_power
        from: "off"
        to: "on"
    # Check if new state was not set by «3d_printer_sync_power_state» to avoid infinite loop
    conditions:
      - condition: state
        entity_id: switch.3d_printer_socket
        state: "off"
    actions:
      - action: switch.turn_on
        target:
          entity_id: switch.3d_printer_socket

  - id: 3d_printer_power_sync
    alias: 3D Printer - Power Sync
    description: >-
      Mirrors physical socket changes (e.g. button on the plug) back to the virtual power switch,
      unless the Power Off automation is currently running and managing the state itself.
    mode: single
    triggers:
      - trigger: state
        entity_id: switch.3d_printer_socket
    conditions:
      # Only act when the socket and the virtual switch disagree
      - condition: template
        value_template: >
          {{ states('switch.3d_printer_socket') != states('input_boolean.3d_printer_power') }}
        # Check if 3d_printer_power_off automation is not running
      - condition: template
        value_template: >
          {{ is_state_attr('automation.3d_printer_power_off', 'current', 0) }}
    actions:
      - if:
          - condition: state
            entity_id: switch.3d_printer_socket
            state: "on"
        then:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.3d_printer_power
        else:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.3d_printer_power

  - id: 3d_printer_power_off
    alias: 3D Printer - Power Off
    description: >-
      Safe power-off when the virtual power switch is turned off: cuts the socket only if the
      printer is finished/idle and the nozzle is at most 60°C. Otherwise switches the virtual
      switch back on and warns via phone and (unless silent mode) the Yandex Station.
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_boolean.3d_printer_power
        from: "on"
        to: "off"
    # Check if new state was not set by «3d_printer_sync_power_state» to avoid infinite loop
    conditions:
      - condition: state
        entity_id: switch.3d_printer_socket
        state: "on"
    actions:
      - variables:
          # Get the current print status
          printer_status: "{{ states('sensor.3d_printer_bambu_lab_a1_print_status') }}"
      - if:
          # If printer is not in state "finish" or "idle" - send me notification and stop powering off
          - condition: template
            value_template: "{{ printer_status == 'finish' or printer_status == 'idle' }}"
        then:
          - if:
              # If printer nozzle temperature is above 60°C - send me notification and stop powering off
              - condition: numeric_state
                entity_id: sensor.3d_printer_bambu_lab_a1_nozzle_temperature
                above: 60
            then:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.3d_printer_power
              - action: notify.mobile_app_sen_s25
                data:
                  title: "⚠️ 3D Printer"
                  message: |
                    Нельзя выключить принтер, так как температура сопла {{ states('sensor.3d_printer_bambu_lab_a1_nozzle_temperature') }}°C.
                    Питания НЕ отключено!
              - if:
                  - condition: state
                    entity_id: input_boolean.silent_mode
                    state: "off"
                then:
                  - action: media_player.play_media
                    target:
                      entity_id: media_player.yandex_station_midi
                    data:
                      media_content_type: text
                      media_content_id: >
                        ⚠️ Внимание! Питание 3D принтера НЕ отключено, так как температура сопла {{ states('sensor.3d_printer_bambu_lab_a1_nozzle_temperature') }}°C.
            else:
              # If printer is in a state that allows powering off, turn off power socket
              - action: switch.turn_off
                target:
                  entity_id: switch.3d_printer_socket
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.3d_printer_power
        else:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.3d_printer_power
          - action: notify.mobile_app_sen_s25
            data:
              title: "⚠️ 3D Printer"
              message: |
                Нельзя выключить принтер, так как он находится в состоянии «{{ printer_status }}».
                Питания НЕ отключено!
          - if:
              - condition: state
                entity_id: input_boolean.silent_mode
                state: "off"
            then:
              - action: media_player.play_media
                target:
                  entity_id: media_player.yandex_station_midi
                data:
                  media_content_type: text
                  media_content_id: >
                    ⚠️ Внимание! Питание 3D принтера НЕ отключено, так как он находится в состоянии «{{ printer_status }}».

  ###############################################
  ## Automatic power off for 3D printer after print completion and cooldown, during night hours
  ###############################################
  - id: 3d_printer_automatic_power_off
    alias: 3D Printer - Automatic Power Off
    description: >-
      20 minutes after a print finishes, waits up to 30 minutes for the nozzle to cool below
      50°C, then powers the printer off via the virtual switch (which goes through the safe
      Power Off automation) and turns off the hall bulb. Reports the result or the reason it
      did not power off.
    mode: restart
    triggers:
      - trigger: state
        entity_id: sensor.3d_printer_bambu_lab_a1_print_status
        from: "running"
        to: "finish"
        for:
          minutes: 20
    actions:
      # Wait for the printer to cool down below 50°C or timeout after 30 minutes
      - wait_template: "{{ states('sensor.3d_printer_bambu_lab_a1_nozzle_temperature') | float(100) < 50 }}"
        timeout:
          minutes: 30
        continue_on_timeout: true
      - variables:
          timestamp: "{{ now().strftime('%H:%M:%S') }}"
          printer_status: "{{ states('sensor.3d_printer_bambu_lab_a1_print_status') }}"
          nozzle_temp: "{{ states('sensor.3d_printer_bambu_lab_a1_nozzle_temperature') }}"
      # Break if printer if socket is already off
      - if:
          - condition: state
            entity_id: input_boolean.3d_printer_power
            state: "off"
        then:
          # Silently stop execution if printer power is already off
          - stop: "Printer power already off"
      # Check that the printer is still finished/idle and has actually cooled down
      - if:
          - condition: template
            value_template: >
              {{ printer_status in ['finish', 'idle'] and nozzle_temp | float(100) < 50 }}
        then:
          # Disable power using virtual button
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.3d_printer_power
            # Disable light also
          - action: light.turn_off
            target:
              entity_id: light.hall_edison_bulb
          - action: script.notify_and_create_persistent_notification
            data:
              title: *sys_notify_title_info
              message: Питание 3D принтера было отключено автоматически в {{ timestamp }}
        else:
          - action: script.notify_and_create_persistent_notification
            data:
              title: *sys_notify_title_warning
              message: >-
                Питание 3D принтера НЕ отключено в {{ timestamp }}.
                {% if printer_status not in ['finish', 'idle'] -%}
                  Причина: принтер находится в состоянии «{{ printer_status }}».
                {% else %}
                  Причина: сопло не остыло ниже 50°C (сейчас {{ nozzle_temp }}°C).
                {% endif %}
