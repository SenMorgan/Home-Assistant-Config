######################################################################

###############################################
## INPUT BOOLEANS
###############################################
input_boolean:
  3d_printer_power:
    name: 3D Printer Power
    icon: mdi:printer-3d

###############################################
## AUTOMATIONS
###############################################
automation:
  ###############################################
  ## Turn on light during preparation
  ###############################################
  - id: 3d_printer_preparation_light
    alias: 3D Printer - Preparation Light
    description: >-
      When a print enters the "prepare" stage, waits until nobody is in the hall
      (FP2 presence and motion both clear for 1 minute, max 20 minutes) and then
      turns on the hall bulb and the printer chamber light.
    mode: restart
    triggers:
      - trigger: state
        entity_id: sensor.3d_printer_bambu_lab_a1_print_status
        to: "prepare"
    actions:
      # Wait till both presence and motion sensors are off
      - wait_for_trigger:
          - trigger: template
            value_template: >
              {{ is_state('binary_sensor.presence_sensor_fp2_hall', 'off') and
              is_state('binary_sensor.aqara_hall_motion_sensor_motion', 'off') }}
            for:
              minutes: 1
        timeout:
          minutes: 20
      - action: light.turn_on
        target:
          entity_id:
            - light.hall_edison_bulb
            - light.3d_printer_bambu_lab_a1_chamber_light

  ###############################################
  ## Turn off light after some time after print started
  ###############################################
  - id: 3d_printer_print_light_off
    alias: 3D Printer - Print Light Off
    description: Turns off the hall bulb 10 minutes after the print moves from "prepare" to "running".
    mode: restart
    triggers:
      - trigger: state
        entity_id: sensor.3d_printer_bambu_lab_a1_print_status
        from: "prepare"
        to: "running"
    actions:
      - delay: "00:10:00"
      - action: light.turn_off
        target:
          entity_id: light.hall_edison_bulb

  ###############################################
  ## Remind me when the print is done
  ###############################################
  - id: 3d_printer_print_done
    alias: 3D Printer - Print Done
    description: >-
      When a print finishes, lights the hall and chamber if someone is home, sends a phone
      notification with job name, duration, weight and filament length, and announces it on
      the Yandex Station when someone is home outside night/silent mode; clears the progress status.
    triggers:
      - trigger: state
        entity_id: sensor.3d_printer_bambu_lab_a1_print_status
        from: "running"
        to: "finish"
    actions:
      # Light up if somebody is home
      - if:
          - condition: state
            entity_id: binary_sensor.people_home
            state: "on"
        then:
          - action: light.turn_on
            # An unresponsive bulb (e.g. Zigbee not ready after restart) must not block the notification
            continue_on_error: true
            target:
              entity_id:
                - light.hall_edison_bulb
                - light.3d_printer_bambu_lab_a1_chamber_light
      # Set variables for print details
      - variables:
          # Fall back to the moment the printer entered "running" when start_time is unknown/unavailable
          start_time: >-
            {{ as_timestamp(states('sensor.3d_printer_bambu_lab_a1_start_time'),
                            as_timestamp(trigger.from_state.last_changed)) }}
          spent_time: "{{ (now().timestamp() - start_time) | int }}"
          spent_hours: "{{ (spent_time / 3600) | int }}"
          spent_minutes: "{{ ((spent_time % 3600) / 60) | int }}"
          task_name: "{{ states('sensor.3d_printer_bambu_lab_a1_task_name') }}"
          print_weight: "{{ states('sensor.3d_printer_bambu_lab_a1_print_weight') }}"
          print_length: "{{ states('sensor.3d_printer_bambu_lab_a1_print_length') }}"
      # Drop the silent progress status, the print is over
      - action: notify.mobile_app_sen_s25
        continue_on_error: true
        data:
          message: clear_notification
          data:
            tag: printer_progress
      # Text chosen by Sen (catalog N-20); voice with correct plural forms (ru.jinja)
      - action: script.notify
        data:
          level: info
          title: 3D Printer
          message: >-
            {% from 'ru.jinja' import num %}
            🎉 Печать завершена ({{ task_name }})
            ⏱️ Время печати: {{ spent_hours }}ч {{ spent_minutes }}мин
            ⚖️ Вес: {{ num(print_weight, 1) }} г
            📏 Длина прутка: {{ num(print_length, 1) }} м
          url: /lovelace/3d-printer
          tts: >-
            {% from 'ru.jinja' import duration_tts %}
            3Д печать детали {{ task_name }} завершена! Время печати: {{ duration_tts(spent_time // 60) }}.
            Использовано {{ print_weight | float(0) | round(0) | int }} грамм пластика.

  ###############################################
  ## Remind me about print progress
  ###############################################
  - id: 3d_printer_print_progress
    alias: 3D Printer - Print Progress
    description: >-
      For long prints only (3 h or more in total), a silent status push with progress, remaining time
      and ETA at every 20 % step; it replaces itself (tag printer_progress) and is cleared when done.
    triggers:
      - trigger: state
        entity_id: sensor.3d_printer_bambu_lab_a1_print_progress
    conditions:
      # Only real progress changes that land on a multiple of 20% (excluding 0 and 100)
      - condition: template
        value_template: >
          {{ (trigger.to_state.state | int(0)) > 0 and (trigger.to_state.state | int(0)) < 100 and
            ((trigger.to_state.state | int(0)) != (trigger.from_state.state | int(0))) and
            (trigger.to_state.state | int(0)) % 20 == 0 }}
      # Only long prints: elapsed + remaining time of at least 3 hours
      - condition: template
        value_template: >
          {% set start = as_timestamp(states('sensor.3d_printer_bambu_lab_a1_start_time'), as_timestamp(now())) %}
          {{ (as_timestamp(now()) - start) / 3600
             + states('sensor.3d_printer_bambu_lab_a1_remaining_time') | float(0) >= 3 }}
    actions:
      # Remaining time sensor is in hours (float); split it into whole hours and minutes
      - variables:
          remaining_time: "{{ states('sensor.3d_printer_bambu_lab_a1_remaining_time') | float(0) }}"
          remaining_hours: "{{ (remaining_time | int) }}"
          remaining_minutes: "{{ ((remaining_time % 1) * 60) | int }}"
      - action: script.notify
        data:
          level: status
          tag: printer_progress
          title: "🖨️ 3D-печать: {{ trigger.to_state.state | int(0) }} %"
          message: >-
            {% from 'ru.jinja' import duration_short %}
            Осталось {{ duration_short(remaining_hours * 60 + remaining_minutes) }} ·
            готово в ≈ {{ (now() + timedelta(hours=remaining_time)).strftime('%H:%M') }}
          url: /lovelace/3d-printer

  ###############################################
  ## Print paused / printer error
  ###############################################
  - id: 3d_printer_print_paused
    alias: 3D Printer - Print Paused or Error
    description: >-
      When a print pauses or fails, or the printer reports an HMS/print error, sends a phone
      notification with the printer's error text (tap opens the Bambu wiki page) and, if there is
      a real error, announces it on Yandex Station Midi (not in night mode). A pause by the user
      gets a push only; a task cancelled by the user (code 0300_400C) is ignored.
    # Pause and HMS error arrive within milliseconds: handle them as one event
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: sensor.3d_printer_bambu_lab_a1_print_status
        from: "running"
        to:
          - "pause"
          - "failed"
      - trigger: state
        entity_id:
          - binary_sensor.3d_printer_bambu_lab_a1_hms_errors
          - binary_sensor.3d_printer_bambu_lab_a1_print_error
        from: "off"
        to: "on"
    actions:
      # Let status, HMS and print-error entities all update before reading them
      - delay: "00:00:02"
      - variables:
          hms: binary_sensor.3d_printer_bambu_lab_a1_hms_errors
          perr: binary_sensor.3d_printer_bambu_lab_a1_print_error
          # HMS errors are attributes "1-Error", "1-Wiki", "2-Error", ... with "Count"
          errors: >-
            {% set ns = namespace(l=[]) %}
            {% if is_state(hms, 'on') %}
              {% for i in range(1, (state_attr(hms, 'Count') | int(0)) + 1) %}
                {% set ns.l = ns.l + [state_attr(hms, i ~ '-Error')] %}
              {% endfor %}
            {% endif %}
            {% if is_state(perr, 'on') and state_attr(perr, 'error') %}
              {% set ns.l = ns.l + [state_attr(perr, 'error')] %}
            {% endif %}
            {{ ns.l | reject('none') | unique | list }}
          wiki: "{{ state_attr(hms, '1-Wiki') if is_state(hms, 'on') else '' }}"
          # 0300_400C = "The task was canceled" (cancelled by the user on the printer/app)
          cancelled_by_user: "{{ is_state(perr, 'on') and state_attr(perr, 'code') == '0300_400C' }}"
          status: "{{ states('sensor.3d_printer_bambu_lab_a1_print_status') }}"
      - condition: template
        value_template: "{{ not cancelled_by_user }}"
      # Failed print (I-06) or pause; voice only for real errors (script.notify skips it at night,
      # in silent mode and when nobody is home)
      - action: script.notify
        data:
          level: warning
          persistent: false
          title: "{{ '🖨️ Печать прервана' if status == 'failed' else '⏸️ Печать на паузе' }}"
          message: >-
            {{ states('sensor.3d_printer_bambu_lab_a1_task_name') }} ·
            {{ states('sensor.3d_printer_bambu_lab_a1_print_progress') | int(0) }} %
            {%- if errors | count > 0 %} · {{ errors | join('; ') }}{% endif %}
          # Tap opens the Bambu wiki page for the HMS code (or the printer dashboard)
          url: "{{ wiki if wiki else '/lovelace/3d-printer' }}"
          tts: >-
            {% if errors | count > 0 or status == 'failed' %}
              Ошибка 3Д принтера, печать {{ 'остановлена' if status == 'failed' else 'приостановлена' }}.
              Подробности в уведомлении на телефоне.
            {% endif %}

  ###############################################
  ## Remind me when print is resumed
  ###############################################
  - id: 3d_printer_print_resumed
    alias: 3D Printer - Print Resumed
    description: Notifies the phone when a paused or failed print goes back to running.
    triggers:
      - trigger: state
        entity_id: sensor.3d_printer_bambu_lab_a1_print_status
        from:
          - "pause"
          - "failed"
        to: "running"
    actions:
      - action: script.notify
        data:
          level: info
          title: ▶️ Печать продолжена
          message: "{{ states('sensor.3d_printer_bambu_lab_a1_task_name') }}"

  ###############################################
  ## Power control
  ###############################################
  - id: 3d_printer_power_on
    alias: 3D Printer - Power On
    description: >-
      Turns the printer socket on when the virtual power switch
      (input_boolean.3d_printer_power) is switched on.
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_boolean.3d_printer_power
        from: "off"
        to: "on"
    # Check if new state was not set by «3d_printer_sync_power_state» to avoid infinite loop
    conditions:
      - condition: state
        entity_id: switch.3d_printer_socket
        state: "off"
    actions:
      - action: switch.turn_on
        target:
          entity_id: switch.3d_printer_socket

  - id: 3d_printer_power_sync
    alias: 3D Printer - Power Sync
    description: >-
      Mirrors physical socket changes (e.g. button on the plug) back to the virtual power switch,
      unless the Power Off automation is currently running and managing the state itself.
    mode: single
    triggers:
      - trigger: state
        entity_id: switch.3d_printer_socket
    conditions:
      # Only act when the socket and the virtual switch disagree
      - condition: template
        value_template: >
          {{ states('switch.3d_printer_socket') != states('input_boolean.3d_printer_power') }}
        # Check if 3d_printer_power_off automation is not running
      - condition: template
        value_template: >
          {{ is_state_attr('automation.3d_printer_power_off', 'current', 0) }}
    actions:
      - if:
          - condition: state
            entity_id: switch.3d_printer_socket
            state: "on"
        then:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.3d_printer_power
        else:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.3d_printer_power

  - id: 3d_printer_power_off
    alias: 3D Printer - Power Off
    description: >-
      Safe power-off when the virtual power switch is turned off: cuts the socket only if the
      printer is finished/idle and the nozzle is at most 60°C. Otherwise switches the virtual
      switch back on and warns via phone and the Yandex Station (rules of script.notify).
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_boolean.3d_printer_power
        from: "on"
        to: "off"
    # Check if new state was not set by «3d_printer_sync_power_state» to avoid infinite loop
    conditions:
      - condition: state
        entity_id: switch.3d_printer_socket
        state: "on"
    actions:
      - variables:
          # Get the current print status
          printer_status: "{{ states('sensor.3d_printer_bambu_lab_a1_print_status') }}"
      - if:
          # If printer is not in state "finish" or "idle" - send me notification and stop powering off
          - condition: template
            value_template: "{{ printer_status == 'finish' or printer_status == 'idle' }}"
        then:
          - if:
              # If printer nozzle temperature is above 60°C - send me notification and stop powering off
              - condition: numeric_state
                entity_id: sensor.3d_printer_bambu_lab_a1_nozzle_temperature
                above: 60
            then:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.3d_printer_power
              - action: script.notify
                data:
                  level: warning
                  persistent: false
                  title: 🔌 Принтер не выключен
                  message: >-
                    Сопло {{ states('sensor.3d_printer_bambu_lab_a1_nozzle_temperature') | float(0) | round(0) | int }} °C —
                    жду остывания до 60 °C
                  # No emoji in voice texts (E-4)
                  tts: Нельзя выключить принтер, сопло ещё горячее.
            else:
              # If printer is in a state that allows powering off, turn off power socket
              - action: switch.turn_off
                target:
                  entity_id: switch.3d_printer_socket
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.3d_printer_power
        else:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.3d_printer_power
          - action: script.notify
            data:
              level: warning
              persistent: false
              title: 🔌 Принтер не выключен
              message: "Принтер сейчас: {{ {'running': 'печатает', 'pause': 'на паузе', 'prepare': 'готовится к печати', 'slicing': 'нарезка модели', 'failed': 'ошибка печати', 'init': 'запускается', 'offline': 'не в сети'}.get(printer_status, printer_status) }}"
              tts: >-
                {{ 'Нельзя выключить принтер, идёт печать.' if printer_status == 'running'
                   else 'Нельзя выключить принтер, он сейчас ' ~ ({'pause': 'на паузе', 'prepare': 'готовится к печати',
                   'slicing': 'нарезает модель', 'failed': 'в ошибке', 'init': 'запускается',
                   'offline': 'не в сети'}.get(printer_status, 'занят')) ~ '.' }}

  ###############################################
  ## Automatic power off for 3D printer after print completion and cooldown, during night hours
  ###############################################
  - id: 3d_printer_automatic_power_off
    alias: 3D Printer - Automatic Power Off
    description: >-
      20 minutes after a print finishes, waits up to 30 minutes for the nozzle to cool below
      50°C, then powers the printer off via the virtual switch (which goes through the safe
      Power Off automation) and turns off the hall bulb. Reports the result or the reason it
      did not power off.
    mode: restart
    triggers:
      - trigger: state
        entity_id: sensor.3d_printer_bambu_lab_a1_print_status
        from: "running"
        to: "finish"
        for:
          minutes: 20
    actions:
      # Wait for the printer to cool down below 50°C or timeout after 30 minutes
      - wait_template: "{{ states('sensor.3d_printer_bambu_lab_a1_nozzle_temperature') | float(100) < 50 }}"
        timeout:
          minutes: 30
        continue_on_timeout: true
      - variables:
          printer_status: "{{ states('sensor.3d_printer_bambu_lab_a1_print_status') }}"
          nozzle_temp: "{{ states('sensor.3d_printer_bambu_lab_a1_nozzle_temperature') }}"
      # Break if printer if socket is already off
      - if:
          - condition: state
            entity_id: input_boolean.3d_printer_power
            state: "off"
        then:
          # Silently stop execution if printer power is already off
          - stop: "Printer power already off"
      # Check that the printer is still finished/idle and has actually cooled down
      - if:
          - condition: template
            value_template: >
              {{ printer_status in ['finish', 'idle'] and nozzle_temp | float(100) < 50 }}
        then:
          # Disable power using virtual button
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.3d_printer_power
            # Disable light also
          - action: light.turn_off
            target:
              entity_id: light.hall_edison_bulb
          - action: script.notify
            data:
              level: status
              tag: printer_power
              title: 🔌 Принтер выключен
              message: Автоматически, после остывания
        else:
          - action: script.notify
            data:
              level: warning
              title: 🔌 Принтер не выключен
              message: >-
                {% if printer_status not in ['finish', 'idle'] -%}
                  Причина: принтер сейчас {{ {'running': 'печатает', 'pause': 'на паузе', 'prepare': 'готовится к печати', 'slicing': 'нарезка модели', 'failed': 'ошибка печати', 'init': 'запускается', 'offline': 'не в сети'}.get(printer_status, printer_status) }}
                {%- else -%}
                  Причина: сопло не остыло ниже 50 °C (сейчас {{ nozzle_temp | float(0) | round(0) | int }} °C)
                {%- endif %}
