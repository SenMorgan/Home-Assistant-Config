              "Если Вы еще ничего не убрали сами, то это ваши проблемы.",
              "Да, я слышал эту команду. Можете убраться сами.",
              "Глянь, как Джонни хорош в работе!",
              "Мне кажется, Вы перепутали меня с домработником!",
              "Неужели это моя новая задача? Тогда я лучше притворюсь, что я не слышал.",
              "Пока Вы ждете, когда я начну убираться, можете мне рассказать какой-нибудь анекдот?",
              "Я не буду убираться, пока вы не сделаете мне комплимент.",
              "Я не буду убираться, пока вы не подпишетесь на мой канал.",
              "Лайк, колокольчик, подписка — и я уберусь.",
              "Джонни выезжает на задание. Просьба носки с пола убрать, он их боится.",
              "Объявляю генеральную уборку. Генерал — Джонни, я так, консультант.",
              "Джонни уже в пути. Крошки, у вас есть пять минут, чтобы спрятаться.",
              "Хорошо, что у нас есть Джонни. А то пришлось бы убираться вам.",
