###############################################
## INPUT NUMBERS
###############################################
input_number:
  volume_yandex_station:
    name: Volume Yandex Station
    min: 0
    max: 1
    step: 0.01

###############################################
## AUTOMATIONS
###############################################
automation:
  - id: sync_shopping_list
    alias: Sync Shopping List
    description: Syncs the Yandex Station shopping list once Sen or Kris has been away for 5 minutes.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: person.sen
        to: "not_home"
        for: 00:05:00
      - trigger: state
        entity_id: person.kris
        to: "not_home"
        for: 00:05:00
    actions:
      - action: script.update_shopping_list

###############################################
## SCRIPTS
###############################################
script:
  update_shopping_list:
    alias: Update Shopping List
    description: >-
      Silently makes the Yandex Station refresh its shopping list: saves the volume, mutes to 0.01,
      sends the "update shopping list" command, stops playback and restores the saved volume.
    sequence:
      # Save actual volume
      - action: input_number.set_value
        target:
          entity_id: input_number.volume_yandex_station
        data:
          value: "{{ state_attr('media_player.yandex_station', 'volume_level') | float(0.5) }}"
      # Repeat the command to ensure that the volume is muted
      - repeat:
          while:
            - condition: template
              value_template: "{{ not is_state_attr('media_player.yandex_station', 'volume_level', 0.01) }}"
            - condition: template
              value_template: "{{ repeat.index <= 3 }}"
          sequence:
            - action: media_player.volume_set
              target:
                entity_id: media_player.yandex_station
              data:
                volume_level: 0.01
            - delay: 0.5
      - action: media_player.play_media
        target:
          entity_id: media_player.yandex_station
        data:
          media_content_id: update
          media_content_type: shopping_list
      - delay: 1
      # Stop whatever the station started playing/saying after the update
      - action: media_player.play_media
        target:
          entity_id: media_player.yandex_station
        data:
          media_content_id: stop
          media_content_type: command
      - delay: 1
      # Repeat the command to ensure that the volume is muted
      # (i.e. restore the saved volume, retrying up to 3 times until it is applied)
      - repeat:
          while:
            - condition: template
              # Compare as numbers (the attribute is a float, the helper state is a string)
              value_template: >-
                {{ (state_attr('media_player.yandex_station', 'volume_level') | float(0)
                    - states('input_number.volume_yandex_station') | float(0)) | abs > 0.005 }}
            - condition: template
              value_template: "{{ repeat.index <= 3 }}"
          sequence:
            - action: media_player.volume_set
              target:
                entity_id: media_player.yandex_station
              data:
                volume_level: "{{ states('input_number.volume_yandex_station') | float(0.5) }}"
            - delay: 1

  set_volume_level_repeatedly:
    alias: Set Volume Level Repeatedly
    description: Sets a media player's volume, retrying up to 3 times until the reported level matches.
    # Queued: concurrent callers (different speakers) must not cancel each other
    mode: queued
    max: 10
    fields:
      volume_level:
        description: The volume level to set
        example: 0.2
      media_player:
        description: The media player to set volume for
        example: media_player.yandex_station_midi

    sequence:
      - repeat:
          while:
            - condition: template
              value_template: "{{ not is_state_attr(media_player, 'volume_level', volume_level) }}"
            - condition: template
              value_template: "{{ repeat.index <= 3 }}"
          sequence:
            - action: media_player.volume_set
              target:
                entity_id: "{{ media_player }}"
              data:
                volume_level: "{{ volume_level }}"
            - delay: 0.5
  yandex_joke_before_cleaning_kitchen:
