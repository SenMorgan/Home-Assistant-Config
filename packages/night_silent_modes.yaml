###############################################
## INPUT BOOLEANS
###############################################
input_boolean:
  silent_mode:
    name: Silent Mode
    icon: mdi:volume-off
  home_night_mode:
    name: Home Night Mode
    icon: mdi:weather-night
  bedroom_lights_and_cover_safety_switch:
    name: Bedroom Lights Safety Switch
    icon: mdi:lightbulb-multiple-off-outline

###############################################
## TEMPLATE ENTITIES
###############################################
template:
  - binary_sensor:
      # Everyone seems to be in bed: no room light in the apartment, no motion, TV off, nobody in the toilet
      # (no motion sensor there: wc_occupied comes from the door). Night Mode Auto On
      # waits for 10 minutes of this. Not counted: lights labelled "Not lighting" (clock, Atom Echo, printer
      # chamber), the Nest proximity sensor and the bedroom camera (they react to sleeping people).
      - name: Apartment Quiet
        unique_id: apartment_quiet
        icon: mdi:sleep
        state: >-
          {% set lights = floor_areas('apartment') | map('area_entities') | sum(start=[])
             | select('match', 'light\\.') | reject('in', label_entities('not_lighting')) | list %}
          {% set motion = ['binary_sensor.presence_sensor_fp2_detection_zone_presence',
                           'binary_sensor.presence_sensor_fp2_kitchen',
                           'binary_sensor.presence_sensor_fp2_hall',
                           'binary_sensor.presence_sensor_fp2_pc',
                           'binary_sensor.kitchen_motion_alarm'] %}
          {# The 3D printer stands in the hall: while it is powered its moving head triggers the hall motion sensor #}
          {% if not is_state('switch.3d_printer_socket', 'on') %}
            {% set motion = motion + ['binary_sensor.aqara_hall_motion_sensor_motion',
                                      'binary_sensor.aqara_hall_motion_sensor_occupancy'] %}
          {% endif %}
          {{ lights | select('is_state', 'on') | list | count == 0
             and motion | select('is_state', 'on') | list | count == 0
             and not is_state('media_player.samsung_tv', 'on')
             and not is_state('input_boolean.wc_occupied', 'on') }}

###############################################
## SCRIPTS
###############################################
script:
  set_silent_mode:
    alias: Set Silent Mode
    description: >-
      Applies silent mode: lowers Yandex station and
      model railway volume, turns the 7-segment clock red (off in night mode), powers the baby monitor
      (not in night mode) and enables the
      bedroom lights/cover safety switch.
    sequence:
      # Power on Baby Monitor Plug (evening silent mode only: in night mode it stays off, see Home Night Mode)
      - if:
          - condition: state
            entity_id: input_boolean.home_night_mode
            state: "off"
        then:
          - action: switch.turn_on
            target:
              entity_id: switch.bedroom_baby_monitor_plug
      # Lower Yandex stations volume
      - action: script.set_volume_level_repeatedly
        data:
          media_player: media_player.yandex_station_midi
          volume_level: 0.2
      - action: script.set_volume_level_repeatedly
        data:
          media_player: media_player.yandex_station
          volume_level: 0.4
      # Notify via 7-Segment Clock that we are in silent mode (red); in night mode the clock is off
      # like all other lights (night mode switches silent mode on in the same call, so check it here)
      - if:
          - condition: state
            entity_id: input_boolean.home_night_mode
            state: "on"
        then:
          - action: light.turn_off
            target:
              entity_id: light.7_seg_clock
        else:
          - action: scene.turn_on
            target:
              entity_id: scene.7_seg_clock_red
      # Make DCC-EX volume lower
      - action: media_player.volume_set
        target:
          entity_id: media_player.model_railway
        data:
          volume_level: 0.3
      - action: input_boolean.turn_on
        target:
          entity_id:
          # Ensure silent mode is enabled
            - input_boolean.silent_mode
          # Disallow control of bedroom lights and cover
            - input_boolean.bedroom_lights_and_cover_safety_switch

  reset_silent_mode:
    alias: Reset Silent Mode
    description: >-
      Leaves silent mode: powers off the baby monitor, restores Yandex and model
      railway volume, sets the clock back to Orange Candle, releases the bedroom
      safety switch and confirms by voice (mentions an open living room window). In the morning right after
      the night mode it says good morning with the Morning Report (weather, overnight problems; full text to the phone).
    sequence:
      # Power off Baby Monitor Plug
      - action: switch.turn_off
        target:
          entity_id: switch.bedroom_baby_monitor_plug
      # Raise Yandex stations volume
      - action: script.set_volume_level_repeatedly
        data:
          media_player: media_player.yandex_station_midi
          volume_level: 0.4
      - action: script.set_volume_level_repeatedly
        data:
          media_player: media_player.yandex_station
          volume_level: 0.5
      # Notify via 7-Segment Clock that we left silent mode
      - action: select.select_option
        target:
          entity_id: select.7_seg_clock_preset
        data:
          option: Orange Candle
      # Set DCC-EX max volume
      - action: media_player.volume_set
        target:
          entity_id: media_player.model_railway
        data:
          volume_level: 1.0
      - action: input_boolean.turn_off
        target:
          entity_id:
          # Ensure silent mode is disabled
            - input_boolean.silent_mode
          # Allow control of bedroom lights and cover
            - input_boolean.bedroom_lights_and_cover_safety_switch
      # Voice confirmation (not in night mode); the window is mentioned only when it is really open
      - if:
          - condition: state
            entity_id: input_boolean.home_night_mode
            state: "off"
        then:
          - variables:
              window_note: "{{ ' Окно в гостиной открыто.' if is_state('binary_sensor.living_room_window_contact', 'on') else '' }}"
          - choose:
              # Morning after the night mode (it ended in the last 15 min): good morning + morning report
              # (weather, overnight problems); the full report also goes to the phone as a silent push
              - conditions:
                  - "{{ 5 <= now().hour < 12 }}"
                  - "{{ now() - states.input_boolean.home_night_mode.last_changed < timedelta(minutes=15) }}"
                sequence:
                  - action: script.morning_report
                    # A broken report must not cost the good morning
                    continue_on_error: true
                    response_variable: report
                  - action: media_player.play_media
                    target:
                      entity_id: media_player.yandex_station_midi
                    data:
                      media_content_type: text
                      media_content_id: >-
                        Доброе утро! Тихий режим выключен.{{ window_note }}
                        {{- ' ' ~ report.speech if report is defined and report.speech is defined else '' }}
                  - if:
                      - "{{ report is defined and report.message is defined }}"
                    then:
                      - action: script.notify
                        data:
                          level: status
                          title: 🌅 Доброе утро
                          message: "{{ report.message }}"
                          tag: MORNING_REPORT
                          # Also in HA notifications (same tag = id, so each morning replaces the previous one)
                          persistent: true
            # Silent mode also ends during the day: just confirm ("good morning" only before noon)
            default:
              - action: media_player.play_media
                target:
                  entity_id: media_player.yandex_station_midi
                data:
                  media_content_type: text
                  media_content_id: >-
                    {{ 'Доброе утро! ' if 5 <= now().hour < 12 }}Тихий режим выключен.{{ window_note }}

  home_night_mode:
    alias: Home Night Mode
    description: >-
      The one night routine for every way of starting the night mode (bedroom button, dashboard
      button, phone, Alice, the night mode switch and the automatic start when the apartment is quiet).
      Turns on the night and silent mode flags, applies the Good Night scene (bedroom cover closed,
      moving head, model railway track power, wireless charger and Yandex stations off), turns off all
      lights and the devices of Turn Off All Lights (baby monitor plug, speakers, Interactive CZ Map,
      TV), turns off the 7-segment clock, dims the Nest thermostat screen to 1 % and warns on the phone
      if a window is open during the heating season. Home Day Mode and the *_reenable automations bring
      the clock, charger and map back; the evening track power automation in dcc_ex.yaml brings the
      model railway back.
    sequence:
      # Flags first: in night mode Set Silent Mode keeps the baby monitor off and notifications stay silent
      - action: input_boolean.turn_on
        target:
          entity_id:
            - input_boolean.home_night_mode
            - input_boolean.silent_mode
      # Also when silent mode was already on (then Set Silent Mode does not run again)
      - action: light.turn_off
        target:
          entity_id: light.7_seg_clock
      # Bedroom cover, moving head, model railway track power, wireless charger and Yandex stations.
      # continue_on_error: an unavailable device must not stop the rest of the night routine
      - action: scene.turn_on
        continue_on_error: true
        target:
          entity_id: scene.good_night
      # All lights plus the baby monitor plug, speakers, CZ map, track power and the TV; when the night
      # mode starts by itself the apartment is already quiet, so this only catches what was left on
      - action: script.turn_off_all_lights
        continue_on_error: true
      # Nest screen as dark as possible at night: auto brightness off first, otherwise it overrides the manual value.
      # continue_on_error: the thermostat may be offline (MQTT), the rest of the night mode must not depend on it
      - action: switch.turn_off
        continue_on_error: true
        target:
          entity_id: switch.nestlocal_screen_brightness_auto
      - action: number.set_value
        continue_on_error: true
        target:
          entity_id: number.nestlocal_screen_brightness
        data:
          value: 1
      # Phone push only (night mode is already on, so no voice): rooms with an open window while heating
      - action: script.notify_if_some_window_is_opened_during_heating_season
        continue_on_error: true

  home_day_mode:
    alias: Home Day Mode
    description: >-
      Turns off night and silent mode, returns the Nest thermostat screen to auto brightness, then re-enables
      the wireless charger if anyone is home and the Interactive CZ Map if Sen is home during 06:00-21:00.
    sequence:
      # Ensure night and silent mode are disabled
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.home_night_mode
            - input_boolean.silent_mode
      # Nest screen back to automatic brightness (night mode set it to 1 % manually)
      - action: switch.turn_on
        continue_on_error: true
        target:
          entity_id: switch.nestlocal_screen_brightness_auto
      # Enable wireless charger if anyone is home
      - if:
          - condition: state
            entity_id: binary_sensor.people_home
            state: "on"
        then:
          - action: switch.turn_on
            target:
              entity_id: switch.wireless_charger
      # Enable Interactive CZ Map if Sen is home
      - if:
          - condition: state
            entity_id: person.sen
            state: "home"
          - condition: time
            after: "06:00:00"
            before: "21:00:00"
        then:
          - action: switch.turn_on
            target:
              entity_id: switch.interactive_cz_map_enable

  cover_correct_up:
    alias: Cover Correct Zero Position Up
    description: Sends CORRECT_UP over MQTT to the blinds controller to nudge its zero position up.
    sequence:
      - action: mqtt.publish
        data:
          topic: /blinds/set
          payload: "CORRECT_UP"

  cover_correct_down:
    alias: Cover Correct Zero Position Down
    description: Sends CORRECT_DOWN over MQTT to the blinds controller to nudge its zero position down.
    sequence:
      - action: mqtt.publish
        data:
          topic: /blinds/set
          payload: "CORRECT_DOWN"

###############################################
## AUTOMATIONS
###############################################
automation:
  - id: silent_mode_handler
    # Queued: a quick on -> off toggle must run both scripts in order
    alias: Silent Mode Handler
    description: Runs Set Silent Mode or Reset Silent Mode whenever the Silent Mode boolean changes.
    mode: queued
    max: 5
    triggers:
      - trigger: state
        entity_id: input_boolean.silent_mode
        to: ["on", "off"]
    actions:
      # Pick the script by the new state (templated action name)
      - action: "{{ 'script.set_silent_mode' if trigger.to_state.state == 'on' else 'script.reset_silent_mode' }}"

  # Night mode was only switched on by the good-night button and was forgotten for days (18.11: not used
  # since 11.11), so the morning report and the night settings never ran. Now it also starts by itself.
  - id: night_mode_auto_on
    alias: Night Mode Auto On
    description: >-
      Switches the night mode on (script Home Night Mode) when the whole apartment has been quiet for 10 minutes:
      no room light on, no motion, TV off (Apartment Quiet), 22:00-05:00, someone at home.
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.apartment_quiet
        to: "on"
        for: "00:10:00"
      # Quiet already before 22:00: start at 22:10 if it still holds
      - trigger: time
        at: "22:10:00"
    conditions:
      - condition: state
        entity_id: binary_sensor.apartment_quiet
        state: "on"
        for: "00:10:00"
      - condition: time
        after: "22:00:00"
        before: "05:00:00"
      - condition: state
        entity_id: input_boolean.home_night_mode
        state: "off"
      - condition: state
        entity_id: binary_sensor.people_home
        state: "on"
    actions:
      - action: script.home_night_mode

  - id: night_mode_handler
    alias: Night Mode Handler
    description: >-
      Runs Home Night Mode or Home Day Mode whenever the Home Night Mode boolean
      changes, unless that script is already running (it toggled the boolean itself).
    mode: queued
    max: 5
    triggers:
      - trigger: state
        entity_id: input_boolean.home_night_mode
        to: ["on", "off"]
    actions:
      - variables:
          target_script: "{{ 'script.home_night_mode' if trigger.to_state.state == 'on' else 'script.home_day_mode' }}"
      # The day/night scripts switch this boolean themselves; don't call a script that is already running
      - condition: template
        value_template: "{{ is_state(target_script, 'off') }}"
      - action: "{{ target_script }}"


  - id: yandex_volume_increased_handler
    alias: Yandex Volume Increased Handler
    description: >-
      Treats raising the Yandex Midi volume in the morning (06:00-12:00) while in
      silent mode as a "good morning" signal and switches the home to day mode.
    mode: single
    triggers:
      - trigger: state
        entity_id: media_player.yandex_station_midi
        attribute: volume_level
    conditions:
      - condition: time
        after: "06:00:00"
        before: "12:00:00"
      - condition: state
        entity_id: input_boolean.silent_mode
        state: "on"
      # Only react to an increase, not to any volume change
      - condition: template
        value_template: >
          {% set from = trigger.from_state.attributes.get('volume_level', 0) | float(0) %}
          {% set to = trigger.to_state.attributes.get('volume_level', 0) | float(0) %}
          {{ to > from }}
    actions:
      - action: script.home_day_mode

  - id: good_morning_handler
    alias: Good Morning Handler
    description: >-
      Switches to day mode at 09:00, or when the bedroom cover has been open for
      10 s, if silent mode is still on during the morning window (06:00-12:00).
    mode: single
    triggers:
      - trigger: time
        at: "09:00:00"
      - trigger: state
        entity_id: cover.bedroom
        to: "open"
        for: 00:00:10
    conditions:
      - condition: state
        entity_id: input_boolean.silent_mode
        state: "on"
      - condition: time
        after: "06:00:00"
        before: "12:00:00"
    actions:
      - action: script.home_day_mode

  - id: silent_mode_by_bedroom_door_enable
    alias: Silent Mode by Bedroom Door Enable
    description: Enables silent mode when the bedroom door has been closed for 30 seconds (any time of day).
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.bedroom_door_contact
        to: "off"
        for: 00:00:30
    actions:
      # If bedroom door closed ("off" state), then turn on silent mode
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.silent_mode

  - id: silent_mode_by_bedroom_door_disable
    alias: Silent Mode by Bedroom Door Disable
    description: >-
      Disables silent mode when the bedroom door has been open for 1 minute during
      the day (06:00-20:00), unless night mode is on.
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.bedroom_door_contact
        to: "on"
        for: 00:01:00
    conditions:
      - condition: state
        entity_id: input_boolean.home_night_mode
        state: "off"
      - condition: time
        after: "06:00:00"
        before: "20:00:00"
    actions:
      # If bedroom door opened ("on" state), then turn off silent mode
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.silent_mode

  - id: prevent_accidental_bedroom_lights_on
    alias: Prevent Accidental Bedroom Lights ON
    description: >-
      While the bedroom safety switch is on, turns bedroom lights back off when
      they were switched on from HA by a user (UI/app); physical switches and
      automations are not blocked.
    triggers:
      - trigger: state
        entity_id:
          - light.bedroom_ceiling_light
          - light.bedroom_nightlight
        to: "on"
    conditions:
      - condition: state
        entity_id: input_boolean.bedroom_lights_and_cover_safety_switch
        state: "on"
      # Allow the light to be turned on if it was done manually (trigger.to_state.context.user_id is null)
      - condition: template
        value_template: "{{ trigger.to_state.context.user_id != None }}"
    actions:
      - action: light.turn_off
        target:
          entity_id: "{{ trigger.entity_id }}"

  - id: prevent_accidental_bedroom_cover_open
    alias: Prevent Accidental Bedroom Cover Open
    description: >-
      While the bedroom safety switch is on, closes the bedroom cover again if a
      user opened it from HA; physical buttons, automations and Yandex voice
      commands are allowed.
    triggers:
      - trigger: state
        entity_id: cover.bedroom
        to: "open"
    conditions:
      - condition: state
        entity_id: input_boolean.bedroom_lights_and_cover_safety_switch
        state: "on"
      # Allow the cover to be opened if it was done manually (trigger.to_state.context.user_id is null)
      - condition: template
        value_template: "{{ trigger.to_state.context.user_id != None }}"
      # Allow the cover to be opened by Yandex Station
      # Secret template: true unless the change came from the Yandex integration user
      - condition: template
        value_template: !secret TEMPLATE_NOT_A_YANDEX_USER_ID
    actions:
      - action: cover.close_cover
        target:
          entity_id: "{{ trigger.entity_id }}"

  # Prevent accidental volume increase on all Yandex devices in silent mode.
  - id: prevent_accidental_yandex_volume_increase_at_silent_mode
    alias: Prevent Accidental Yandex Volume Increase at Silent Mode
    description: >-
      In silent mode outside 06:00-12:00, resets both Yandex stations to quiet
      levels (Midi 0.2, Mini 0.4) when either volume is raised above 0.4.
    triggers:
      - trigger: state
        entity_id: media_player.yandex_station
        attribute: volume_level
      - trigger: state
        entity_id: media_player.yandex_station_midi
        attribute: volume_level
    conditions:
      - condition: state
        entity_id: input_boolean.silent_mode
        state: "on"
      # 06:00-12:00 a volume increase means "good morning" (Yandex Volume Increased Handler wins)
      - condition: not
        conditions:
          - condition: time
            after: "06:00:00"
            before: "12:00:00"
      # Only an increase that ends above 0.4 counts as accidental
      - condition: template
        value_template: >
          {% set from = trigger.from_state.attributes.get('volume_level', 0) | float(0) %}
          {% set to = trigger.to_state.attributes.get('volume_level', 0) | float(0) %}
          {{ to > from and to > 0.4 }}
    actions:
      # Lower Yandex stations volume
      - action: script.set_volume_level_repeatedly
        data:
          media_player: media_player.yandex_station_midi
          volume_level: 0.2
      - action: script.set_volume_level_repeatedly
        data:
          media_player: media_player.yandex_station
          volume_level: 0.4

  # Autoenable Baby Monitor Plug at 20:00 if anyone is home and Baby Monitor Plug is off
  - id: autoenable_bedroom_baby_monitor_plug_at_20_00
    alias: Autoenable Bedroom Baby Monitor Plug at 20:00
    description: Turns on the bedroom baby monitor plug at 20:00 if anyone is home, it is off and night mode is not on yet.
    mode: single
    triggers:
      - trigger: time
        at: "20:00:00"
    conditions:
      - condition: state
        entity_id: binary_sensor.people_home
        state: "on"
      - condition: state
        entity_id: switch.bedroom_baby_monitor_plug
        state: "off"
      # Night mode switches it off; don't power it again if night mode started before 20:00
      - condition: state
        entity_id: input_boolean.home_night_mode
        state: "off"
    actions:
      - action: switch.turn_on
        target:
          entity_id: switch.bedroom_baby_monitor_plug

  # Prevent accidental volume increase on Yandex Mini in normal conditions (not in silent mode).
  # Used to save ears from loud music when children play with the volume buttons.
  - id: prevent_accidental_yandex_mini_volume_increase
    alias: Prevent Accidental Yandex Mini Volume Increase
    description: >-
      Caps the Yandex Mini volume at 0.8 when it is raised above that by a change
      without a HA user (device buttons), to protect ears when children play with it.
    mode: restart
    triggers:
      - trigger: state
        entity_id: media_player.yandex_station
        attribute: volume_level
    conditions:
      # Allow volume to be changed externally (not by buttons on the device)
      - condition: template
        value_template: "{{ trigger.to_state.context.user_id == None }}"
      # Only an increase that ends above 0.8 is clamped; setting 0.8 itself won't retrigger
      - condition: template
        value_template: >
          {% set from = trigger.from_state.attributes.get('volume_level', 0) | float(0) %}
          {% set to = trigger.to_state.attributes.get('volume_level', 0) | float(0) %}
          {{ to > from and to > 0.8 }}
    actions:
      # Lower Yandex volume
      - action: script.set_volume_level_repeatedly
        data:
          media_player: media_player.yandex_station
          volume_level: 0.8

###############################################
## SCENES
###############################################
scene:
  - name: Good Night
    id: good_night
    entities:
      # Turning off all lights is called from script.turn_off_all_lights
      cover.bedroom: closed
      switch.moving_head_power: off
      switch.ex_commandstation_tracks_power: off
      switch.wireless_charger: off
      media_player.yandex_station: off
      media_player.yandex_station_midi: off

  - name: No People Home
    id: no_people_home
    entities:
      # Turning off all lights is called from script.turn_off_all_lights
      switch.moving_head_power: off
      switch.ex_commandstation_tracks_power: off
      switch.wireless_charger: off
      media_player.yandex_station: off
      media_player.yandex_station_midi: off

  - name: 7 Seg Clock Red
    id: 7_seg_clock_red
    entities:
      light.7_seg_clock:
        state: on
        effect: Solid
        rgb_color: [255, 0, 0]
