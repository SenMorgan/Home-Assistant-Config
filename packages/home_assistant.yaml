###############################################
## INPUT BUTTONS
###############################################
input_button:
  home_assistant_power_off:
    name: Home Assistant Power Off
    icon: mdi:power
  home_assistant_reboot:
    name: Home Assistant Reboot
    icon: mdi:restart
  server_rack_power_off:
    name: Server Rack Power Off
    icon: mdi:power

###############################################
## SENSORS
###############################################
sensor:
  - platform: history_stats
    name: "Asus PC Work Time Today"
    entity_id: switch.asus_pc
    state: "on"
    type: time
    start: "{{ today_at('00:00:00') }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: "Lenovo Laptop Work Time Today"
    entity_id: switch.lenovo_thinkbook
    state: "on"
    type: time
    start: "{{ today_at('00:00:00') }}"
    end: "{{ now() }}"
  # Time and Date sensor used in notifications
  - platform: time_date
    display_options:
      - "time"
      - "date"

###############################################
## TEMPLATE ENTITIES
###############################################
template:
  - binary_sensor:
      - name: People Home
        unique_id: people_home
        device_class: presence
        state: "{{ is_state('person.sen', 'home') or is_state('person.kris', 'home') }}"
      - name: Any Battery Device Low
        unique_id: any_battery_device_low
        state: "{{ expand('group.low_battery_devices') | list | count > 0 }}"
      - name: HA CPU Overheat
        unique_id: ha_cpu_overheat
        device_class: problem
        state: "{{ states('sensor.processor_temperature') | float > 60 }}"
      # No successful automatic backup for 8 days (schedule is weekly). Catches silent failures
      # like 18 Oct - 5 Nov 2026, when every attempt failed and nobody noticed for three weeks
      - name: Backup Overdue
        unique_id: backup_overdue
        device_class: problem
        state: >-
          {% set last = states('sensor.backup_last_successful_automatic_backup') | as_datetime %}
          {{ last is none or now() - last > timedelta(days=8) }}

###############################################
## ALERTS
###############################################
alert:
  # Low batteries (N-29) are no longer a repeating alert: see the "Low Battery Device" and
  # "Low Battery Weekly Summary" automations below (one push per device + Sunday summary).

  backup_overdue:
    name: "Backup Overdue"
    entity_id: binary_sensor.backup_overdue
    state: "on"
    repeat: 720
    notifiers:
      - mobile_app_sen_s25
      - persistent_notification
    title: >-
      {{ '💾 Бекап просрочен' if is_state('binary_sensor.backup_overdue', 'on') else '💾 Бекап снова успешен' }}
    message: >-
      Нет успешного автоматического бекапа больше 8 дней · последний
      {{ as_timestamp(states('sensor.backup_last_successful_automatic_backup'), 0) | timestamp_custom('%d.%m.%Y %H:%M') }}
    done_message: Автоматический бекап снова прошёл успешно
    data:
      channel: Предупреждения
      importance: high
      priority: high
      ttl: 0

  home_assistant_cpu_temp_high:
    name: "Home Assistant CPU Temperature High"
    entity_id: binary_sensor.ha_cpu_overheat
    state: "on"
    repeat: 60
    notifiers:
      - mobile_app_sen_s25
      - persistent_notification
    title: "🌡️ Сервер перегрет: {{ states('sensor.processor_temperature') | round(0) | int }} °C"
    message: Проверьте вентиляцию серверного шкафа
    data:
      channel: Предупреждения
      importance: high
      priority: high
      ttl: 0

###############################################
## SCRIPTS
###############################################
script:
  home_assistant_shutdown:
    alias: Home Assistant Shutdown
    description: Shuts down the Home Assistant host (Supervisor host shutdown, not just a core restart).
    mode: single
    sequence:
      - action: hassio.host_shutdown

  home_assistant_reboot:
    alias: Home Assistant Reboot
    description: Reboots the Home Assistant host via the Supervisor.
    mode: single
    sequence:
      - action: hassio.host_reboot

###############################################
## AUTOMATIONS
###############################################
automation:
  - id: home_assistant_backup_failed_notification
    alias: Home Assistant Backup Failed Notification
    description: >-
      Push + persistent notification when an automatic backup fails, including partial failures
      (one storage location, e.g. Google Drive full). Ignores the event entity being restored
      after a restart, which re-reports the last (possibly old) failure.
    mode: queued
    triggers:
      - trigger: state
        entity_id: event.backup_automatic_backup
    conditions:
      # A real new event: the previous state was valid and the timestamp changed
      - condition: template
        value_template: >-
          {{ trigger.from_state is not none and trigger.to_state is not none
             and trigger.from_state.state not in ['unavailable', 'unknown']
             and trigger.to_state.state != trigger.from_state.state
             and trigger.to_state.attributes.event_type == 'failed' }}
    actions:
      - action: script.notify
        data:
          level: warning
          title: 💾 Бекап не удался
          message: >-
            {{ trigger.to_state.attributes.failed_reason | default('причина неизвестна', true) }} ·
            подробности в настройках резервных копий
          url: /config/backup

  # Keep only 30 days of raw history for high-frequency diagnostic sensors
  # (global retention stays 180 days; long-term statistics are not affected)
  - id: recorder_purge_heavy_writers
    alias: Recorder Purge Heavy Writers
    description: >-
      Nightly purge of raw history for noisy diagnostic entities (7-segment clock light, ZBT
      EZSP counters, uptime sensors), keeping only the last 30 days to limit database growth.
    mode: single
    triggers:
      - trigger: time
        at: "03:37:00"
    actions:
      # The target entity and entity_globs are combined: both the light and all matching sensors are purged
      - action: recorder.purge_entities
        target:
          entity_id: light.7_seg_clock
        data:
          keep_days: 30
          entity_globs:
            - sensor.silicon_labs_ezsp_*
            - sensor.*_uptime

  ###############################################
  ## Notifications
  ###############################################

  - id: home_assistant_start_notification
    alias: Home Assistant Start Notification
    description: >-
      Silent status push each time Home Assistant starts, with the version and how long the start took
      (sensor.uptime holds the moment Core started). Replaces the shutdown push (same tag).
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - action: script.notify
        data:
          level: status
          tag: ha_state
          title: 🟢 HA запущен
          message: >-
            {% set up = states('sensor.uptime') | as_datetime %}
            Версия {{ states('sensor.home_assistant_versions') }}
            {%- if up %} · запуск занял {{ (now() - up).total_seconds() | round(0) | int }} с{% endif %}

  - id: home_assistant_shutdown_notification
    alias: Home Assistant Shutdown Notification
    description: >-
      Silent status push when Home Assistant begins shutting down (restart or power-off; the event
      does not say which). Replaced by the start push (same tag).
    triggers:
      - trigger: homeassistant
        event: shutdown
    actions:
      - action: script.notify
        data:
          level: status
          tag: ha_state
          title: ⚠️ HA выключается
          message: Перезапуск или выключение · время события на уведомлении


  - id: home_assistant_update_available_notification
    alias: Home Assistant Update Available Notification
    description: >-
      Notifies the phone when a new Home Assistant Core version becomes available, with buttons for the
      release notes and Settings. Other updates come in the daily summary below.
    triggers:
      - trigger: state
        entity_id: update.home_assistant_core_update
        from: "off"
        to: "on"
    actions:
      - action: script.notify
        data:
          level: info
          title: ⬆️ Обновление HA {{ state_attr('update.home_assistant_core_update', 'latest_version') }}
          message: Сейчас {{ state_attr('update.home_assistant_core_update', 'installed_version') }}
          url: /config/updates
          actions:
            - action: URI
              title: 📋 Что нового
              uri: "{{ state_attr('update.home_assistant_core_update', 'release_url') }}"
            - action: URI
              title: ⚙️ Настройки
              uri: /config/updates

  # I-10: one silent daily summary instead of a push per update entity (~80 of them)
  - id: home_assistant_updates_daily_summary
    alias: Home Assistant Updates Daily Summary
    description: >-
      Every day at 19:00 sends one silent status push listing pending updates (add-ons, integrations,
      firmware, OS), replacing yesterday's (same tag). Core updates also get their own push above.
    mode: single
    triggers:
      - trigger: time
        at: "19:00:00"
    variables:
      pending: >-
        {{ states.update | selectattr('state', 'eq', 'on') | map(attribute='name')
           | map('replace', ' Firmware', '') | map('replace', ' Update', '') | sort | list }}
    conditions:
      - "{{ pending | count > 0 }}"
    actions:
      - action: script.notify
        data:
          level: status
          tag: updates
          title: ⬆️ Обновления ({{ pending | count }})
          message: "{{ pending | join(', ') }}"
          url: /config/updates

  # Used blueprint from: https://community.home-assistant.io/t/blueprint-notify-when-zigbee-zwave-any-battery-device-has-gone-offline/537631
  - id: notification_battery_device_gone_offline
    alias: Notification Battery Device Gone Offline
    description: >-
      Daily at 20:00 reports all battery-powered sensors/binary sensors that are currently
      unavailable (likely gone offline or with a dead battery), except entities listed in the
      EXCLUDED_BATTERY_DEVICES secret.
    mode: single
    variables:
      # Day of week to run on (1=Mon..7=Sun); 0 means every day
      day: 0
      excluded_entities: !secret EXCLUDED_BATTERY_DEVICES
      # Names (without the " Battery" suffix) of all unavailable battery-class sensors and binary sensors
      sensors: >-
        {% set result = namespace(sensors=[]) %} {% for state in states.sensor |
        selectattr('attributes.device_class', 'defined') |
        selectattr('attributes.device_class', '==', 'battery') %}
          {% if "unavailable" in state | string and not state.entity_id in excluded_entities %}
            {% set result.sensors = result.sensors + [state.name.replace(" Battery", "")] %}
          {% endif %}
        {% endfor %} {% for state in states.binary_sensor |
        selectattr('attributes.device_class', 'defined') |
        selectattr('attributes.device_class', '==', 'battery') %}
          {% if "unavailable" in state | string and not state.entity_id in excluded_entities %}
            {% set result.sensors = result.sensors + [state.name.replace(" Battery", "")] %}
          {% endif %}
        {% endfor %} {{result.sensors|join(', ')}}
      message: "{{ sensors }}"
    triggers:
      - trigger: time
        at: "20:00:00"
    conditions:
      # Only notify if something is offline and today is the configured day
      - "{{ sensors != '' and (day | int(0) == 0 or day | int(0) == now().isoweekday()) }}"
    actions:
      - action: script.notify
        data:
          level: info
          persistent: true
          notification_id: battery_devices_offline
          title: "📴 Недоступные устройства ({{ sensors.split(', ') | count }})"
          message: "{{ message }}"


  - id: notification_internet_connection
    alias: Notification Internet Connection
    description: >-
      Push and persistent notification when the internet connection is lost or restored. The loss
      push is delivered only after the internet is back, so it keeps the time in the text.
    mode: queued
    triggers:
      - trigger: state
        entity_id: binary_sensor.internet_connection
    conditions:
      # Ignore transitions to/from unavailable/unknown (e.g. during startup)
      - condition: template
        value_template: "{{ trigger.to_state.state in ['on', 'off'] }}"
    actions:
      - if:
          - condition: state
            entity_id: binary_sensor.internet_connection
            state: "off"
        then:
          - action: script.notify
            data:
              level: warning
              title: 🌐 Нет интернета
              message: Интернет соединение потеряно в {{ trigger.to_state.last_changed | as_local | as_timestamp | timestamp_custom('%H:%M') }}
              when: "{{ as_timestamp(trigger.to_state.last_changed) | int }}"
        else:
          - action: script.notify
            data:
              level: info
              persistent: true
              title: 🌐 Интернет вернулся
              message: >-
                {% from 'ru.jinja' import duration_short %}
                {% set mins = ((as_timestamp(trigger.to_state.last_changed) - as_timestamp(trigger.from_state.last_changed)) / 60) | round(0) | int %}
                Не было {{ duration_short(mins) }} · с {{ trigger.from_state.last_changed | as_local | as_timestamp | timestamp_custom('%H:%M') }}

  ###############################################
  ## Low Battery Notifications
  ###############################################

  - id: home_assistant_monitor_battery_devices
    alias: Home Assistant Monitor Battery Devices
    description: >-
      Every 10 minutes (and at startup) rebuilds group.battery_devices with all battery sensors
      (minus excluded ones) and group.low_battery_devices with those at or below 20%. The low
      battery group drives binary_sensor.any_battery_device_low and its alert.
    triggers:
      # Trigger on startup
      - trigger: homeassistant
        event: start
      # Trigger every 10 minutes
      - trigger: time_pattern
        minutes: "/10"
    actions:
      - variables:
          excluded_entities: !secret EXCLUDED_BATTERY_DEVICES
      # Create a group of battery devices for UI
      - action: group.set
        data:
          object_id: battery_devices
          entities: >-
            {% for state in states.sensor
              if is_state_attr(state.entity_id, 'device_class', 'battery') and
              state.entity_id not in excluded_entities %}
              {{ state.entity_id }}{%- if not loop.last -%}, {%- endif -%}
            {%- endfor %}
      # Create a group of low battery devices for notifications
      - action: group.set
        data:
          object_id: low_battery_devices
          # Members: battery devices with numeric state <= threshold (20%); empty list if none
          entities: >-
            {% set threshold = 20 %}
            {% set ns = namespace(low=[]) %}
            {# Compare as numbers, so fractional states like "15.5" are handled too #}
            {% for s in expand('group.battery_devices') | selectattr('state', 'is_number') %}
              {% if s.state | float <= threshold %}
                {% set ns.low = ns.low + [s.entity_id] %}
              {% endif %}
            {% endfor %}
            {% set low_devices = ns.low | sort %}
            {% if low_devices | length > 0 %}
              {{ low_devices | join(', ') }}
            {% else %}
              []
            {% endif %}

  # Alert if any temperature sensor has not updated its state for 3 hours
  - id: notification_temperature_sensor_unchanged
    alias: Notification Temperature Sensor Unchanged
    description: >-
      Warns when one of the BLE (ATC) room temperature sensors has not changed state for 3 hours,
      which usually means the sensor stopped reporting (dead battery or out of range).
    mode: queued
    max: 10
    max_exceeded: silent
    variables:
      # Room name from the entity's area, falling back to the sensor name
      room: >-
        {% from 'ru.jinja' import room_ru %}
        {{ room_ru(area_name(trigger.entity_id)) if area_name(trigger.entity_id) else trigger.to_state.attributes.friendly_name }}
      sensor_state: "{{ trigger.to_state.state }}"
      # The time differs from the push time (3 h earlier), so it stays in the text
      sensor_last_changed: "{{ as_timestamp(trigger.to_state.last_changed, 0) | timestamp_custom('%d.%m %H:%M') }}"
    triggers:
      - trigger: state
        entity_id: sensor.ble_temperature_atc_bathroom
        for: "03:00:00"
      - trigger: state
        entity_id: sensor.ble_temperature_atc_bedroom
        for: "03:00:00"
      - trigger: state
        entity_id: sensor.ble_temperature_atc_hall
        for: "03:00:00"
      - trigger: state
        entity_id: sensor.ble_temperature_atc_living_room
        for: "03:00:00"
      - trigger: state
        entity_id: sensor.ble_temperature_atc_toilet
        for: "03:00:00"
    actions:
      - action: script.notify
        data:
          level: warning
          title: "🌡️ Датчик давно не обновлялся: {{ room }}"
          message: >-
            {% from 'ru.jinja' import num %}
            Последнее значение {{ num(sensor_state) }} °C в {{ sensor_last_changed }} · проверьте устройство

  ###############################################
  ## Other Automations
  ###############################################

  - id: home_assistant_power_off
    alias: Home Assistant - Power Off
    description: Dashboard button handler that shuts down the Home Assistant host.
    triggers:
      - trigger: state
        entity_id: input_button.home_assistant_power_off
    actions:
      - action: script.turn_on
        target:
          entity_id: script.home_assistant_shutdown

  - id: home_assistant_reboot
    alias: Home Assistant - Reboot
    description: Dashboard button handler that reboots the Home Assistant host.
    triggers:
      - trigger: state
        entity_id: input_button.home_assistant_reboot
    actions:
      - action: script.turn_on
        target:
          entity_id: script.home_assistant_reboot

  - id: home_assistant_server_rack_power_off
    alias: Home Assistant Server Rack - Power Off
    description: >-
      Dashboard button to power off the whole server rack: shuts down the Synology NAS first,
      waits 10 s, then shuts down the Home Assistant host. If the NAS is already unavailable,
      asks for confirmation on the phone (TTS + actionable notification) before shutting down HA;
      no answer within 10 minutes cancels the shutdown.
    # restart: pressing the button again aborts a pending confirmation and starts over
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_button.server_rack_power_off
    actions:
      # Check Synology Shutdown button state:
      - if:
          - condition: state
            entity_id: button.synology_ds220_shutdown
            state: "unavailable"
        # If Synology is unavailable, ask for the confirmation
        then:
          - variables:
              # Including an id in the action allows us to identify this script run
              # and not accidentally trigger for other notification actions
              action_power_off: "{{ 'action_power_off' ~ context.id }}"
              action_cancel: "{{ 'action_cancel' ~ context.id }}"
          # Critical for Sen only: push with buttons + spoken on the phone (alarm stream) and speaker
          - action: script.notify
            data:
              level: critical
              recipients: [mobile_app_sen_s25]
              persistent: false
              title: 🗄️ Synology не отвечает
              message: Всё равно выключить рек?
              tts: Synology не отвечает. Подтвердите выключение на телефоне.
              actions:
                - action: "{{ action_power_off }}"
                  title: ⏻ Выключить
                - action: "{{ action_cancel }}"
                  title: ✖ Отмена
          # Waiting for «action_power_off» or «action_cancel» avoids accidentally continuing
          # for another script/automation's notification action
          # No answer within 10 minutes counts as "Cancel" (wait.trigger stays none),
          # so a forgotten notification cannot shut HA down hours later
          - wait_for_trigger:
              - trigger: event
                event_type: mobile_app_notification_action
                event_data:
                  action: "{{ action_power_off }}"
              - trigger: event
                event_type: mobile_app_notification_action
                event_data:
                  action: "{{ action_cancel }}"
            timeout: "00:10:00"
            continue_on_timeout: true
          # Perform the action
          - choose:
              - conditions: "{{ wait.trigger is not none and wait.trigger.event.data.action == action_power_off }}"
                sequence:
                  # Turn OFF Home Assistant
                  - action: script.turn_on
                    target:
                      entity_id: script.home_assistant_shutdown
            # "Cancel" pressed or no answer within 10 minutes
            default:
              - action: script.notify
                data:
                  level: info
                  persistent: true
                  title: 🗄️ Выключение отменено
                  message: >-
                    {{ 'Нажата отмена' if wait.trigger is not none else 'Нет ответа 10 минут' }}
        else:
          - action: script.notify
            data:
              level: warning
              title: 🗄️ Серверный рек выключается
              message: Synology → HA → питание
          # Turn OFF the Synology DS220+
          - action: button.press
            target:
              entity_id: button.synology_ds220_shutdown
          - delay: 00:00:10
          # Turn OFF Home Assistant
          - action: script.turn_on
            target:
              entity_id: script.home_assistant_shutdown

  ###############################################
  ## Low Battery Notifications (N-29)
  ###############################################
  - id: home_assistant_low_battery_device
    alias: Home Assistant Low Battery Device
    description: >-
      One push per device when it newly joins group.low_battery_devices (rebuilt every 10 minutes by
      "Monitor Battery Devices"), instead of a repeating alert. Covers Danfoss radiator valves too (I-12).
    mode: queued
    max: 10
    triggers:
      - trigger: state
        entity_id: group.low_battery_devices
        attribute: entity_id
    variables:
      # Devices that are low now but were not low before
      new_low: >-
        {% set old = trigger.from_state.attributes.entity_id | default([]) if trigger.from_state else [] %}
        {% set cur = trigger.to_state.attributes.entity_id | default([]) if trigger.to_state else [] %}
        {{ cur | reject('in', old) | list }}
    conditions:
      # Skip the startup rebuild (group created from nothing), so a restart does not re-send everything
      - "{{ trigger.from_state is not none and new_low | count > 0 }}"
    actions:
      - repeat:
          for_each: "{{ new_low }}"
          sequence:
            - action: script.notify
              data:
                level: warning
                persistent: true
                notification_id: "low_battery_{{ repeat.item }}"
                title: >-
                  🪫 {{ device_attr(repeat.item, 'name_by_user') or device_attr(repeat.item, 'name')
                       or state_attr(repeat.item, 'friendly_name') }}: {{ states(repeat.item) | float(0) | round(0) | int }} %
                message: >-
                  {% set model = device_attr(repeat.item, 'model') %}
                  Пора заменить батарейку{% if model %} · {{ model }}{% endif %}

  - id: home_assistant_low_battery_weekly_summary
    alias: Home Assistant Low Battery Weekly Summary
    description: Sunday 10:00 summary of all devices still at or below 20 % battery.
    mode: single
    triggers:
      - trigger: time
        at: "10:00:00"
        weekday: sun
    variables:
      low: "{{ expand('group.low_battery_devices') | sort(attribute='state') | list }}"
    conditions:
      - "{{ low | count > 0 }}"
    actions:
      - action: script.notify
        data:
          level: info
          title: "🪫 Батарейки: {{ low | count }}"
          message: >-
            {% for s in low %}{{ s.name | replace(' Battery', '') }} {{ s.state | float(0) | round(0) | int }} %{{ ', ' if not loop.last }}{% endfor %}
