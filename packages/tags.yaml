###############################################
## INPUT BOOLEANS
###############################################
input_boolean:
  show_cameras_in_lovelace:
    name: Show Cameras in Lovelace
    icon: mdi:camera

###############################################
## AUTOMATIONS
###############################################
automation:
  - id: tag_near_pc_was_scanned
    alias: Tag Near PC was scanned
    description: >-
      Scanning the NFC tag near the PC toggles whether cameras are shown on the
      dashboard and reports the new mode to the phone.
    mode: single
    triggers:
      - trigger: tag
        tag_id: c45d3b71-2ade-45e3-8663-f0028f52b01d
    actions:
      - action: input_boolean.toggle
        target:
          entity_id: input_boolean.show_cameras_in_lovelace
      # Message reflects the state after the toggle above
      - action: script.notify
        data:
          level: status
          tag: cameras
          title: >-
            📷 Камеры на дашборде: {{ 'показаны' if is_state('input_boolean.show_cameras_in_lovelace', 'on') else 'скрыты' }}
          message: NFC-метка у компьютера

  - id: reenable_cameras_if_hided
    alias: Reenable Cameras if Hided
    description: >-
      Safety net: if cameras have been hidden from the dashboard for an hour,
      show them again automatically and notify the phone.
    mode: single
    triggers:
      - trigger: state
        entity_id: input_boolean.show_cameras_in_lovelace
        to: "off"
        for: "01:00:00"
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.show_cameras_in_lovelace
      - action: script.notify
        data:
          level: status
          tag: cameras
          title: "📷 Камеры на дашборде: показаны"
          message: Автоматически, через час после скрытия

