###############################################
## INPUT BUTTONS
###############################################
input_button:
  parking_light:
    name: Parking Light
    icon: mdi:light-flood-down
  activate_night_mode:
    name: Activate Night Mode
    icon: mdi:moon-waning-crescent

###############################################
## LIGHT GROUPS
###############################################
light:
  # Lights switched off by script.turn_off_all_lights (leave home, night mode, cube shake)
  - platform: group
    name: All Home Lights
    unique_id: all_home_lights
    entities:
      - light.backyard_bar_light_led_strip_6
      - light.banana_light
      - light.bedroom_ceiling_light
      - light.bedroom_nightlight
      - light.christmas_tree
      - light.cocktail_bar_neon_sign
      - light.dollhouse_lights
      - light.floor_lamp
      - light.gyver_lamp
      - light.hall_edison_bulb
      - light.hall_lights
      - light.kitchen_ceiling_light
      - light.kitchen_christmas_lights
      - light.kitchen_led_strip
      - light.kitchen_spotlights
      - light.living_room_ceiling_light
      - light.mi_desk_lamp
      - light.pc_backlight
      - light.shelf_lighting
      - light.string_lights
      - light.tv_lights

###############################################
## SCRIPTS
###############################################
script:
  turn_off_all_lights:
    alias: Turn Off All Lights
    description: >-
      Turns off every light in the All Home Lights group, powers off non-light
      devices (charger, baby monitor, speakers, CZ map, railway track power) and
      the Samsung TV. Used when leaving home and for night mode.
    sequence:
      # Explicit group instead of "all": keeps DMX channels, printer chamber light, camera flash and indicator LEDs untouched
      - action: light.turn_off
        target:
          entity_id: light.all_home_lights
      # Power off other devices that are not lights but should be turned off when no one is home
      - action: switch.turn_off
        target:
          entity_id:
            - switch.wireless_charger
            - switch.bedroom_baby_monitor_plug
            - switch.monolith_speakers
            - switch.interactive_cz_map_enable
            - switch.ex_commandstation_tracks_power
      - action: script.turn_off_samsung_tv

  switch_on_parking_light:
    alias: Switch On Parking Light
    description: >-
      Power-cycles the parking light relay: turns it off, waits 15 s, then keeps
      sending turn_on every second (max 300 tries) until the relay reports on.
    sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.parking_light
      - delay:
          seconds: 15
      - repeat:
          while:
            - condition: state
              entity_id: switch.parking_light
              state: "off"
            # Don't do it too many times
            - condition: template
              value_template: "{{ repeat.index <= 300 }}"
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.parking_light
            - delay:
                seconds: 1

  activate_night_mode:
    alias: Activate Night Mode
    description: >-
      Good-night routine: applies the Good Night scene, enables night and silent
      modes, turns off all lights and warns if a window is open during heating season.
    sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.good_night
      - action: input_boolean.turn_on
        target:
          entity_id:
            - input_boolean.home_night_mode
            - input_boolean.silent_mode
      - action: script.turn_off_all_lights
      - action: script.notify_if_some_window_is_opened_during_heating_season

###############################################
## AUTOMATIONS
###############################################
automation:
  - id: welcome_lights
    alias: Welcome Lights
    description: >-
      When Sen or Kris arrives home, waits up to 15 min for the hall door to open,
      then turns on the welcome scene(s) during the day or only the hall Edison
      bulb at half brightness at night.
    mode: restart
    triggers:
      - trigger: state
        entity_id: person.sen
        to: "home"
      - trigger: state
        entity_id: person.kris
        to: "home"
    actions:
      # Wait until hall door is opened
      - wait_template: "{{ states('binary_sensor.hall_door_contact') == 'on' }}"
        timeout: 00:15:00
        continue_on_timeout: false
      # If it is daytime - turn on welcome scene
      - if:
          - condition: time
            after: "05:00:00"
            before: "22:00:00"
          - condition: state
            entity_id: input_boolean.home_night_mode
            state: "off"
        then:
          - action: scene.turn_on
            target:
              entity_id: scene.welcome_home
          # If Sen came home - turn on his welcome scene too
          - if:
              - condition: state
                entity_id: person.sen
                state: "home"
            then:
              - action: scene.turn_on
                target:
                  entity_id: scene.welcome_home_sen
        else:
          # If it is nighttime - just turn on hall edison bulb on half brightness
          - action: light.turn_on
            target:
              entity_id: light.hall_edison_bulb
            data:
              brightness: 128



  - id: pc_lights_by_presence
    alias: PC Lights by Presence
    description: >-
      Turns the banana light on when the FP2 sensor detects presence at the PC
      (07:00-21:00) and off after 10 s without presence (07:00-23:00); only when Sen is home.
    mode: restart
    triggers:
      # Presence detected near the PC
      - trigger: state
        entity_id: binary_sensor.presence_sensor_fp2_pc
        to: "on"
        id: presence_on
      # No presence for 10 seconds
      - trigger: state
        entity_id: binary_sensor.presence_sensor_fp2_pc
        to: "off"
        for: "00:00:10"
        id: presence_off
    conditions:
      # Run automation only when Sen is home
      - condition: state
        entity_id: person.sen
        state: "home"
    actions:
      - choose:
          # Turn lights on only during daytime
          - conditions:
              - condition: trigger
                id: presence_on
              - condition: time
                after: "07:00:00"
                before: "21:00:00"
            sequence:
              - action: light.turn_on
                target:
                  entity_id: light.banana_light
          # Turn lights off within an extended time window
          - conditions:
              - condition: trigger
                id: presence_off
              - condition: time
                after: "07:00:00"
                before: "23:00:00"
            sequence:
              - action: light.turn_off
                target:
                  entity_id: light.banana_light

  - id: shelf_and_neon_lighting_by_presence
    alias: Shelf and Neon Lighting by Presence
    description: >-
      Turns the shelf lighting and cocktail bar neon sign on when the FP2 detection
      zone sees presence (07:00-21:00) and off after 10 s without presence
      (07:00-23:00); only when Sen is home.
    mode: restart
    triggers:
      # Presence detected in detection zone
      - trigger: state
        entity_id: binary_sensor.presence_sensor_fp2_detection_zone_presence
        to: "on"
        id: presence_on
      # No presence for 10 seconds
      - trigger: state
        entity_id: binary_sensor.presence_sensor_fp2_detection_zone_presence
        to: "off"
        for: "00:00:10"
        id: presence_off
    conditions:
      # Run automation only when Sen is home
      - condition: state
        entity_id: person.sen
        state: "home"
    actions:
      - choose:
          # Turn lights on only during daytime
          - conditions:
              - condition: trigger
                id: presence_on
              - condition: time
                after: "07:00:00"
                before: "21:00:00"
            sequence:
              - action: light.turn_on
                target:
                  entity_id: light.shelf_lighting
              # Brightness of the cocktail bar neon sign depends on ambient light level, but at least 10
              - action: light.turn_on
                target:
                  entity_id: light.cocktail_bar_neon_sign
                # Lux x10, clamped to 10..255; anchor reused by Cocktail Bar Neon Sign Reenable
                data: &cocktail_bar_neon_sign_brightness
                  brightness: "{{ [10, [255, ((states('sensor.presence_sensor_fp2_light_sensor_kitchen') | int(1)) * 10)] | min] | max }}"
          # Turn lights off within an extended time window
          - conditions:
              - condition: trigger
                id: presence_off
              - condition: time
                after: "07:00:00"
                before: "23:00:00"
            sequence:
              - action: light.turn_off
                target:
                  entity_id:
                    - light.shelf_lighting
                    - light.cocktail_bar_neon_sign

  ###############################################
  ## Other Lights Automations
  ###############################################
  - id: kitchen_asus_pc_background_lights_on
    alias: Kitchen Asus PC Background Lights ON
    description: Turns on the Gyver lamp with the fire effect when the Asus PC is switched on and Sen is home.
    triggers:
      - trigger: state
        entity_id: switch.asus_pc
        from: "off"
        to: "on"
    conditions:
      # Only if Sen is home
      - condition: state
        entity_id: person.sen
        state: "home"
    actions:
      - action: light.turn_on
        target:
          entity_id: light.gyver_lamp
        data:
          effect: "Oгoнь"
          brightness: 150
          rgb_color: [255, 39, 25]

  - id: kitchen_asus_pc_background_lights_off
    alias: Kitchen Asus PC Background Lights OFF
    description: Turns off the Gyver lamp when the Asus PC is switched off.
    triggers:
      - trigger: state
        entity_id: switch.asus_pc
        from: "on"
        to: "off"
    actions:
      - action: light.turn_off
        target:
          entity_id: light.gyver_lamp

  - id: kitchen_clock_disable_by_presence
    alias: Kitchen Clock Disable by Presence
    description: Turns off the 7-segment kitchen clock 1 minute after everyone has left, unless guest mode is on.
    triggers:
      - trigger: state
        entity_id: binary_sensor.people_home
        to: "off"
        for: 00:01:00
    conditions:
      - condition: state
        entity_id: input_boolean.guest_mode
        state: "off"
    actions:
      - action: light.turn_off
        target:
          entity_id: light.7_seg_clock

  - id: kitchen_clock_reenable
    alias: Kitchen Clock Reenable
    description: >-
      Turns the 7-segment kitchen clock back on after activity (kitchen motion, PC
      on, silent/night mode off) when someone is home, outside night mode, 05:00-22:00.
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.kitchen_motion_alarm
        to: "on"
      - trigger: state
        entity_id: switch.asus_pc
        to: "on"
      - trigger: state
        entity_id: input_boolean.silent_mode
        to: "off"
      - trigger: state
        entity_id: input_boolean.home_night_mode
        to: "off"
    conditions:
      - condition: state
        entity_id: light.7_seg_clock
        state: "off"
      - condition: state
        entity_id: binary_sensor.people_home
        state: "on"
      - condition: state
        entity_id: input_boolean.home_night_mode
        state: "off"
      - condition: time
        after: "05:00:00"
        before: "22:00:00"
    actions:
      - action: light.turn_on
        target:
          entity_id: light.7_seg_clock

  - id: shelf_lighting_reenable
    alias: Shelf Lighting Reenable
    description: >-
      Turns the shelf lighting back on after any activity (see anchored triggers)
      when Sen is home, outside night mode, 05:00-22:00.
    # Shared "any activity" triggers (anchor), reused by the other *_reenable automations; includes dusk (sun elevation < 4)
    triggers: &any_activity_trigger
      - trigger: state
        entity_id: switch.asus_pc
        to: "on"
      - trigger: state
        entity_id: input_boolean.silent_mode
        to: "off"
      - trigger: state
        entity_id: input_boolean.home_night_mode
        to: "off"
      - trigger: state
        entity_id: binary_sensor.people_home
        to: "on"
        for: "00:02:00"
      - trigger: state
        entity_id: person.sen
        to: "home"
        for: "00:02:00"
      - trigger: numeric_state
        entity_id: sun.sun
        attribute: elevation
        below: 4.0
    conditions:
      - condition: state
        entity_id: light.shelf_lighting
        state: "off"
      - condition: state
        entity_id: person.sen
        state: "home"
      - condition: state
        entity_id: input_boolean.home_night_mode
        state: "off"
      - condition: time
        after: "05:00:00"
        before: "22:00:00"
    actions:
      - action: light.turn_on
        target:
          entity_id: light.shelf_lighting

  - id: wireless_charger_reenable
    alias: Wireless Charger Reenable
    description: >-
      Turns the wireless charger back on after any activity when someone is home,
      outside night mode, 05:00-22:00.
    mode: restart
    triggers: *any_activity_trigger
    conditions:
      - condition: state
        entity_id: switch.wireless_charger
        state: "off"
      - condition: state
        entity_id: binary_sensor.people_home
        state: "on"
      - condition: state
        entity_id: input_boolean.home_night_mode
        state: "off"
      - condition: time
        after: "05:00:00"
        before: "22:00:00"
    actions:
      - action: switch.turn_on
        target:
          entity_id: switch.wireless_charger

  - id: interactive_cz_map_reenable
    alias: Interactive CZ Map Reenable
    description: >-
      Turns the Interactive CZ Map back on after any activity when Sen is home,
      outside night mode, 06:00-21:00.
    mode: restart
    triggers: *any_activity_trigger
    conditions:
      - condition: state
        entity_id: switch.interactive_cz_map_enable
        state: "off"
      - condition: state
        entity_id: person.sen
        state: "home"
      - condition: state
        entity_id: input_boolean.home_night_mode
        state: "off"
      - condition: time
        after: "06:00:00"
        before: "21:00:00"
    actions:
      - action: switch.turn_on
        target:
          entity_id: switch.interactive_cz_map_enable

  - id: banana_light_reenable
    alias: Banana Light Reenable
    description: >-
      Turns the banana light back on after any activity when Sen is home, outside
      night mode, 05:00-22:00.
    mode: restart
    triggers: *any_activity_trigger
    conditions:
      - condition: state
        entity_id: light.banana_light
        state: "off"
      - condition: state
        entity_id: person.sen
        state: "home"
      - condition: state
        entity_id: input_boolean.home_night_mode
        state: "off"
      - condition: time
        after: "05:00:00"
        before: "22:00:00"
    actions:
      - action: light.turn_on
        target:
          entity_id: light.banana_light

  - id: cocktail_bar_neon_sign_reenable
    alias: Cocktail Bar Neon Sign Reenable
    description: >-
      Turns the cocktail bar neon sign back on (brightness from ambient light) after
      any activity when Sen is home, outside night mode, 05:00-22:00.
    mode: restart
    triggers: *any_activity_trigger
    conditions:
      - condition: state
        entity_id: light.cocktail_bar_neon_sign
        state: "off"
      - condition: state
        entity_id: person.sen
        state: "home"
      - condition: state
        entity_id: input_boolean.home_night_mode
        state: "off"
      - condition: time
        after: "05:00:00"
        before: "22:00:00"
    actions:
      - action: light.turn_on
        target:
          entity_id: light.cocktail_bar_neon_sign
        data: *cocktail_bar_neon_sign_brightness

  - id: kitchen_christmas_lights_reenable
    alias: Kitchen Christmas Lights Reenable
    description: >-
      Turns the kitchen Christmas lights back on after any activity when someone is
      home, outside night mode, 05:00-22:00.
    mode: restart
    triggers: *any_activity_trigger
    conditions:
      - condition: state
        entity_id: light.kitchen_christmas_lights
        state: "off"
      - condition: state
        entity_id: binary_sensor.people_home
        state: "on"
      - condition: state
        entity_id: input_boolean.home_night_mode
        state: "off"
      - condition: time
        after: "05:00:00"
        before: "22:00:00"
    actions:
      - action: light.turn_on
        target:
          entity_id: light.kitchen_christmas_lights

  - id: disable_decorative_lights_when_sen_leaves
    alias: Disable Decorative Lights When Sen Leaves
    description: >-
      Turns off Sen's decorative lights (the same ones re-enabled by the *_reenable automations),
      the CZ map and railway track power once Sen has been away for 10 minutes.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: person.sen
        to: "not_home"
        for: 00:10:00
    actions:
      - action: light.turn_off
        target:
          entity_id:
            - light.banana_light
            - light.cocktail_bar_neon_sign
            - light.gyver_lamp
            - light.shelf_lighting
      - action: switch.turn_off
        target:
          entity_id:
            - switch.interactive_cz_map_enable
            - switch.ex_commandstation_tracks_power

  - id: parking_lights_on
    alias: Parking Lights ON
    description: Starts the parking light power-cycle script when the Parking Light button is pressed.
    mode: queued
    triggers:
      - trigger: state
        entity_id: input_button.parking_light
    actions:
      - action: script.turn_on
        target:
          entity_id: script.switch_on_parking_light

  # Send me notification if switch.parking_light is turned off for more than 1 hour and turn it ON
  - id: parking_light_emergency_on
    alias: Parking Light Emergency On
    description: >-
      If the parking light relay stays off for 1 hour, notifies and tries to turn it
      on (up to 5 attempts, alerting on failure); if it is unavailable for 1 hour,
      only notifies.
    mode: single
    triggers:
      - trigger: state
        entity_id: switch.parking_light
        to: "off"
        for: 1:00:00
      - trigger: state
        entity_id: switch.parking_light
        to: "unavailable"
        for: 1:00:00
        id: unavailable
    actions:
      # Unavailable relay can't be switched: just warn and stop
      - if: "{{ trigger.id == 'unavailable' }}"
        then:
          - action: script.notify
            data:
              level: warning
              persistent: false
              title: "🅿️ Парковка: реле не на связи"
              message: Больше часа
          - stop: Relay unavailable
      - action: script.notify
        data:
          level: info
          title: "🅿️ Парковка: свет включён снова"
          message: Был выключен больше часа
      # Give up after 5 attempts instead of retrying forever
      - repeat:
          until:
            - or:
                - condition: state
                  entity_id: switch.parking_light
                  state: "on"
                - "{{ repeat.index >= 5 }}"
          sequence:
            - action: switch.turn_on
              continue_on_error: true
              target:
                entity_id: switch.parking_light
            - wait_template: "{{ is_state('switch.parking_light', 'on') }}"
              timeout: "00:01:00"
      - if:
          - condition: not
            conditions:
              - condition: state
                entity_id: switch.parking_light
                state: "on"
        then:
          - action: script.notify
            data:
              level: warning
              persistent: false
              title: "🅿️ Парковка: реле не отвечает"
              message: Не включилось после 5 попыток

  - id: kitchen_led_strip_sync_with_spotlights
    alias: Kitchen LED Strip Sync with Spotlights
    description: Mirrors the kitchen spotlights' on/off state to the kitchen LED strip.
    triggers:
      - trigger: state
        entity_id: light.kitchen_spotlights
    conditions:
      # Ignore unavailable/unknown so the strip only follows real on/off
      - condition: template
        value_template: "{{ trigger.to_state.state in ['on', 'off'] }}"
    actions:
      # Templated action: light.turn_on or light.turn_off
      - action: light.turn_{{ trigger.to_state.state }}
        target:
          entity_id: light.kitchen_led_strip

  - id: activate_night_mode
    alias: Activate Night Mode
    description: Runs the Activate Night Mode script when the Activate Night Mode button is pressed.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: input_button.activate_night_mode
    actions:
      - action: script.turn_on
        target:
          entity_id: script.activate_night_mode

  ###############################################
  ## BUSY WALL SWITCHES
  ###############################################
  - id: busy_wall_switch_left
    alias: Busy Wall Switch Left
    description: Toggles the floor lamp whenever the left busy-wall switch is flipped either way.
    mode: restart
    triggers:
      # Both edges toggle, so the lever works regardless of its current position
      - trigger: state
        entity_id: binary_sensor.air_quality_station_digital_input_2
        from: "off"
        to: "on"
      - trigger: state
        entity_id: binary_sensor.air_quality_station_digital_input_2
        from: "on"
        to: "off"
    actions:
      - action: light.toggle
        target:
          entity_id: light.floor_lamp

  - id: busy_wall_switch_right
    alias: Busy Wall Switch Right
    description: Toggles the dollhouse lights whenever the right busy-wall switch is flipped either way, unless guest mode is on.
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.air_quality_station_digital_input_1
        from: "off"
        to: "on"
      - trigger: state
        entity_id: binary_sensor.air_quality_station_digital_input_1
        from: "on"
        to: "off"
    conditions:
      - condition: state
        entity_id: input_boolean.guest_mode
        state: "off"
    actions:
      - action: light.toggle
        target:
          entity_id: light.dollhouse_lights

###############################################
## SCENES
###############################################
scene:
  # Common welcome home scene for Sen and Kris
  - id: welcome_home
    name: Welcome Home
    entities:
      light.hall_edison_bulb:
        brightness: 255
        state: on
      light.7_seg_clock: on
      switch.wireless_charger: on

  # Welcome home scene for Sen with additional devices
  - id: welcome_home_sen
    name: Welcome Home Sen
    entities:
      light.banana_light: on
      light.cocktail_bar_neon_sign:
        brightness: 255
        state: on
      switch.wireless_charger: on
      switch.interactive_cz_map_enable: on

  - id: movies
    name: Movies
    entities:
      light.tv_lights: on
      light.floor_lamp: off
      light.gyver_lamp: off
      light.hall_lights: off
      light.kitchen_ceiling_light: off
      light.kitchen_led_strip: off
      light.kitchen_spotlights: off
      light.kitchen_christmas_lights: off
      light.christmas_tree: on
      light.shelf_lighting: off
      light.string_lights: off
      light.banana_light: off
      light.cocktail_bar_neon_sign:
        brightness: 10
        state: on
      media_player.samsung_tv: on
      switch.monolith_speakers: on
      switch.interactive_cz_map_enable: off

  - id: evening
    name: Evening
    entities:
      light.tv_lights: on
      light.bedroom_ceiling_light: off
      light.bedroom_nightlight: off
      light.gyver_lamp:
        brightness: 110
        state: on
      light.hall_lights: off
      light.kitchen_ceiling_light: off
      light.kitchen_led_strip: off
      light.kitchen_spotlights: on
      light.kitchen_christmas_lights: on
      light.christmas_tree: on
      light.mi_desk_lamp:
        brightness: 255
        color_temp_kelvin: 3000
        state: on
      light.pc_backlight: on
      light.shelf_lighting: on
      light.string_lights: on
      light.banana_light: on
      light.cocktail_bar_neon_sign:
        brightness: 3
        state: on
      switch.ex_commandstation_tracks_power: on
      switch.interactive_cz_map_enable: on
