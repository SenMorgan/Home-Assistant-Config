###############################################
## SETTINGS AND VARIABLES
###############################################
homeassistant:
  customize:
    package.node_anchors:
      sys_notify_title_info: &sys_notify_title_info "💬 Системное уведомление"
      sys_notify_title_warning: &sys_notify_title_warning "⚠️ Предупреждение"
      sys_notify_title_critical: &sys_notify_title_critical "🚨 Внимание!"

###############################################
## ALERTS
###############################################
alert:
  high_power:
    name: "High Power Consumption"
    entity_id: binary_sensor.high_power_consumption
    state: "on"
    repeat: 60
    notifiers:
      - mobile_app_sen_s25
      - persistent_notification
    title: *sys_notify_title_critical
    message: &high_power_message >
      Внимание! Превышение лимита потребления мощности. Текущий уровень: {{ states('sensor.electricity_meter_power') | int(0) }} Вт.

###############################################
## TEMPLATE ENTITIES
###############################################
template:
  - binary_sensor:
      - name: High Power Consumption
        unique_id: high_power_consumption
        state: "{{ states('sensor.electricity_meter_power') | int(0) > 6000 }}"  # Threshold set to 6kW

  - sensor:
      - name: Grid Consumed Today Cost
        unique_id: grid_consumed_today_cost
        unit_of_measurement: "Kč"
        device_class: monetary
        state_class: total
        # Tariff (updated 2026-11): fixed 231.43 Kč/month + 5.03 Kč/kWh, both without 21 % VAT
        # Daily fixed part = monthly fixed part / number of days in the current month
        # (days = last day of the month: day 28 + 4 days is always next month, its 1st minus 1 day)
        state: >
          {% set fixed_month = 231.43 %}
          {% set variable = 5.03 %}
          {% set vat = 0.21 %}
          {% set days = ((now().replace(day=28) + timedelta(days=4)).replace(day=1) - timedelta(days=1)).day %}
          {% set consumed = states('sensor.grid_consumed_today') | float(0.0) %}
          {{ ((fixed_month / days + variable * consumed) * (1 + vat)) | round(2, default=0) }}
      - name: Grid Consumed Month Cost
        unique_id: grid_consumed_month_cost
        unit_of_measurement: "Kč"
        device_class: monetary
        state_class: total
        # Tariff (updated 2026-11): fixed 231.43 Kč/month + 5.03 Kč/kWh, both without 21 % VAT
        state: >
          {% set fixed_month = 231.43 %}
          {% set variable = 5.03 %}
          {% set vat = 0.21 %}
          {% set consumed = states('sensor.grid_consumed_month') | float(0.0) %}
          {{ ((fixed_month + variable * consumed) * (1 + vat)) | round(2, default=0) }}

###############################################
# UTILITY METER (monthly accumulation)
###############################################
utility_meter:
  grid_consumed_month:
    name: Grid Consumed Month
    unique_id: grid_consumed_month
    # Count directly from the meter's lifetime total (never resets); chaining from the
    # daily meter inflated the monthly value after HA restarts
    source: sensor.electricity_meter_energy
    periodically_resetting: false
    cycle: monthly
  hollandis_charge_energy_added_month:
    name: Hollandis Charge Energy Added Month
    unique_id: hollandis_charge_energy_added_month
    source: sensor.hollandis_charge_energy_added
    cycle: monthly

###############################################
## SENSORS
###############################################
sensor:
  - platform: history_stats
    name: High Power Today
    unique_id: high_power_today
    entity_id: binary_sensor.high_power_consumption
    state: "on"
    type: time
    start: "{{ today_at('00:00:00') }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: High Power Month
    unique_id: high_power_month
    entity_id: binary_sensor.high_power_consumption
    state: "on"
    type: time
    start: "{{ today_at('00:00').replace(day=1) }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: High Power Previous Month
    unique_id: high_power_previous_month
    entity_id: binary_sensor.high_power_consumption
    state: "on"
    type: time
    start: "{{ (today_at('00:00').replace(day=1) - timedelta(days=1)).replace(day=1) }}"
    end: "{{ today_at('00:00').replace(day=1) }}"

##############################################
# AUTOMATIONS
##############################################
automation:
  - id: notify_high_power
    alias: Notify High Power Consumption
    description: >-
      Announces on Yandex Station Midi when total power stays above 6 kW for 1 minute.
      Spoken also in silent mode, but not in night mode (not critical enough to wake anyone);
      the phone push is always sent by alert.high_power.
    triggers:
      - trigger: state
        entity_id: binary_sensor.high_power_consumption
        to: "on"
        for:
          minutes: 1
    conditions:
      # Night mode: Alice speaks only about critical events (leak, gas, fire, ...)
      - condition: state
        entity_id: input_boolean.home_night_mode
        state: "off"
    actions:
      - action: media_player.play_media
        target:
          entity_id: media_player.yandex_station_midi
        data:
          # Reuses the alert message text via the YAML anchor
          media_content_id: *high_power_message
          media_content_type: text
