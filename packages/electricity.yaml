###############################################
## ALERTS
###############################################
alert:
  high_power:
    name: "High Power Consumption"
    entity_id: binary_sensor.high_power_consumption
    state: "on"
    repeat: 60
    notifiers:
      - mobile_app_sen_s25
      - persistent_notification
    title: "⚡ Перегрузка: {{ states('sensor.electricity_meter_power') | int(0) }} Вт"
    # Limit must match binary_sensor.high_power_consumption below
    message: Лимит 6000 Вт · срочно уменьшите потребление электроэнергии
    data:
      # No alarm melody; Alert to TTS Handler speaks the overload instead (user's choice 2026-11-18)
      channel: Тревоги
      importance: high
      priority: high
      ttl: 0

###############################################
## TEMPLATE ENTITIES
###############################################
template:
  - binary_sensor:
      - name: High Power Consumption
        unique_id: high_power_consumption
        state: "{{ states('sensor.electricity_meter_power') | int(0) > 6000 }}"  # Threshold set to 6kW

  # Power the Tesla takes from the home socket (13 A plug): charger voltage × current while it is charging at
  # home, else 0. Integrated into sensor.tesla_home_charging_energy below; the monthly total goes to the bills
  # sheet ("Car kWh") and the settlement forecast averages the last months. Tesla Fleet polls about once a
  # minute while charging, so the left Riemann sum holds each reading until the next one.
  - sensor:
      - name: Tesla Home Charging Power
        unique_id: tesla_home_charging_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        icon: mdi:ev-plug-type2
        state: >-
          {% if is_state('sensor.hollandis_charging', 'charging') and is_state('device_tracker.hollandis_location', 'home') %}
            {{ (states('sensor.hollandis_charger_voltage') | float(0) * states('sensor.hollandis_charger_current') | float(0)) | round(0) }}
          {% else %}0{% endif %}

  - sensor:
      - name: Grid Consumed Today Cost
        unique_id: grid_consumed_today_cost
        unit_of_measurement: "Kč"
        device_class: monetary
        state_class: total
        # Tariff (updated 2026-11): fixed 231.43 Kč/month + 5.03 Kč/kWh, both without 21 % VAT
        # Daily fixed part = monthly fixed part / number of days in the current month
        # (days = last day of the month: day 28 + 4 days is always next month, its 1st minus 1 day)
        state: >
          {% set fixed_month = 231.43 %}
          {% set variable = 5.03 %}
          {% set vat = 0.21 %}
          {% set days = ((now().replace(day=28) + timedelta(days=4)).replace(day=1) - timedelta(days=1)).day %}
          {% set consumed = states('sensor.grid_consumed_today') | float(0.0) %}
          {{ ((fixed_month / days + variable * consumed) * (1 + vat)) | round(2, default=0) }}
      - name: Grid Consumed Month Cost
        unique_id: grid_consumed_month_cost
        unit_of_measurement: "Kč"
        device_class: monetary
        state_class: total
        # Tariff (updated 2026-11): fixed 231.43 Kč/month + 5.03 Kč/kWh, both without 21 % VAT
        state: >
          {% set fixed_month = 231.43 %}
          {% set variable = 5.03 %}
          {% set vat = 0.21 %}
          {% set consumed = states('sensor.grid_consumed_month') | float(0.0) %}
          {{ ((fixed_month + variable * consumed) * (1 + vat)) | round(2, default=0) }}

###############################################
# UTILITY METER (monthly accumulation)
###############################################
utility_meter:
  grid_consumed_month:
    name: Grid Consumed Month
    unique_id: grid_consumed_month
    # Count directly from the meter's lifetime total (never resets); chaining from the
    # daily meter inflated the monthly value after HA restarts
    source: sensor.electricity_meter_energy
    periodically_resetting: false
    cycle: monthly
  # Home charging of the Tesla this month (kWh from the socket); last_period = the previous month
  tesla_home_charging_month:
    name: Tesla Home Charging Month
    unique_id: tesla_home_charging_month
    source: sensor.tesla_home_charging_energy
    periodically_resetting: false
    cycle: monthly
  hollandis_charge_energy_added_month:
    name: Hollandis Charge Energy Added Month
    unique_id: hollandis_charge_energy_added_month
    source: sensor.hollandis_charge_energy_added
    cycle: monthly

###############################################
## SENSORS
###############################################
sensor:
  # Energy taken by the Tesla from the home socket (left Riemann sum of the charging power)
  - platform: integration
    name: Tesla Home Charging Energy
    unique_id: tesla_home_charging_energy
    source: sensor.tesla_home_charging_power
    method: left
    unit_prefix: k
    unit_time: h
    round: 3
    # Keep the total growing every 5 min while the power stays the same between polls (it drops to 0 as soon
    # as the charging state changes, so a held value cannot run on after charging)
    max_sub_interval:
      minutes: 5
  - platform: history_stats
    name: High Power Today
    unique_id: high_power_today
    entity_id: binary_sensor.high_power_consumption
    state: "on"
    type: time
    start: "{{ today_at('00:00:00') }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: High Power Month
    unique_id: high_power_month
    entity_id: binary_sensor.high_power_consumption
    state: "on"
    type: time
    start: "{{ today_at('00:00').replace(day=1) }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: High Power Previous Month
    unique_id: high_power_previous_month
    entity_id: binary_sensor.high_power_consumption
    state: "on"
    type: time
    start: "{{ (today_at('00:00').replace(day=1) - timedelta(days=1)).replace(day=1) }}"
    end: "{{ today_at('00:00').replace(day=1) }}"

##############################################
# AUTOMATIONS
##############################################
automation:
  - id: notify_high_power
    alias: Notify High Power Consumption
    description: >-
      Announces on Yandex Station Midi when total power stays above 6 kW for 1 minute.
      Spoken also in silent mode, but not in night mode (not critical enough to wake anyone);
      the phone push is always sent by alert.high_power.
    triggers:
      - trigger: state
        entity_id: binary_sensor.high_power_consumption
        to: "on"
        for:
          minutes: 1
    conditions:
      # Night mode: Alice speaks only about critical events (leak, gas, fire, ...)
      - condition: state
        entity_id: input_boolean.home_night_mode
        state: "off"
    actions:
      - action: media_player.play_media
        target:
          entity_id: media_player.yandex_station_midi
        data:
          media_content_id: >-
            {% from 'alice.jinja' import voice %}{{ voice() }}
            Внимание! Слишком большая нагрузка: {{ states('sensor.electricity_meter_power') | int(0) }} ватт.
            Срочно уменьшите потребление квартиры.
          media_content_type: text
