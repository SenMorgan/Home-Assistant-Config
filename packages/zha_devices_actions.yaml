###############################################
## INPUT BOOLEANS
###############################################
input_boolean:
  cube_1_control:
    name: Cube Control
    icon: mdi:gesture-double-tap

###############################################
## AUTOMATIONS
###############################################
automation:
  ###############################################
  ## Aqara Bedroom Switch
  ###############################################
  - id: aqara_bedroom_switch_handler
    alias: Aqara Bedroom Switch Handler
    description: >-
      Bedroom Aqara button: single press activates night mode; double press toggles the bedroom
      nightlight (only turns it on when night mode is off); hold "wakes up" the bedroom - unlocks
      the lights/cover safety switch, opens the cover, runs day mode and turns the floor lamp on at 50%.
    mode: restart
    triggers:
      - trigger: event
        event_type: zha_event
        event_data:
          # Aqara Switch 1
          device_id: "6559eaaf60c9624465f762290ff9e825"
    actions:
      - variables:
          command: "{{ trigger.event.data.command }}"
      - choose:
          - conditions:
              - "{{ command == 'single' }}"
            sequence:
              - action: script.activate_night_mode
          - conditions:
              - "{{ command == 'double' }}"
            sequence:
              # Turn on only if night mode is off and the light is off; otherwise turn it off
              - if:
                  - condition: state
                    entity_id: input_boolean.home_night_mode
                    state: "off"
                  - condition: state
                    entity_id: light.bedroom_nightlight
                    state: "off"
                then:
                  - action: light.turn_on
                    target:
                      entity_id: light.bedroom_nightlight
                    data:
                      brightness: 255
                else:
                  - action: light.turn_off
                    target:
                      entity_id: light.bedroom_nightlight
          - conditions:
              - "{{ command == 'hold' }}"
            sequence:
              # Allow to turn on bedroom lights and open cover
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.bedroom_lights_and_cover_safety_switch
              # Open cover
              - action: cover.open_cover
                target:
                  entity_id: cover.bedroom
              # Activate day mode script
              - action: script.home_day_mode
              # Switch on floor lamp with half brightness
              - action: light.turn_on
                target:
                  entity_id: light.floor_lamp
                data:
                  brightness: 128
        default: []

  ###############################################
  ## Aqara Cube Automations
  ###############################################
  - id: aqara_cube_1_handler
    alias: Aqara Cube 1 Handler
    description: >-
      Aqara cube gestures (only while input_boolean.cube_1_control is on): flip 90° toggles string
      lights, flip 180° toggles the floor lamp, shake turns off all lights, tap activates the movies
      scene, slide turns on the Gyver lamp and PC backlight, rotate adjusts floor lamp brightness.
    mode: restart
    max_exceeded: silent
    triggers:
      - trigger: event
        event_type: zha_event
        event_data:
          # Aqara Cube 1
          device_id: "48fad66663fc601ed1a63ac01e804fab"
    actions:
      - if:
          - condition: state
            entity_id: input_boolean.cube_1_control
            state: "on"
        then:
          # Not every cube event carries flip/rotation args; default them to 0
          - variables:
              command: "{{ trigger.event.data.command }}"
              flip_degrees: "{{ trigger.event.data.args.flip_degrees if trigger.event.data.args.flip_degrees is defined else 0 }}"
              relative_degrees: "{{ trigger.event.data.args.relative_degrees if trigger.event.data.args.relative_degrees is defined else 0 }}"
          - choose:
              - conditions:
                  - "{{ flip_degrees == 90 }}"
                sequence:
                  - action: light.toggle
                    target:
                      entity_id: light.string_lights
              - conditions:
                  - "{{ flip_degrees == 180 }}"
                sequence:
                  - action: light.toggle
                    target:
                      entity_id: light.floor_lamp
              - conditions:
                  - "{{ command == 'shake' }}"
                sequence:
                  - action: script.turn_on
                    target:
                      entity_id: script.turn_off_all_lights
              - conditions:
                  - "{{ command == 'tap' }}"
                sequence:
                  - action: scene.turn_on
                    target:
                      entity_id: scene.movies
              - conditions:
                  - "{{ command == 'slide' }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id:
                        - light.gyver_lamp
                        - light.pc_backlight
              # Rotation angle (negative for left) is added directly to the current brightness
              - conditions:
                  - "{{ command == 'rotate_left' or command == 'rotate_right' }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: light.floor_lamp
                    data:
                      # Clamp to the valid 1..255 range
                      brightness: >-
                        {{ [[state_attr('light.floor_lamp', 'brightness') | int(0) + relative_degrees | int(0), 1] | max, 255] | min }}

  ###############################################
  ## Hall Lights Control with Tradfri Switch
  ###############################################
  - id: hall_lights_control_with_tradfri_switch_handler
    alias: Hall Lights Control with Tradfri Switch Handler
    description: >-
      Hall Remote (IKEA Tradfri on/off switch above the 3D printer). Short UP steps the light up (Edison bulb dimmed at night
      or full, then full, then main hall lights); short DOWN steps down in reverse (at night a full
      bulb is dimmed first). Hold UP / hold DOWN turns all hall-area lights on / off.
    mode: restart
    max_exceeded: silent
    # Keep more runs for diagnosing missed/late presses (default is 5)
    trace:
      stored_traces: 30
    triggers:
      - trigger: event
        event_type: zha_event
        event_data:
          # Hall Remote (IKEA Tradfri on/off switch above the 3D printer)
          device_id: "a64c98fa9b0c36e96ebe42160fcf78b5"
    conditions:
      # The remote also emits an 'attribute_updated' event with each DOWN press, at the same moment.
      # Without this filter that no-op event starts a run too, and mode: restart can cancel the real
      # 'off' run if the events arrive in the other order. Conditions run before the restart.
      - condition: template
        value_template: "{{ trigger.event.data.command in ['on', 'off', 'move_with_on_off', 'move'] }}"
    actions:
      - variables:
          command: "{{ trigger.event.data.command }}"
          hall_edison_bulb_on: "{{ is_state('light.hall_edison_bulb', 'on') }}"
          hall_lights_on: "{{ is_state('light.hall_lights', 'on') }}"
          hall_edison_brightness: "{{ state_attr('light.hall_edison_bulb', 'brightness') | int(0) }}"
          # Night hours (21:00-05:00): prefer dimmed Edison bulb instead of full brightness
          dim_lights: "{{ now().hour >= 21 or now().hour < 5 }}"
          no_hall_lights_on: "{{ not hall_edison_bulb_on and not hall_lights_on }}"
          # Philips Hue bulbs report 254 after being set to 255, so treat 254 and above as full
          hall_edison_not_full: "{{ hall_edison_bulb_on and hall_edison_brightness < 254 }}"
          hall_edison_full: "{{ hall_edison_bulb_on and hall_edison_brightness >= 254 }}"
          hall_lights_only_on: "{{ hall_lights_on and not hall_edison_bulb_on }}"
          both_hall_lights_on: "{{ hall_lights_on and hall_edison_bulb_on }}"
      - choose:
          - conditions:
              - "{{ command == 'on' }}" # Single press UP
            sequence:
              # Step up: off -> Edison (50% at night, else full) -> Edison full -> + main hall lights
              - choose:
                  - conditions:
                      - "{{ no_hall_lights_on and dim_lights }}"
                    sequence:
                      - action: light.turn_on
                        target:
                          entity_id: light.hall_edison_bulb
                        data:
                          brightness: 128
                  - conditions:
                      - "{{ no_hall_lights_on and not dim_lights }}"
                    sequence:
                      - action: light.turn_on
                        target:
                          entity_id: light.hall_edison_bulb
                        data:
                          brightness: 255
                  - conditions:
                      - "{{ hall_edison_not_full }}"
                    sequence:
                      - action: light.turn_on
                        target:
                          entity_id: light.hall_edison_bulb
                        data:
                          brightness: 255
                  - conditions:
                      - "{{ hall_edison_full and not hall_lights_on }}"
                    sequence:
                      - action: light.turn_on
                        target:
                          entity_id: light.hall_lights
                  - conditions:
                      - "{{ hall_lights_only_on }}"
                    sequence:
                      - action: light.turn_on
                        target:
                          entity_id: light.hall_edison_bulb
                        data:
                          brightness: 255
          - conditions:
              - "{{ command == 'off' }}" # Single press DOWN
            sequence:
              # Step down: main hall lights off first, then Edison (dimmed to 50% at night before off)
              - choose:
                  - conditions:
                      - "{{ hall_lights_on }}"
                    sequence:
                      - action: light.turn_off
                        target:
                          entity_id: light.hall_lights
                  - conditions:
                      - "{{ hall_edison_full and dim_lights }}"
                    sequence:
                      - action: light.turn_on
                        target:
                          entity_id: light.hall_edison_bulb
                        data:
                          brightness: 128
                  - conditions:
                      - "{{ hall_edison_full and not dim_lights }}"
                    sequence:
                      - action: light.turn_off
                        target:
                          entity_id: light.hall_edison_bulb
                  - conditions:
                      - "{{ hall_edison_not_full }}"
                    sequence:
                      - action: light.turn_off
                        target:
                          entity_id: light.hall_edison_bulb
          - conditions:
              - "{{ command == 'move_with_on_off' }}" # Hold UP
            sequence:
              - action: light.turn_on
                target:
                  area_id: hall
          - conditions:
              - "{{ command == 'move' }}" # Hold DOWN
            sequence:
              - action: light.turn_off
                target:
                  area_id: hall

  ###############################################
  ## Ikea RODRET Dimmer
  ###############################################
  - id: rodret_dimmer_1_handler
    alias: Rodret Dimmer 1 Handler
    description: >-
      IKEA RODRET dimmer (via blueprint): ON turns on the Monolith speakers, desk lamp, TV lights and
      Christmas tree; OFF turns off the speakers and all living room lights; holding ON/OFF dims the
      desk lamp up/down in 4% steps.
    use_blueprint:
      path: damru/ikea-rodret_E2201_ZHA-Z2M_control-anything.yaml
      input:
        remote_device: 51724530dc1fcac3561d2fcb39f40048
        on_press_action:
          - action: switch.turn_on
            entity_id: switch.monolith_speakers
          - action: light.turn_on
            entity_id:
              - light.mi_desk_lamp
              - light.tv_lights
              - light.christmas_tree
        off_press_action:
          - action: switch.turn_off
            entity_id: switch.monolith_speakers
          - action: light.turn_off
            target:
              area_id: living_room
        on_hold_action:
          - action: light.turn_on
            entity_id: light.mi_desk_lamp
            data:
              brightness_step_pct: 4
        off_hold_action:
          - action: light.turn_on
            entity_id: light.mi_desk_lamp
            data:
              brightness_step_pct: -4
        helper_hold_delay: 200
        helper_max_loops: 20
