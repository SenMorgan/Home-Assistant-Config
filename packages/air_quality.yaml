###############################################
## INPUT DATETIMEs
###############################################
input_datetime:
  # Deadline until which opening a window is praised (set to now + 2 min on bad air)
  air_quality_open_window_greeting_timeout:
    name: "Air Quality Open Window Greeting Timeout"
    has_date: true
    has_time: true

###############################################
## AUTOMATIONS
###############################################
automation:
  - id: notification_air_quality_bad
    alias: Notification Air Quality Bad
    description: >-
      When IAQ stays above 200 for 2 minutes (not at night), Yandex Station Midi suggests opening
      (or closing the named open) windows and a phone notification is sent. Then this automation
      disables itself and arms the "restored" and "open window greeting" automations.
    triggers:
      - trigger: numeric_state
        entity_id: sensor.air_quality_station_iaq
        above: 200
        for: 00:02:00
    conditions:
      - condition: state
        entity_id: input_boolean.home_night_mode
        state: "off"
    actions:
      # Check if yandex station is not playing now
      - if:
          - condition: template
            value_template: "{{ not is_state('media_player.yandex_station_midi', 'playing') }}"
        then:
          - action: media_player.play_media
            target:
              entity_id: media_player.yandex_station_midi
            data:
              # Open windows -> the outside air is the problem: name the rooms (area names -> Russian);
              # otherwise ask to open a window
              media_content_type: text
              media_content_id: >-
                {% from 'ru.jinja' import room_in %}
                {% if is_state('binary_sensor.windows', 'off') %}
                  Воздух в квартире несвежий, откройте окно.
                {% else %}
                  {% set ns = namespace(r=[]) %}
                  {% for e in expand('binary_sensor.windows') | selectattr('state', 'eq', 'on') %}
                    {% set ns.r = ns.r + [room_in(area_name(e.entity_id))] %}
                  {% endfor %}
                  Качество воздуха ухудшается при открытых окнах. Закройте {{ 'окна' if ns.r | count > 1 else 'окно' }} {{ (ns.r[:-1] | join(', ') ~ ' и ' ~ ns.r[-1]) if ns.r | count > 1 else ns.r | join('') }}.
                {% endif %}
      - action: script.notify
        data:
          level: info
          title: "🌬️ Душно: IAQ {{ states('sensor.air_quality_station_iaq') | float(0) | round(0) | int }}"
          message: >-
            {% from 'ru.jinja' import room_ru %}
            CO₂ {{ states('sensor.air_quality_station_co2') | float(0) | round(0) | int }} ppm ·
            {% if is_state('binary_sensor.windows', 'off') %}откройте окно{% else %}
            {%- set ns = namespace(r=[]) %}
            {%- for e in expand('binary_sensor.windows') | selectattr('state', 'eq', 'on') %}
              {%- set ns.r = ns.r + [room_ru(area_name(e.entity_id))] %}
            {%- endfor %}закройте окно: {{ ns.r | join(', ') }}{% endif %}
      - action: automation.turn_on
        target:
          entity_id:
            - automation.notification_air_quality_restored
            - automation.notification_air_quality_open_window_greeting
      # Set timeout for open window greeting notification
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.air_quality_open_window_greeting_timeout
        data:
          datetime: "{{ now() + timedelta(minutes=2) }}"
      # Disable bad air quality notification till it will be restored
      - action: automation.turn_off
        target:
          entity_id: automation.notification_air_quality_bad

  - id: notification_air_quality_open_window_greeting
    alias: Notification Air Quality Open Window Greeting
    description: >-
      Praises the user via Yandex Station Midi if a window is opened within 2 minutes after the
      bad air announcement. Disables itself after the first window opening either way.
    triggers:
      - trigger: state
        entity_id: binary_sensor.windows
        from: "off"
        to: "on"
    conditions:
      - condition: state
        entity_id: input_boolean.home_night_mode
        state: "off"
    actions:
      - if:
          # Check if timeout for open window greeting notification has not expired
          - condition: template
            value_template: "{{ as_timestamp(now()) < as_timestamp(states('input_datetime.air_quality_open_window_greeting_timeout'), 0) }}"
          # Check if yandex station is not playing now
          - condition: template
            value_template: "{{ not is_state('media_player.yandex_station_midi', 'playing') }}"
        then:
          - action: media_player.play_media
            target:
              entity_id: media_player.yandex_station_midi
            data:
              media_content_type: text
              media_content_id: Молодец! Рада, что вы заботитесь о своём здоровье.
      - action: automation.turn_off
        target:
          entity_id: automation.notification_air_quality_open_window_greeting

  - id: notification_air_quality_restored
    alias: Notification Air Quality Restored
    description: >-
      When IAQ stays below 100 for 10 minutes, re-arms the bad air notification and disables itself
      and the window greeting. The "back to normal" announcement and push are skipped at night,
      but the re-arm always happens (previously a night-time or 50-100 recovery left the bad air
      notification disabled for days).
    triggers:
      # Hysteresis: bad above 200, good again below 100 (IAQ 51-100 is "good" on the BME680 scale)
      - trigger: numeric_state
        entity_id: sensor.air_quality_station_iaq
        below: 100
        for: 00:10:00
    actions:
      # Announce only outside night mode and when the station is not playing
      - if:
          - condition: state
            entity_id: input_boolean.home_night_mode
            state: "off"
        then:
          - if:
              - condition: template
                value_template: "{{ not is_state('media_player.yandex_station_midi', 'playing') }}"
            then:
              - action: media_player.play_media
                target:
                  entity_id: media_player.yandex_station_midi
                data:
                  media_content_type: text
                  media_content_id: >-
                    {{ 'Воздух свежий, окно можно закрыть.' if is_state('binary_sensor.windows', 'on')
                       else 'Воздух в квартире снова свежий.' }}
          - action: script.notify
            data:
              level: info
              title: "🌿 Воздух в норме: IAQ {{ states('sensor.air_quality_station_iaq') | float(0) | round(0) | int }}"
              message: >-
                CO₂ {{ states('sensor.air_quality_station_co2') | float(0) | round(0) | int }} ppm
                {%- if is_state('binary_sensor.windows', 'on') %} · можно закрыть окно{% endif %}
      - action: automation.turn_on
        target:
          entity_id: automation.notification_air_quality_bad
      - action: automation.turn_off
        target:
          entity_id:
            - automation.notification_air_quality_restored
            - automation.notification_air_quality_open_window_greeting
