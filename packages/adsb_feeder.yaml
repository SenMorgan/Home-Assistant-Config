###############################################
## SENSORS
###############################################
sensor:
  - platform: rest
    name: FR24 Feeder
    resource: http://127.0.0.1:8754/monitor.json
    value_template: "{{ value_json.feed_alias }}"
    method: GET
    scan_interval: 60
    json_attributes:
      - rx_connected
      - feed_status
      - feed_num_ac_tracked
      - build_version
      - feed_alias
  - platform: rest
    name: FR24 Aircraft
    resource: http://127.0.0.1:8080/data/aircraft.json
    value_template: "{{ value_json.messages }}"
    method: GET
    scan_interval: 15
    json_attributes:
      - now
      - aircraft

###############################################
## TEMPLATE ENTITIES
###############################################
template:
  - binary_sensor:
      - name: FR24 Feeder Receiver Connected
        device_class: connectivity
        state: "{{ is_state_attr('sensor.fr24_feeder', 'rx_connected', '1') }}"
      - name: FR24 Feeder Link Connected
        device_class: connectivity
        state: "{{ is_state_attr('sensor.fr24_feeder', 'feed_status', 'connected') }}"

  - sensor:
      - name: FR24 Feeder Aircraft Tracked
        unit_of_measurement: "aircrafts"
        icon: mdi:airplane
        state: "{{ state_attr('sensor.fr24_feeder', 'feed_num_ac_tracked') | round(0, default=none) }}"

###############################################
## AUTOMATIONS
###############################################
automation:
  - id: notification_ads_b_receiver_disconnected
    alias: Notification ADS-B Receiver Disconnected
    description: >-
      Notifies when the FR24 feeder has lost its ADS-B receiver for 5 minutes.
    triggers:
      - trigger: state
        entity_id: binary_sensor.fr24_feeder_receiver_connected
        from: "on"
        to: "off"
        for: "00:05:00"
    actions:
      # Silent status (tag adsb, replaced by the "restored" push); time of the actual disconnect
      - action: script.notify
        data:
          level: status
          tag: adsb
          title: "📡 ADS-B: нет связи"
          message: С {{ trigger.to_state.last_changed | as_local | as_timestamp | timestamp_custom('%H:%M') }}
          when: "{{ as_timestamp(trigger.to_state.last_changed) | int }}"

  - id: notification_ads_b_receiver_connection_restored
    alias: Notification ADS-B Receiver Connection Restored
    description: >-
      Notifies once the receiver has been back for 1 minute after a disconnect that lasted at least
      5 minutes (the disconnect notification was sent). Stateless: no self-enabling (audit AR-01).
    triggers:
      - trigger: state
        entity_id: binary_sensor.fr24_feeder_receiver_connected
        from: "off"
        to: "on"
        for: "00:01:00"
    conditions:
      # Same threshold as the disconnect notification: shorter dropouts were never reported
      - condition: template
        value_template: >-
          {{ as_timestamp(trigger.to_state.last_changed) - as_timestamp(trigger.from_state.last_changed) >= 300 }}
    actions:
      - action: script.notify
        data:
          level: status
          tag: adsb
          title: 📡 ADS-B снова на связи
          message: >-
            {% from 'ru.jinja' import duration_short %}
            Связи не было {{ duration_short(((as_timestamp(trigger.to_state.last_changed) - as_timestamp(trigger.from_state.last_changed)) / 60) | round(0) | int) }}
