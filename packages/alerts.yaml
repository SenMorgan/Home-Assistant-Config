###############################################
## GROUPS
###############################################
group:
  # Sensors whose silent failure would hide a real emergency (AR-03); checked by
  # binary_sensor.safety_sensors_offline. Add new leak/gas/door/window sensors here.
  safety_sensors:
    name: Safety Sensors
    entities:
      - binary_sensor.water_leakage_bathroom_moisture
      - binary_sensor.water_leakage_kitchen_moisture
      - binary_sensor.co_and_natural_gas_alarm_carbon_monoxide
      - binary_sensor.co_and_natural_gas_alarm_gas
      - binary_sensor.hall_door_contact
      - binary_sensor.bedroom_door_contact
      - binary_sensor.wc_door_contact
      - binary_sensor.bedroom_window_contact
      - binary_sensor.kitchen_window_contact
      - binary_sensor.living_room_window_contact
      - sensor.ups_status_data

###############################################
## TEMPLATE ENTITIES
###############################################
template:
  - binary_sensor:
      # On when any safety sensor has been unavailable/unknown for over 1 hour
      # (the delay ignores restarts and short Zigbee/Wi-Fi dropouts).
      # Note: catches only sensors that go unavailable; a Wi-Fi device that silently stops
      # pushing (Tuya gas detector) keeps its last state and is not detected here.
      - name: Safety Sensors Offline
        unique_id: safety_sensors_offline
        device_class: problem
        delay_on: "01:00:00"
        state: >-
          {{ expand('group.safety_sensors')
             | selectattr('state', 'in', ['unavailable', 'unknown']) | list | count > 0 }}
        attributes:
          # Friendly names of the offline sensors, for the alert message
          offline: >-
            {{ expand('group.safety_sensors')
               | selectattr('state', 'in', ['unavailable', 'unknown'])
               | map(attribute='name') | join(', ') }}

###############################################
## Alerts
###############################################
alert:
  # Maintenance alert (push only, never spoken: see night-mode rule)
  safety_sensors_offline:
    name: "Safety Sensors Offline"
    entity_id: binary_sensor.safety_sensors_offline
    state: "on"
    repeat: 720
    notifiers:
      - mobile_app_sen_s25
      - persistent_notification
    # Same title for the done message, so it is templated on the sensor state
    title: >-
      {{ '📴 Датчики безопасности не на связи' if is_state('binary_sensor.safety_sensors_offline', 'on')
         else '📶 Датчики безопасности на связи' }}
    message: >-
      Больше часа: {{ state_attr('binary_sensor.safety_sensors_offline', 'offline') }}
    done_message: Все датчики безопасности снова передают данные
    data:
      channel: Предупреждения
      importance: high
      priority: high
      ttl: 0

  water_leakage_bathroom:
    name: "Water Leakage in Bathroom"
    entity_id: binary_sensor.water_leakage_bathroom_moisture
    state: "on"
    # Repeat intervals in minutes (the last one repeats); the first notification is sent
    # after 1 minute (skip_first), so short false triggers are ignored
    repeat: [1, 1, 2, 10, 30, 60]
    skip_first: true
    notifiers:
      - mobile_app_sen_s25
      - mobile_app_sm_s931b
    # Every alert and its recovery are separate pushes (no tag): the history must stay visible.
    # Recovery is phrased as a sensor observation, not as "problem solved".
    title: >-
      {{ '💧 Протечка: ванная' if is_state('binary_sensor.water_leakage_bathroom_moisture', 'on')
         else '💧 Ванная: датчик сухой' }}
    message: Датчик в ванной зафиксировал воду на полу · проверьте немедленно
    done_message: Датчик в ванной больше не фиксирует воду · проверьте визуально
    data:
      ttl: 0
      priority: high
      channel: alarm_stream

  water_leakage_kitchen:
    name: "Water Leakage in Kitchen"
    entity_id: binary_sensor.water_leakage_kitchen_moisture
    state: "on"
    repeat: [1, 1, 2, 10, 30, 60]
    skip_first: true
    notifiers:
      - mobile_app_sen_s25
      - mobile_app_sm_s931b
    # Every alert and its recovery are separate pushes (no tag): the history must stay visible.
    # Recovery is phrased as a sensor observation, not as "problem solved".
    title: >-
      {{ '💧 Протечка: кухня' if is_state('binary_sensor.water_leakage_kitchen_moisture', 'on')
         else '💧 Кухня: датчик сухой' }}
    message: Датчик на кухне зафиксировал воду на полу · проверьте немедленно
    done_message: Датчик на кухне больше не фиксирует воду · проверьте визуально
    data:
      ttl: 0
      priority: high
      channel: alarm_stream

  carbon_monoxide_detected:
    name: "Carbon Monoxide Detected"
    entity_id: binary_sensor.co_and_natural_gas_alarm_carbon_monoxide
    state: "on"
    repeat: 1
    notifiers:
      - mobile_app_sen_s25
      - mobile_app_sm_s931b
    title: >-
      {{ '☠️ Угарный газ: кухня' if is_state('binary_sensor.co_and_natural_gas_alarm_carbon_monoxide', 'on')
         else '☠️ Кухня: CO в норме' }}
    message: >-
      {{ states('sensor.co_and_natural_gas_alarm_carbon_monoxide') }} ppm · проветрите и выйдите из помещения
    done_message: >-
      {{ states('sensor.co_and_natural_gas_alarm_carbon_monoxide') }} ppm по данным датчика
    data:
      ttl: 0
      priority: high
      channel: alarm_stream

  natural_gas_detected:
    name: "Natural Gas Detected"
    entity_id: binary_sensor.co_and_natural_gas_alarm_gas
    state: "on"
    repeat: 1
    notifiers:
      - mobile_app_sen_s25
      - mobile_app_sm_s931b
    title: >-
      {{ '🔥 Утечка газа: кухня' if is_state('binary_sensor.co_and_natural_gas_alarm_gas', 'on')
         else '🔥 Кухня: концентрация газа в норме' }}
    message: >-
      {{ states('sensor.co_and_natural_gas_alarm_gas') }} ppm · перекройте газ, не включайте электроприборы, проветрите
    done_message: >-
      {{ states('sensor.co_and_natural_gas_alarm_gas') }} ppm по данным датчика
    data:
      ttl: 0
      priority: high
      channel: alarm_stream


###############################################
## Automations
###############################################
automation:
  - id: alert_to_tts_handler
    # Queued: simultaneous alerts must each be announced
    alias: Alert to TTS Handler
    description: >-
      Speaks a TTS announcement on Yandex Station Midi and on both phones (alarm stream, max volume)
      when a leak or gas alert starts or is resolved. Critical, so it ignores night/silent mode.
    mode: queued
    max: 5
    variables:
      # alert entity -> [text when it fires, text when it is resolved]
      alerts_map:
        alert.water_leakage_bathroom:
          - "Внимание! Протечка воды в ванной!"
          - "Датчик протечки в ванной больше не фиксирует воду."
        alert.water_leakage_kitchen:
          - "Внимание! Протечка воды на кухне!"
          - "Датчик протечки на кухне больше не фиксирует воду."
        alert.carbon_monoxide_detected:
          - "Внимание! Угарный газ на кухне! Проветрите и выйдите из помещения."
          - "Уровень угарного газа на кухне вернулся в норму."
        alert.natural_gas_detected:
          - "Внимание! Утечка газа на кухне! Перекройте газ и проветрите."
          - "Датчик газа на кухне больше не фиксирует утечку."
    triggers:
      - trigger: state
        entity_id:
          - alert.water_leakage_bathroom
          - alert.water_leakage_kitchen
          - alert.carbon_monoxide_detected
          - alert.natural_gas_detected
    actions:
      - if:
            # Notify only if the alert is true or false, ignoring "acknowledge" state
          - condition: template
            value_template: "{{ trigger.to_state.state in ['on', 'idle'] }}"
        then:
          - variables:
              phrase: "{{ alerts_map[trigger.entity_id][0 if trigger.to_state.state == 'on' else 1] }}"
          # Critical: the speaker talks even in night/silent mode
          - action: media_player.play_media
            continue_on_error: true
            target:
              entity_id: media_player.yandex_station_midi
            data:
              media_content_id: "{{ phrase }}"
              media_content_type: text
          - action: notify.mobile_app_sen_s25
            continue_on_error: true
            data:
              message: TTS
              data:
                priority: high
                channel: alarm_stream_max
                media_stream: "alarm_stream_max"
                tts_text: "{{ phrase }}"
          - action: notify.mobile_app_sm_s931b
            continue_on_error: true
            data:
              message: TTS
              data:
                priority: high
                channel: alarm_stream_max
                media_stream: "alarm_stream_max"
                tts_text: "{{ phrase }}"
