###############################################
## SETTINGS AND VARIABLES
###############################################
homeassistant:
  customize:
    package.node_anchors:
      sys_notify_title_info: &sys_notify_title_info "💬 Системное уведомление"
      sys_notify_title_resolved: &sys_notify_title_resolved "✅ Проблема устранена"
      sys_notify_title_warning: &sys_notify_title_warning "⚠️ Предупреждение"
      sys_notify_title_critical: &sys_notify_title_critical "🚨 Внимание!"

###############################################
## GROUPS
###############################################
group:
  # Sensors whose silent failure would hide a real emergency (AR-03); checked by
  # binary_sensor.safety_sensors_offline. Add new leak/gas/door/window sensors here.
  safety_sensors:
    name: Safety Sensors
    entities:
      - binary_sensor.water_leakage_bathroom_moisture
      - binary_sensor.water_leakage_kitchen_moisture
      - binary_sensor.co_and_natural_gas_alarm_carbon_monoxide
      - binary_sensor.co_and_natural_gas_alarm_gas
      - binary_sensor.hall_door_contact
      - binary_sensor.bedroom_door_contact
      - binary_sensor.wc_door_contact
      - binary_sensor.bedroom_window_contact
      - binary_sensor.kitchen_window_contact
      - binary_sensor.living_room_window_contact
      - sensor.ups_status_data

###############################################
## TEMPLATE ENTITIES
###############################################
template:
  - binary_sensor:
      # On when any safety sensor has been unavailable/unknown for over 1 hour
      # (the delay ignores restarts and short Zigbee/Wi-Fi dropouts).
      # Note: catches only sensors that go unavailable; a Wi-Fi device that silently stops
      # pushing (Tuya gas detector) keeps its last state and is not detected here.
      - name: Safety Sensors Offline
        unique_id: safety_sensors_offline
        device_class: problem
        delay_on: "01:00:00"
        state: >-
          {{ expand('group.safety_sensors')
             | selectattr('state', 'in', ['unavailable', 'unknown']) | list | count > 0 }}
        attributes:
          # Friendly names of the offline sensors, for the alert message
          offline: >-
            {{ expand('group.safety_sensors')
               | selectattr('state', 'in', ['unavailable', 'unknown'])
               | map(attribute='name') | join(', ') }}

###############################################
## Alerts
###############################################
alert:
  # Maintenance alert (push only, never spoken: see night-mode rule)
  safety_sensors_offline:
    name: "Safety Sensors Offline"
    entity_id: binary_sensor.safety_sensors_offline
    state: "on"
    repeat: 720
    notifiers:
      - mobile_app_sen_s25
      - persistent_notification
    title: *sys_notify_title_warning
    message: >-
      Датчики безопасности не на связи больше часа:
      {{ state_attr('binary_sensor.safety_sensors_offline', 'offline') }}
    done_message: Все датчики безопасности снова на связи.

  water_leakage_bathroom:
    name: "Water Leakage in Bathroom"
    entity_id: binary_sensor.water_leakage_bathroom_moisture
    state: "on"
    # Repeat intervals in minutes (the last one repeats); the first notification is sent
    # after 1 minute (skip_first), so short false triggers are ignored
    repeat: [1, 1, 2, 10, 30, 60]
    skip_first: true
    notifiers:
      - mobile_app_sen_s25
      - mobile_app_sm_s931b
    title: *sys_notify_title_critical
    message: Water leakage detected in bathroom at {{ states('sensor.time') }}.
    done_message: Bathroom water leakage resolved at {{ states('sensor.time') }}.
    data:
      ttl: 0
      priority: high
      channel: alarm_stream

  water_leakage_kitchen:
    name: "Water Leakage in Kitchen"
    entity_id: binary_sensor.water_leakage_kitchen_moisture
    state: "on"
    repeat: [1, 1, 2, 10, 30, 60]
    skip_first: true
    notifiers:
      - mobile_app_sen_s25
      - mobile_app_sm_s931b
    title: *sys_notify_title_critical
    message: Water leakage detected in kitchen at {{ states('sensor.time') }}.
    done_message: Kitchen water leakage resolved at {{ states('sensor.time') }}.
    data:
      ttl: 0
      priority: high
      channel: alarm_stream

  carbon_monoxide_detected:
    name: "Carbon Monoxide Detected"
    entity_id: binary_sensor.co_and_natural_gas_alarm_carbon_monoxide
    state: "on"
    repeat: 1
    notifiers:
      - mobile_app_sen_s25
      - mobile_app_sm_s931b
    title: *sys_notify_title_critical
    message: >
      Обнаружена высокая концентрация угарного газа на кухне в {{ states('sensor.time') }}.
      Концентрация газа: {{ states('sensor.co_and_natural_gas_alarm_carbon_monoxide') }} ppm
    done_message: Концентрация угарного газа на кухне вернулась в норму в {{ states('sensor.time') }}.
    data:
      ttl: 0
      priority: high
      channel: alarm_stream

  natural_gas_detected:
    name: "Natural Gas Detected"
    entity_id: binary_sensor.co_and_natural_gas_alarm_gas
    state: "on"
    repeat: 1
    notifiers:
      - mobile_app_sen_s25
      - mobile_app_sm_s931b
    title: *sys_notify_title_critical
    message: >
      Обнаружена утечка газа на кухне в {{ states('sensor.time') }}.
      Концентрация газа: {{ states('sensor.co_and_natural_gas_alarm_gas') }} ppm
    done_message: Утечка газа на кухне устранена в {{ states('sensor.time') }}.
    data:
      ttl: 0
      priority: high
      channel: alarm_stream


###############################################
## Automations
###############################################
automation:
  - id: alert_to_tts_handler
    # Queued: simultaneous alerts must each be announced
    alias: Alert to TTS Handler
    description: >-
      Speaks a TTS announcement on both phones (alarm stream, max volume) when a leak or gas alert
      starts or is resolved.
    mode: queued
    max: 5
    variables:
      # alert entity -> [text when it fires, text when it is resolved]
      alerts_map:
        alert.water_leakage_bathroom: ["Обнаружена утечка воды в ванной", "Утечка воды в ванной устранена"]
        alert.water_leakage_kitchen: ["Обнаружена утечка воды на кухне", "Утечка воды на кухне устранена"]
        alert.carbon_monoxide_detected:
          - "Обнаружена высокая концентрация угарного газа на кухне"
          - "Концентрация угарного газа на кухне вернулась в норму"
        alert.natural_gas_detected:
          - "Обнаружена утечка газа на кухне"
          - "Утечка газа на кухне устранена"
    triggers:
      - trigger: state
        entity_id:
          - alert.water_leakage_bathroom
          - alert.water_leakage_kitchen
          - alert.carbon_monoxide_detected
          - alert.natural_gas_detected
    actions:
      - if:
            # Notify only if the alert is true or false, ignoring "acknowledge" state
          - condition: template
            value_template: "{{ trigger.to_state.state in ['on', 'idle'] }}"
        then:
          - action: notify.mobile_app_sen_s25
            data:
              message: TTS
              data:
                priority: high
                channel: alarm_stream_max
                media_stream: "alarm_stream_max"
                tts_text: >
                  {% if trigger.to_state.state == 'on' %}
                    Внимание! {{ alerts_map[trigger.entity_id][0] }}!
                  {% else %}
                    {{ alerts_map[trigger.entity_id][1] }}.
                  {% endif %}
          - action: notify.mobile_app_sm_s931b
            data:
              message: TTS
              data:
                priority: high
                channel: alarm_stream_max
                media_stream: "alarm_stream_max"
                tts_text: >
                  {% if trigger.to_state.state == 'on' %}
                    Внимание! {{ alerts_map[trigger.entity_id][0] }}!
                  {% else %}
                    {{ alerts_map[trigger.entity_id][1] }}.
                  {% endif %}
