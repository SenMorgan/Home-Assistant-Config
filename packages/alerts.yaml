###############################################
## GROUPS
###############################################
group:
  # Sensors whose silent failure would hide a real emergency (AR-03); checked by
  # binary_sensor.safety_sensors_offline. Add new leak/gas/door/window sensors here.
  safety_sensors:
    name: Safety Sensors
    entities:
      - binary_sensor.water_leakage_bathroom_moisture
      - binary_sensor.water_leakage_kitchen_moisture
      - binary_sensor.co_and_natural_gas_alarm_carbon_monoxide
      - binary_sensor.co_and_natural_gas_alarm_gas
      - binary_sensor.hall_door_contact
      - binary_sensor.bedroom_door_contact
      - binary_sensor.wc_door_contact
      - binary_sensor.bedroom_window_contact
      - binary_sensor.kitchen_window_contact
      - binary_sensor.living_room_window_contact
      - sensor.ups_status_data

  # Room air sensors (BTHome ATC, one per room) checked by binary_sensor.room_overheat at 40 °C
  room_temperature_sensors:
    name: Room Temperature Sensors
    entities:
      - sensor.ble_temperature_atc_bedroom
      - sensor.ble_temperature_atc_living_room
      - sensor.ble_temperature_atc_hall
      - sensor.ble_temperature_atc_bathroom
      - sensor.ble_temperature_atc_toilet
      - sensor.ble_temperature_atc_kitchen

  # Backup for the room sensors (a BLE sensor can die or drop out in a fire): chip temperatures of Zigbee
  # devices. They read ~5 °C above the air (whole numbers), hence the higher 45 °C threshold.
  device_temperature_sensors:
    name: Device Temperature Sensors
    entities:
      - sensor.bedroom_door_contact_temperature
      - sensor.bedroom_window_contact_temperature
      - sensor.living_room_window_contact_temperature
      - sensor.kitchen_window_contact_temperature
      - sensor.wc_door_contact_temperature
      - sensor.hall_door_contact_temperature
      - sensor.aqara_hall_motion_sensor_device_temperature

###############################################
## TEMPLATE ENTITIES
###############################################
template:
  - binary_sensor:
      # On when any safety sensor has been unavailable/unknown for over 15 minutes. Zigbee battery
      # sensors turn unavailable only after 4 h of silence (ZHA consider_unavailable_battery), so the
      # delay just ignores Core restarts and short Wi-Fi dropouts (2026-11-22 check: longest 3 min in 10 days;
      # longest Zigbee last_seen gap 147 min, safety sensors 101 min).
      # Note: catches only sensors that go unavailable; a Wi-Fi device that silently stops
      # pushing (Tuya gas detector) keeps its last state and is not detected here.
      - name: Safety Sensors Offline
        unique_id: safety_sensors_offline
        device_class: problem
        delay_on: "00:15:00"
        # Iterates over the configured ids, not expand(): expand() silently skips ids that no longer exist,
        # so a deleted or renamed sensor (the C-01 failure) would stay unnoticed. has_value is false for
        # missing, unknown and unavailable entities alike (audit F2-01).
        state: >-
          {{ state_attr('group.safety_sensors', 'entity_id') | default([], true)
             | reject('has_value') | list | count > 0 }}
        attributes:
          # Names of the offline sensors (entity id if the entity is gone), for the alert message
          offline: >-
            {% from 'devices.jinja' import full_name %}
            {% for e in state_attr('group.safety_sensors', 'entity_id') | default([], true) | reject('has_value') -%}
              {{ full_name(e) }}{{ ', ' if not loop.last }}
            {%- endfor %}

      # On when a room is above 40 °C (or a Zigbee device chip above 45 °C): fire, a heater left on
      # under something, a failed radiator valve. Rooms never exceeded 24 °C (10-day check 2026-11-22),
      # so there is no normal reason to get close. The short delay skips a single corrupt reading.
      - name: Room Overheat
        unique_id: room_overheat
        device_class: heat
        delay_on: "00:00:30"
        state: >-
          {% set rooms = state_attr('group.room_temperature_sensors', 'entity_id') | default([], true) %}
          {% set chips = state_attr('group.device_temperature_sensors', 'entity_id') | default([], true) %}
          {{ rooms | select('has_value') | map('states') | map('float', 0) | select('gt', 40) | list | count > 0
             or chips | select('has_value') | map('states') | map('float', 0) | select('gt', 45) | list | count > 0 }}
        attributes:
          # "в спальне 41,2 °C, на кухне 46 °C" for the push message
          rooms: >-
            {% from 'ru.jinja' import num, room_in %}
            {% set ns = namespace(out=[], seen=[]) %}
            {% for g, limit in [('group.room_temperature_sensors', 40), ('group.device_temperature_sensors', 45)] %}
              {% for e in state_attr(g, 'entity_id') | default([], true) | select('has_value')
                 if states(e) | float(0) > limit %}
                {# One value per room: the room sensor wins over a device chip in the same area #}
                {% if area_name(e) not in ns.seen %}
                  {% set ns.out = ns.out + [room_in(area_name(e)) ~ ' ' ~ num(states(e)) ~ ' °C'] %}
                  {% set ns.seen = ns.seen + [area_name(e)] %}
                {% endif %}
              {% endfor %}
            {% endfor %}
            {{ ns.out | join(', ') }}
          # "в спальне 41 градус" for the voice (no symbols or decimals in TTS)
          rooms_tts: >-
            {% from 'ru.jinja' import plural, room_in %}
            {% set ns = namespace(out=[], seen=[]) %}
            {% for g, limit in [('group.room_temperature_sensors', 40), ('group.device_temperature_sensors', 45)] %}
              {% for e in state_attr(g, 'entity_id') | default([], true) | select('has_value')
                 if states(e) | float(0) > limit %}
                {# One value per room: the room sensor wins over a device chip in the same area #}
                {% if area_name(e) not in ns.seen %}
                  {% set ns.out = ns.out + [room_in(area_name(e)) ~ ' ' ~ plural(states(e) | float(0) | round(0), 'градус', 'градуса', 'градусов')] %}
                  {% set ns.seen = ns.seen + [area_name(e)] %}
                {% endif %}
              {% endfor %}
            {% endfor %}
            {{ ns.out | join(', ') }}

###############################################
## Alerts
###############################################
alert:
  # Maintenance alert (push only, never spoken: see night-mode rule)
  safety_sensors_offline:
    name: "Safety Sensors Offline"
    entity_id: binary_sensor.safety_sensors_offline
    state: "on"
    repeat: 720
    notifiers:
      - mobile_app_sen_s25
      - persistent_notification
    # Same title for the done message, so it is templated on the sensor state
    title: >-
      {{ '📴 Датчики безопасности не на связи' if is_state('binary_sensor.safety_sensors_offline', 'on')
         else '📶 Датчики безопасности на связи' }}
    message: >-
      Нет данных: {{ state_attr('binary_sensor.safety_sensors_offline', 'offline') }}
    done_message: Все датчики безопасности снова передают данные
    data:
      channel: Предупреждения
      importance: high
      priority: high
      ttl: 0

  water_leakage_bathroom:
    name: "Water Leakage in Bathroom"
    entity_id: binary_sensor.water_leakage_bathroom_moisture
    state: "on"
    # Repeat intervals in minutes (the last one repeats); the first notification is sent
    # after 1 minute (skip_first), so short false triggers are ignored
    repeat: [1, 1, 2, 10, 30, 60]
    skip_first: true
    notifiers:
      - mobile_app_sen_s25
      - mobile_app_sm_s931b
    # Every alert and its recovery are separate pushes (no tag): the history must stay visible.
    # Recovery is phrased as a sensor observation, not as "problem solved".
    title: >-
      {{ '💧 Протечка: ванная' if is_state('binary_sensor.water_leakage_bathroom_moisture', 'on')
         else '💧 Ванная: датчик сухой' }}
    message: Датчик в ванной зафиксировал воду на полу · проверьте немедленно
    done_message: Датчик в ванной больше не фиксирует воду · проверьте визуально
    data:
      ttl: 0
      priority: high
      # Voice only (user's choice 2026-11-18): "alarm_stream" played the phone's alarm melody on every
      # reminder; the spoken warning (Alert to TTS Handler) still breaks through silent mode on the alarm stream
      channel: Тревоги
      importance: high

  water_leakage_kitchen:
    name: "Water Leakage in Kitchen"
    entity_id: binary_sensor.water_leakage_kitchen_moisture
    state: "on"
    repeat: [1, 1, 2, 10, 30, 60]
    skip_first: true
    notifiers:
      - mobile_app_sen_s25
      - mobile_app_sm_s931b
    # Every alert and its recovery are separate pushes (no tag): the history must stay visible.
    # Recovery is phrased as a sensor observation, not as "problem solved".
    title: >-
      {{ '💧 Протечка: кухня' if is_state('binary_sensor.water_leakage_kitchen_moisture', 'on')
         else '💧 Кухня: датчик сухой' }}
    message: Датчик на кухне зафиксировал воду на полу · проверьте немедленно
    done_message: Датчик на кухне больше не фиксирует воду · проверьте визуально
    data:
      ttl: 0
      priority: high
      # Voice only (user's choice 2026-11-18): "alarm_stream" played the phone's alarm melody on every
      # reminder; the spoken warning (Alert to TTS Handler) still breaks through silent mode on the alarm stream
      channel: Тревоги
      importance: high

  carbon_monoxide_detected:
    name: "Carbon Monoxide Detected"
    entity_id: binary_sensor.co_and_natural_gas_alarm_carbon_monoxide
    state: "on"
    repeat: 1
    notifiers:
      - mobile_app_sen_s25
      - mobile_app_sm_s931b
    title: >-
      {{ '☠️ Угарный газ: кухня' if is_state('binary_sensor.co_and_natural_gas_alarm_carbon_monoxide', 'on')
         else '☠️ Кухня: CO в норме' }}
    message: >-
      {{ states('sensor.co_and_natural_gas_alarm_carbon_monoxide') }} ppm · проветрите и выйдите из помещения
    done_message: >-
      {{ states('sensor.co_and_natural_gas_alarm_carbon_monoxide') }} ppm по данным датчика
    data:
      ttl: 0
      priority: high
      # Voice only (user's choice 2026-11-18): "alarm_stream" played the phone's alarm melody on every
      # reminder; the spoken warning (Alert to TTS Handler) still breaks through silent mode on the alarm stream
      channel: Тревоги
      importance: high

  natural_gas_detected:
    name: "Natural Gas Detected"
    entity_id: binary_sensor.co_and_natural_gas_alarm_gas
    state: "on"
    repeat: 1
    notifiers:
      - mobile_app_sen_s25
      - mobile_app_sm_s931b
    title: >-
      {{ '🔥 Утечка газа: кухня' if is_state('binary_sensor.co_and_natural_gas_alarm_gas', 'on')
         else '🔥 Кухня: концентрация газа в норме' }}
    message: >-
      {{ states('sensor.co_and_natural_gas_alarm_gas') }} ppm · перекройте газ, не включайте электроприборы, проветрите
    done_message: >-
      {{ states('sensor.co_and_natural_gas_alarm_gas') }} ppm по данным датчика
    data:
      ttl: 0
      priority: high
      # Voice only (user's choice 2026-11-18): "alarm_stream" played the phone's alarm melody on every
      # reminder; the spoken warning (Alert to TTS Handler) still breaks through silent mode on the alarm stream
      channel: Тревоги
      importance: high

  room_overheat:
    name: "Room Overheat"
    entity_id: binary_sensor.room_overheat
    state: "on"
    # Possible fire: remind every minute at first, then less often while it lasts
    repeat: [1, 2, 5, 10]
    notifiers:
      - mobile_app_sen_s25
      - mobile_app_sm_s931b
    title: >-
      {{ '🌡️ Перегрев в квартире' if is_state('binary_sensor.room_overheat', 'on')
         else '🌡️ Температура в норме' }}
    message: >-
      Температура {{ state_attr('binary_sensor.room_overheat', 'rooms') }} · проверьте, нет ли возгорания
    done_message: Во всех комнатах снова ниже 40 °C
    data:
      ttl: 0
      priority: high
      # Voice only (user's choice 2026-11-18), the spoken warning comes from Alert to TTS Handler
      channel: Тревоги
      importance: high

###############################################
## Automations
###############################################
automation:
  - id: alert_to_tts_handler
    # Queued: simultaneous alerts must each be announced
    alias: Alert to TTS Handler
    description: >-
      Speaks a TTS announcement on Yandex Station Midi and on both phones (alarm stream, max volume)
      when a leak, gas, power overload or room overheat alert starts or is resolved. Critical, so it ignores night/silent mode.
    mode: queued
    max: 5
    variables:
      # alert entity -> [text when it fires, text when it is resolved]
      alerts_map:
        alert.water_leakage_bathroom:
          - "Внимание! Протечка воды в ванной!"
          - "Датчик протечки в ванной больше не фиксирует воду."
        alert.water_leakage_kitchen:
          - "Внимание! Протечка воды на кухне!"
          - "Датчик протечки на кухне больше не фиксирует воду."
        alert.carbon_monoxide_detected:
          - "Внимание! Угарный газ на кухне! Проветрите и выйдите из помещения."
          - "Уровень угарного газа на кухне вернулся в норму."
        alert.natural_gas_detected:
          - "Внимание! Утечка газа на кухне! Перекройте газ и проветрите."
          - "Датчик газа на кухне больше не фиксирует утечку."
        alert.high_power:
          - "Внимание! Перегрузка электросети. Выключите мощные приборы."
          - "Потребление электричества вернулось в норму."
        alert.room_overheat:
          - >-
            Внимание! Очень жарко: {{ state_attr('binary_sensor.room_overheat', 'rooms_tts') }}!
            Проверьте, нет ли возгорания.
          - "Температура в квартире вернулась в норму."
    triggers:
      - trigger: state
        entity_id:
          - alert.water_leakage_bathroom
          - alert.water_leakage_kitchen
          - alert.carbon_monoxide_detected
          - alert.natural_gas_detected
          - alert.high_power
          - alert.room_overheat
    actions:
      - if:
            # Notify only if the alert is true or false, ignoring "acknowledge" state
          - condition: template
            value_template: "{{ trigger.to_state.state in ['on', 'idle'] }}"
        then:
          - variables:
              phrase: "{{ alerts_map[trigger.entity_id][0 if trigger.to_state.state == 'on' else 1] }}"
          # Critical: the speaker talks even in night/silent mode
          - action: media_player.play_media
            continue_on_error: true
            target:
              entity_id: media_player.yandex_station_midi
            data:
              media_content_id: >-
                {% from 'alice.jinja' import voice %}{{ voice() }}{{ phrase }}
              media_content_type: text
          - action: notify.mobile_app_sen_s25
            continue_on_error: true
            data:
              message: TTS
              data:
                priority: high
                channel: alarm_stream_max
                media_stream: "alarm_stream_max"
                tts_text: "{{ phrase }}"
          - action: notify.mobile_app_sm_s931b
            continue_on_error: true
            data:
              message: TTS
              data:
                priority: high
                channel: alarm_stream_max
                media_stream: "alarm_stream_max"
                tts_text: "{{ phrase }}"
