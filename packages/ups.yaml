###############################################
## SETTINGS AND VARIABLES
###############################################
homeassistant:
  customize:
    package.node_anchors:
      sys_notify_title_info: &sys_notify_title_info "💬 Системное уведомление"
      sys_notify_title_warning: &sys_notify_title_warning "⚠️ Предупреждение"
      sys_notify_title_critical: &sys_notify_title_critical "🚨 Внимание!"

###############################################
## TEMPLATES ENTITIES
###############################################
template:
  # Keeps its last value while NUT is unreachable, so an outage is not reported as "restored"
  # when the Synology (NUT server) shuts down first
  - binary_sensor:
      - name: UPS On Battery
        unique_id: ups_on_battery
        device_class: problem
        state: >
          {% if has_value('sensor.ups_status_data') %}
            {{ 'OB' in states('sensor.ups_status_data') }}
          {% else %}
            {{ is_state('binary_sensor.ups_on_battery', 'on') }}
          {% endif %}
  - sensor:
      # Real power draw = load % x nominal real power of the UPS
      - name: UPS Power
        unit_of_measurement: W
        device_class: power
        icon: mdi:gauge
        state: >
          {{ (states('sensor.ups_load') | int(0) * 0.01 * states('sensor.ups_nominal_real_power') | int(0)) |
            round(2, default=none) }}

###############################################
## ALERTS
###############################################
alert:
  ups_lost_power:
    name: UPS lost power
    entity_id: binary_sensor.ups_on_battery
    state: "on"
    # Repeat every minute while on battery; cannot be silenced
    repeat: 1
    can_acknowledge: false
    notifiers: mobile_app_sen_s25
    title: *sys_notify_title_critical
    message: |
      UPS отключится через {{ states('sensor.ups_battery_runtime') | int(0) | timestamp_custom('%M:%S') }} минут
      Заряд аккумулятора: {{ states('sensor.ups_battery_charge') }}%
      Напряжение аккумулятора: {{ states('sensor.ups_battery_voltage') }} В
      Статус: {{ states('sensor.ups_status') }}
    done_message: |
      UPS восстановил питание в {{ states('sensor.time') }}
      Оставшийся заряд аккумулятора: {{ states('sensor.ups_battery_charge') }}%
    data:
      ttl: 0
      priority: high

###############################################
## AUTOMATIONS
###############################################
automation:
  - id: ups_lost_grid_power_notification
    alias: UPS Lost Grid Power Notification
    description: >-
      Notifies when the UPS switches to battery with the estimated runtime,
      and arms the power-restored notification.
    mode: single
    triggers:
      # Any on-battery status (OB, OB DISCHRG, OB DISCHRG LB, ...), not just one exact string.
      # from "off" skips HA restarts, when the sensor comes back from unknown/unavailable.
      - trigger: state
        entity_id: binary_sensor.ups_on_battery
        from: "off"
        to: "on"
    actions:
      # Notify via mobile app and create persistent notification
      - action: script.notify_and_create_persistent_notification
        data:
          title: *sys_notify_title_critical
          message: >
            UPS потерял питание в {{ states('sensor.time') }}
            Рассчётное время работы: {{ states('sensor.ups_battery_runtime') | int(0) | timestamp_custom('%M:%S') }} минут
      - action: automation.turn_on
        target:
          entity_id: automation.ups_grid_power_restored_notification

  - id: ups_grid_power_restored_notification
    alias: UPS Grid Power Restored Notification
    description: >-
      Notifies once when the UPS is back on line (OL) after an outage, then disables itself
      until the next outage re-enables it.
    mode: single
    triggers:
      # Fires when the status changes to contain OL (on line); this automation is enabled only after an outage
      - trigger: template
        value_template: "{{ 'OL' in states('sensor.ups_status_data') }}"
    actions:
      # Notify via mobile app and create persistent notification
      - action: script.notify_and_create_persistent_notification
        data:
          title: *sys_notify_title_critical
          message: Питание восстановлено в {{ states('sensor.time') }}
      - action: automation.turn_off
        target:
          entity_id: automation.ups_grid_power_restored_notification

  - id: ups_low_battery_warning_notification
    alias: UPS Low Battery Warning Notification
    description: >-
      Warns when the UPS battery charge is below 21 % while the UPS runs on battery
      (ignores self-tests and recharging on grid power).
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.ups_battery_charge
        below: 21
      # Charge was already low on grid power (e.g. still recharging) and then the grid fails
      - trigger: state
        entity_id: binary_sensor.ups_on_battery
        from: "off"
        to: "on"
    conditions:
      # Only on battery: a low charge on grid power is not an emergency
      - condition: state
        entity_id: binary_sensor.ups_on_battery
        state: "on"
      - condition: numeric_state
        entity_id: sensor.ups_battery_charge
        below: 21
    actions:
      - action: notify.mobile_app_sen_s25
        data:
          title: *sys_notify_title_critical
          message: >
            Низкий заряд аккумулятора UPS: {{ states('sensor.ups_battery_charge') }}%

  - id: ups_shutdown_home_assistant_server
    alias: UPS Shutdown Home Assistant Server
    description: >-
      Shuts down the Home Assistant host when the UPS is on battery and the battery is low
      (LB flag, charge below 10 % or runtime below 5 min), or when NUT disappears during an outage.
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.ups_battery_charge
        below: 10
      - trigger: numeric_state
        entity_id: sensor.ups_battery_runtime
        below: 300
      - trigger: template
        value_template: "{{ 'OB DISCHRG LB' in states('sensor.ups_status_data') }}"
      # Re-check thresholds once the UPS has been on battery for a minute
      # (a threshold crossed earlier on grid power does not fire again)
      - trigger: state
        entity_id: binary_sensor.ups_on_battery
        to: "on"
        for: "00:01:00"
      # NUT server (on the Synology) disappeared while we were on battery
      - trigger: state
        entity_id: sensor.ups_status_data
        to: "unavailable"
        for: "00:02:00"
        id: nut_lost
    conditions:
      # Act only when on battery AND low (ignore self-tests, NUT restarts, worn-battery runtime estimates),
      # or when NUT was lost during an outage
      - condition: template
        value_template: >-
          {% set st = states('sensor.ups_status_data') %}
          {{ ('OB' in st and ('LB' in st
                or states('sensor.ups_battery_charge') | float(100) < 10
                or states('sensor.ups_battery_runtime') | float(99999) < 300))
             or (trigger.id == 'nut_lost' and is_state('binary_sensor.ups_on_battery', 'on')) }}
    actions:
      - action: notify.mobile_app_sen_s25
        data:
          title: *sys_notify_title_critical
          message: |
            Критически низкий заряд батареи UPS.
            Немедленное отключение сервера Home Assistant в {{ states('sensor.time') }}
      # Give the notification a moment to be sent before the host goes down
      - delay: 00:00:05
      - action: hassio.host_shutdown

