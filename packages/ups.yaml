###############################################
## TEMPLATES ENTITIES
###############################################
template:
  # Keeps its last value while NUT is unreachable, so an outage is not reported as "restored"
  # when the Synology (NUT server) shuts down first
  - binary_sensor:
      - name: UPS On Battery
        unique_id: ups_on_battery
        device_class: problem
        state: >
          {% if has_value('sensor.ups_status_data') %}
            {{ 'OB' in states('sensor.ups_status_data') }}
          {% else %}
            {{ is_state('binary_sensor.ups_on_battery', 'on') }}
          {% endif %}
  - sensor:
      # Real power draw = load % x nominal real power of the UPS
      - name: UPS Power
        unit_of_measurement: W
        device_class: power
        icon: mdi:gauge
        state: >
          {{ (states('sensor.ups_load') | int(0) * 0.01 * states('sensor.ups_nominal_real_power') | int(0)) |
            round(2, default=none) }}

###############################################
## ALERTS
###############################################
alert:
  # Repeats while the UPS is on battery (E-1): the first push comes from the "UPS Lost Grid Power"
  # automation (no tag, stays in history); these repeats share a tag, so each one replaces the
  # previous repeat with fresh numbers. No done_message: the restore push is sent by the automation.
  ups_lost_power:
    name: UPS lost power
    entity_id: binary_sensor.ups_on_battery
    state: "on"
    repeat: 1
    skip_first: true
    can_acknowledge: false
    notifiers: mobile_app_sen_s25
    title: 🔌 Нет электричества
    # Runtime is in seconds; shown in whole minutes (E-2: the old %M:%S format dropped hours)
    message: >-
      UPS на батарее · {{ states('sensor.ups_battery_charge') | int(0) }} % ·
      хватит ≈ {{ (states('sensor.ups_battery_runtime') | float(0) / 60) | round(0) | int }} мин
    data:
      tag: ups_power
      channel: alarm_stream
      importance: high
      priority: high
      ttl: 0

###############################################
## AUTOMATIONS
###############################################
automation:
  - id: ups_lost_grid_power_notification
    alias: UPS Lost Grid Power Notification
    description: >-
      First notification when the UPS switches to battery (critical: both phones, speaker and phone
      voice). Repeats with updated numbers come from alert.ups_lost_power.
    mode: single
    triggers:
      # Any on-battery status (OB, OB DISCHRG, OB DISCHRG LB, ...), not just one exact string.
      # from "off" skips HA restarts, when the sensor comes back from unknown/unavailable.
      - trigger: state
        entity_id: binary_sensor.ups_on_battery
        from: "off"
        to: "on"
    actions:
      - action: script.notify
        data:
          level: critical
          title: 🔌 Нет электричества
          message: >-
            UPS на батарее · {{ states('sensor.ups_battery_charge') | int(0) }} % ·
            хватит ≈ {{ (states('sensor.ups_battery_runtime') | float(0) / 60) | round(0) | int }} мин
          tts: Внимание! Пропало электричество. Сервер работает от батареи.
          when: "{{ as_timestamp(trigger.to_state.last_changed) | int }}"

  - id: ups_grid_power_restored_notification
    alias: UPS Grid Power Restored Notification
    description: >-
      Notifies both phones when the UPS is back on grid power after an outage, with the outage
      duration and the remaining battery charge.
    mode: single
    triggers:
      # on -> off only (not from unavailable), so HA restarts and NUT reconnects do not fire it
      - trigger: state
        entity_id: binary_sensor.ups_on_battery
        from: "on"
        to: "off"
    actions:
      - variables:
          # The outage started when the sensor last turned on
          outage_min: >-
            {{ ((as_timestamp(trigger.to_state.last_changed) - as_timestamp(trigger.from_state.last_changed)) / 60)
               | round(0) | int }}
      # Clear the repeating "no power" push; the first outage push stays in history
      - action: notify.mobile_app_sen_s25
        continue_on_error: true
        data:
          message: clear_notification
          data:
            tag: ups_power
      - action: script.notify
        data:
          level: warning
          recipients: [mobile_app_sen_s25, mobile_app_sm_s931b]
          title: 🔌 Электричество есть
          message: >-
            {% from 'ru.jinja' import duration_short %}
            Без питания {{ duration_short(outage_min) }} · батарея UPS {{ states('sensor.ups_battery_charge') | int(0) }} %

  - id: ups_low_battery_warning_notification
    alias: UPS Low Battery Warning Notification
    description: >-
      Warns when the UPS battery charge is below 21 % while the UPS runs on battery
      (ignores self-tests and recharging on grid power).
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.ups_battery_charge
        below: 21
      # Charge was already low on grid power (e.g. still recharging) and then the grid fails
      - trigger: state
        entity_id: binary_sensor.ups_on_battery
        from: "off"
        to: "on"
    conditions:
      # Only on battery: a low charge on grid power is not an emergency
      - condition: state
        entity_id: binary_sensor.ups_on_battery
        state: "on"
      - condition: numeric_state
        entity_id: sensor.ups_battery_charge
        below: 21
    actions:
      - action: script.notify
        data:
          level: critical
          recipients: [mobile_app_sen_s25]
          title: "🪫 UPS: батарея {{ states('sensor.ups_battery_charge') | int(0) }} %"
          message: >-
            Осталось ≈ {{ (states('sensor.ups_battery_runtime') | float(0) / 60) | round(0) | int }} мин ·
            при 10 % сервер выключится сам

  - id: ups_shutdown_home_assistant_server
    alias: UPS Shutdown Home Assistant Server
    description: >-
      Shuts down the Home Assistant host when the UPS is on battery and the battery is low
      (LB flag, charge below 10 % or runtime below 5 min), or when NUT disappears during an outage.
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.ups_battery_charge
        below: 10
      - trigger: numeric_state
        entity_id: sensor.ups_battery_runtime
        below: 300
      - trigger: template
        value_template: "{{ 'OB DISCHRG LB' in states('sensor.ups_status_data') }}"
      # Re-check thresholds once the UPS has been on battery for a minute
      # (a threshold crossed earlier on grid power does not fire again)
      - trigger: state
        entity_id: binary_sensor.ups_on_battery
        to: "on"
        for: "00:01:00"
      # NUT server (on the Synology) disappeared while we were on battery
      - trigger: state
        entity_id: sensor.ups_status_data
        to: "unavailable"
        for: "00:02:00"
        id: nut_lost
    conditions:
      # Act only when on battery AND low (ignore self-tests, NUT restarts, worn-battery runtime estimates),
      # or when NUT was lost during an outage
      - condition: template
        value_template: >-
          {% set st = states('sensor.ups_status_data') %}
          {{ ('OB' in st and ('LB' in st
                or states('sensor.ups_battery_charge') | float(100) < 10
                or states('sensor.ups_battery_runtime') | float(99999) < 300))
             or (trigger.id == 'nut_lost' and is_state('binary_sensor.ups_on_battery', 'on')) }}
    actions:
      - action: script.notify
        data:
          level: critical
          recipients: [mobile_app_sen_s25]
          title: ⛔ Выключаю сервер
          message: >-
            UPS {{ states('sensor.ups_battery_charge') | int(0) }} % · HA выключится через 5 с ·
            включение — вручную после появления питания
      # Give the notification a moment to be sent before the host goes down
      - delay: 00:00:05
      - action: hassio.host_shutdown
