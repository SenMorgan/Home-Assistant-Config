###############################################
## INPUT NUMBERS
###############################################
input_number:
  moisture_low_threshold:
    name: Moisture Low Threshold
    min: 0
    max: 100
    step: 5.0

###############################################
## INPUT TEXTS
###############################################
input_text:
  plants_to_water:
    name: Plants to Water
    max: 255

###############################################
## SCHEDULERS
###############################################
schedule:
  plant_watering_notification:
    name: "Plant Watering Notification"
    monday: &watering_schedule_weekdays
      - from: "17:00:00"
        to: "21:00:00"
    tuesday: *watering_schedule_weekdays
    wednesday: *watering_schedule_weekdays
    thursday: *watering_schedule_weekdays
    friday: *watering_schedule_weekdays
    saturday: &watering_schedule_weekends
      - from: "09:00:00"
        to: "21:00:00"
    sunday: *watering_schedule_weekends

###############################################
## AUTOMATIONS
###############################################
automation:
  - id: update_plants_to_water_on_sensor_change
    alias: Update Plants to Water on Sensor Change
    description: >-
      Every 10 minutes run the python script that compares BLE moisture sensors
      with the low threshold (with hysteresis) and updates the plants-to-water list.
    mode: single
    max_exceeded: silent
    # Polled instead of triggered by sensor changes; the script scans all sensor.ble_moisture_* entities
    triggers:
      - trigger: time_pattern
        minutes: "/10"
    actions:
      - action: python_script.update_plants_to_water

  - id: notify_on_plants_to_water
    alias: Notify on Plants to Water
    description: >-
      Send a watering reminder (mobile + persistent notification) listing the
      plants that need water, but only within the notification schedule window.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: input_text.plants_to_water
      # Also announce plants that dried out while the notification window was closed
      - trigger: state
        entity_id: schedule.plant_watering_notification
        to: "on"
    conditions:
      # Only when the list is not empty
      - condition: template
        value_template: "{{ states('input_text.plants_to_water') | length > 0 }}"
      - condition: state
        entity_id: schedule.plant_watering_notification
        state: "on"
    actions:
      # Push + persistent notification (same id, so a new list replaces the old one) with a "Watered" button
      - action: script.notify
        data:
          level: info
          persistent: true
          notification_id: plants_to_water
          tag: plants_to_water
          title: "🪴 Нужно полить цветы: {{ states('input_text.plants_to_water').split(',') | count }}"
          message: "{{ states('input_text.plants_to_water') }}"
          actions:
            - action: PLANTS_WATERED
              title: ✅ Полито

  - id: plants_watered_button
    alias: Plants Watered Button
    description: >-
      Handles the "Watered" button of the watering reminder: removes the push and the persistent
      notification. The list itself is rebuilt from the moisture sensors within 10 minutes.
    mode: single
    triggers:
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: PLANTS_WATERED
    actions:
      - action: persistent_notification.dismiss
        data:
          notification_id: plants_to_water
      - action: notify.mobile_app_sen_s25
        continue_on_error: true
        data:
          message: clear_notification
          data:
            tag: plants_to_water
