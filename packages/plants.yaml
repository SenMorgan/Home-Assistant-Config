###############################################
## INPUT NUMBERS
###############################################
input_number:
  moisture_low_threshold:
    name: Moisture Low Threshold
    min: 0
    max: 100
    step: 5.0

###############################################
## INPUT TEXTS
###############################################
input_text:
  plants_to_water:
    name: Plants to Water
    max: 255

###############################################
## SCHEDULERS
###############################################
schedule:
  plant_watering_notification:
    name: "Plant Watering Notification"
    monday: &watering_schedule_weekdays
      - from: "17:00:00"
        to: "21:00:00"
    tuesday: *watering_schedule_weekdays
    wednesday: *watering_schedule_weekdays
    thursday: *watering_schedule_weekdays
    friday: *watering_schedule_weekdays
    saturday: &watering_schedule_weekends
      - from: "09:00:00"
        to: "21:00:00"
    sunday: *watering_schedule_weekends

###############################################
## TEMPLATE ENTITIES
###############################################
template:
  - binary_sensor:
      # ble_monitor never marks a silent b-parasite unavailable: it keeps the last value (unknown after a
      # restart), so the generic offline checks missed three dead sensors for over a week (14.11-22.11).
      # On when a plant moisture sensor has no value or no report for 6 h (they report many times an hour;
      # last_reported, not last_updated: a soaked pot keeps the same moisture value for days).
      # The 3 h delay rides out Core restarts, after which every sensor is unknown until its next report.
      - name: Plant Sensors Silent
        unique_id: plant_sensors_silent
        device_class: problem
        delay_on: "03:00:00"
        state: >-
          {% set limit = now() - timedelta(hours=6) %}
          {{ states.sensor | selectattr('entity_id', 'search', '^sensor\.ble_moisture_')
             | rejectattr('state', 'is_number') | list | count > 0
             or states.sensor | selectattr('entity_id', 'search', '^sensor\.ble_moisture_')
             | selectattr('last_reported', 'lt', limit) | list | count > 0 }}
        attributes:
          # Plant names of the silent sensors, for the notification
          plants: >-
            {% set limit = now() - timedelta(hours=6) %}
            {% set ns = namespace(out=[]) %}
            {% for st in states.sensor | selectattr('entity_id', 'search', '^sensor\.ble_moisture_') %}
              {% if not st.state | is_number or st.last_reported < limit %}
                {% set ns.out = ns.out + [st.name] %}
              {% endif %}
            {% endfor %}
            {{ ns.out | join(', ') }}

###############################################
## AUTOMATIONS
###############################################
automation:
  - id: update_plants_to_water_on_sensor_change
    alias: Update Plants to Water
    description: >-
      Every 10 minutes run the python script that compares BLE moisture sensors
      with the low threshold (with hysteresis) and updates the plants-to-water list.
    mode: single
    max_exceeded: silent
    # Polled instead of triggered by sensor changes; the script scans all sensor.ble_moisture_* entities
    triggers:
      - trigger: time_pattern
        minutes: "/10"
    actions:
      - action: python_script.update_plants_to_water
        data:
          # Plant names for the list (python scripts cannot build them without the friendly_name attribute)
          names: >-
            {% from 'devices.jinja' import full_name %}
            {% set ns = namespace(d={}) %}
            {% for e in states.sensor | map(attribute='entity_id') | select('match', 'sensor\\.ble_moisture_') %}
              {% set ns.d = dict(ns.d, **{e: full_name(e)}) %}
            {% endfor %}
            {{ ns.d }}

  - id: notify_on_plants_to_water
    alias: Notify on Plants to Water
    description: >-
      Send a watering reminder (mobile + persistent notification) listing the
      plants that need water, but only within the notification schedule window.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: input_text.plants_to_water
      # Also announce plants that dried out while the notification window was closed
      - trigger: state
        entity_id: schedule.plant_watering_notification
        to: "on"
    conditions:
      # Only when the list is not empty
      - condition: template
        value_template: "{{ states('input_text.plants_to_water') | length > 0 }}"
      # Only when a plant was added (or the window opened): a shrinking list (a plant was watered)
      # must not re-send the reminder (Y-19)
      - condition: template
        value_template: >-
          {% if trigger.entity_id != 'input_text.plants_to_water' or trigger.from_state is none %}true
          {% else %}
            {% set old = trigger.from_state.state.split(',') | map('trim') | list %}
            {{ trigger.to_state.state.split(',') | map('trim') | reject('in', old) | list | count > 0 }}
          {% endif %}
      - condition: state
        entity_id: schedule.plant_watering_notification
        state: "on"
    actions:
      # Push + persistent notification (same id, so a new list replaces the old one) with a "Watered" button
      - action: script.notify
        data:
          level: info
          persistent: true
          notification_id: plants_to_water
          tag: plants_to_water
          title: "🪴 Пора полить растения: {{ states('input_text.plants_to_water').split(',') | count }}"
          message: "{{ states('input_text.plants_to_water') }}"
          actions:
            - action: PLANTS_WATERED
              title: ✅ Полито

  - id: plant_sensors_silent_notification
    alias: Plant Sensors Silent Notification
    description: >-
      Silent push + HA notification listing the plant moisture sensors that stopped reporting (dead battery,
      out of BLE range), again when the list changes and every Saturday at 10:00 as a reminder; removes both
      once all sensors report again.
    mode: queued
    max: 3
    triggers:
      - trigger: state
        entity_id: binary_sensor.plant_sensors_silent
        to: ["on", "off"]
      # Another sensor died or one came back while still on
      - trigger: state
        entity_id: binary_sensor.plant_sensors_silent
        attribute: plants
      # Weekly reminder: replacing a battery is easy to postpone
      - trigger: time
        at: "10:00:00"
        weekday: sat
    actions:
      - if:
          - condition: state
            entity_id: binary_sensor.plant_sensors_silent
            state: "on"
        then:
          # Status level: silent and low importance, so a night-time trigger wakes nobody; the tag and the
          # notification id make each update replace the previous one
          - action: script.notify
            data:
              level: status
              persistent: true
              notification_id: plant_sensors_silent
              tag: plant_sensors_silent
              title: 🪴 Датчики растений молчат
              message: >-
                {{ state_attr('binary_sensor.plant_sensors_silent', 'plants') }} · замените батарейку или поднесите ближе
        else:
          # All sensors report again: remove the push and the HA notification
          - action: persistent_notification.dismiss
            data:
              notification_id: plant_sensors_silent
          - action: notify.mobile_app_sen_s25
            continue_on_error: true
            data:
              message: clear_notification
              data:
                tag: plant_sensors_silent

  - id: plants_watered_button
    alias: Plants Watered Button
    description: >-
      Handles the "Watered" button of the watering reminder: removes the push and the persistent
      notification. The list itself is rebuilt from the moisture sensors within 10 minutes.
    mode: single
    triggers:
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: PLANTS_WATERED
    actions:
      - action: persistent_notification.dismiss
        data:
          notification_id: plants_to_water
      - action: notify.mobile_app_sen_s25
        continue_on_error: true
        data:
          message: clear_notification
          data:
            tag: plants_to_water
