# Yandex Smart Home (Alice) entity filter and names.
# Privacy: no security devices (door/window contacts, motion, cameras, alarms, guest mode), no thermostats or eTRVs,
# no electricity meter, no phones and no presence hints (PC, baby monitor) are exposed: Yandex would receive every state change.
# Climate sensors are "Климат" devices assigned to rooms; values are rounded coarsely in value_template
# (temperature 0.5 °C, humidity 5 %, CO2 100, PM2.5 10; TVOC not exposed, it changes all the time) so Yandex gets a report only on a real change:
# BTHome sensors update every ~18 s and 0.1 °C rounding flapped at the boundary (HTTP 429, 16.11.2026).
# Naming rules for device and room names (otherwise Alice marks the device as needing setup):
# Cyrillic letters and digits only, at most 25 characters, a space between words and numbers ("3 д принтер", not "3д").
filter:
  include_entities:
    # Climate sensors (temperature/humidity per room, see entity_config)
    - sensor.ble_temperature_atc_bedroom
    - sensor.ble_temperature_atc_living_room
    - sensor.ble_temperature_atc_kitchen
    - sensor.ble_temperature_atc_hall
    - sensor.ble_temperature_atc_bathroom
    - sensor.ble_temperature_atc_toilet
    - sensor.pool_monitor_air_temperature
    - button.ex_commandstation_emergency_stop
    - button.ex_commandstation_reboot
    - button.ex_commandstation_route_300
    - cover.bedroom
    - cover.living_cover
    - climate.hollandis_climate
    - fan.wc_and_bathroom
    - input_boolean.3d_printer_power
    - input_boolean.heating_allowed
    - input_boolean.home_night_mode
    - input_boolean.silent_mode
    - input_button.thermostat_10_minutes_heating
    - light.banana_light
    - light.bedroom_ceiling_light
    - light.bedroom_nightlight
    - light.christmas_tree
    - light.dollhouse_lights
    - light.cocktail_bar_neon_sign
    - light.floor_lamp
    - light.gyver_lamp
    - light.hall_edison_bulb
    - light.hall_lights
    - light.kitchen_ceiling_light
    - light.kitchen_christmas_lights
    - light.kitchen_led_strip
    - light.kitchen_spotlights
    - light.living_room_ceiling_light
    - light.mi_desk_lamp
    - light.shelf_lighting
    - light.string_lights
    - light.tv_lights
    - media_player.model_railway
    - media_player.samsung_tv
    - scene.evening
    - scene.movies
    - sensor.pool_monitor_bottom_water_temperature
    - sensor.pool_monitor_upper_water_temperature
    - switch.interactive_cz_map_enable
    - switch.loco_sbb_cargo_re_482_power_sound
    - switch.loco_vossloh_1701_engine_sound
    - switch.loco_vossloh_1701_horn_hi
    - switch.monolith_speakers
    - switch.moving_head_power
    - switch.wireless_charger
    - vacuum.johnny

entity_config:
  # Entities without an HA area get a room here, otherwise Alice asks to finish their setup.
  # Room names follow the "Алиса: ..." area aliases (Зал, Кухня, Спальня, Коридор, Ванная, Туалет, Двор).
  input_button.thermostat_10_minutes_heating:
    name: Подогрев
    room: Кухня
    type: switch
  # "Алиса, включи Теслу" = climate on (preconditioning); own room so "выключи всё во дворе" never touches it
  climate.hollandis_climate:
    name: Тесла
    room: Машина
  # "Алиса, включи 3д принтер" ("3D" is not allowed, see the naming rules at the top)
  input_boolean.3d_printer_power:
    name: 3 д принтер
    room: Коридор
    type: switch
  input_boolean.heating_allowed:
    name: Отопление
    room: Кухня
    type: switch
  input_boolean.home_night_mode:
    name: Ночной режим
    room: Спальня
    type: switch
  input_boolean.silent_mode:
    name: Тихий режим
    room: Спальня
    type: switch
  light.hall_lights:
    name: Люстра
    type: light.ceiling
  light.shelf_lighting:
    name: Подсветка полки
    type: light.strip
  light.floor_lamp:
    name: Торшер
  light.mi_desk_lamp:
    name: Светильник
    type: light.lamp
  light.hall_edison_bulb:
    name: Лампочка
  light.gyver_lamp:
    name: Лампа Гайвера
    slow: true
    type: light.lamp
  light.string_lights:
    name: Лампочки
  switch.wireless_charger:
    name: Беспроводная зарядка
    type: switch
    slow: true
  light.kitchen_spotlights:
    name: Подсветка
  light.kitchen_led_strip:
    name: Светодиодная лента
    type: light.strip
  light.bedroom_nightlight:
    name: Ночник
  light.christmas_tree:
    name: Ёлка
  light.dollhouse_lights:
    name: Кукольный домик
    type: light.strip
  light.cocktail_bar_neon_sign:
    name: Неоновая вывеска
  light.living_room_ceiling_light:
    name: Люстра
    type: light.ceiling
  light.banana_light:
    name: Банан
    slow: true
  light.bedroom_ceiling_light:
    name: Люстра
    type: light.ceiling
  light.kitchen_ceiling_light:
    name: Люстра
    type: light.ceiling
  light.tv_lights:
    name: Подсветка телевизора
    type: light.strip
  light.kitchen_christmas_lights:
    name: Гирлянда
  media_player.model_railway:
    name: Макет
  media_player.samsung_tv:
    name: Телевизор
  scene.evening:
    name: Вечернее освещение
    room: Зал
  scene.movies:
    name: Сцена Кино
  switch.interactive_cz_map_enable:
    name: Карта
    type: switch
  switch.monolith_speakers:
    name: Колонки
    type: socket
  switch.moving_head_power:
    name: Голова
    type: socket
  button.ex_commandstation_emergency_stop:
    name: Экстренная остановка
    type: switch
  button.ex_commandstation_reboot:
    name: Перезагрузка макета
    type: switch
  button.ex_commandstation_route_300:
    name: Маршрут 300
    type: switch
  switch.loco_vossloh_1701_engine_sound:
    name: Двигатель тепловоза
    type: switch
  switch.loco_vossloh_1701_horn_hi:
    name: Гудок локомотива
    type: switch
  switch.loco_sbb_cargo_re_482_power_sound:
    name: Токоприёмник
    type: openable
  sensor.pool_monitor_bottom_water_temperature:
    name: Температура воды снизу
    properties:
      - type: temperature
        value_template: "{{ (states('sensor.pool_monitor_bottom_water_temperature') | float * 2) | round(0) / 2 if states('sensor.pool_monitor_bottom_water_temperature') | is_number else none }}"
        unit_of_measurement: "°C"
  sensor.pool_monitor_upper_water_temperature:
    name: Температура воды сверху
    properties:
      - type: temperature
        value_template: "{{ (states('sensor.pool_monitor_upper_water_temperature') | float * 2) | round(0) / 2 if states('sensor.pool_monitor_upper_water_temperature') | is_number else none }}"
        unit_of_measurement: "°C"
  cover.bedroom:
    name: Штора
  cover.living_cover:
    name: Штора
  fan.wc_and_bathroom:
    name: Вентиляция
  vacuum.johnny:
    name: Джонни
  # Climate sensors: one "Климат" device per room (Alice: "какая влажность в спальне?")
  sensor.ble_temperature_atc_bedroom:
    name: Климат
    room: Спальня
    type: sensor.climate
    properties:
      - type: temperature
        value_template: "{{ (states('sensor.ble_temperature_atc_bedroom') | float * 2) | round(0) / 2 if states('sensor.ble_temperature_atc_bedroom') | is_number else none }}"
        unit_of_measurement: "°C"
      - type: humidity
        value_template: "{{ ((states('sensor.ble_humidity_atc_bedroom') | float / 5) | round(0) * 5) | int if states('sensor.ble_humidity_atc_bedroom') | is_number else none }}"
        unit_of_measurement: "%"
  sensor.ble_temperature_atc_living_room:
    name: Климат
    room: Зал
    type: sensor.climate
    properties:
      - type: temperature
        value_template: "{{ (states('sensor.ble_temperature_atc_living_room') | float * 2) | round(0) / 2 if states('sensor.ble_temperature_atc_living_room') | is_number else none }}"
        unit_of_measurement: "°C"
      - type: humidity
        value_template: "{{ ((states('sensor.ble_humidity_atc_living_room') | float / 5) | round(0) * 5) | int if states('sensor.ble_humidity_atc_living_room') | is_number else none }}"
        unit_of_measurement: "%"
  sensor.ble_temperature_atc_kitchen:
    name: Климат
    room: Кухня
    type: sensor.climate
    properties:
      - type: temperature
        value_template: "{{ (states('sensor.ble_temperature_atc_kitchen') | float * 2) | round(0) / 2 if states('sensor.ble_temperature_atc_kitchen') | is_number else none }}"
        unit_of_measurement: "°C"
      - type: humidity
        value_template: "{{ ((states('sensor.ble_humidity_atc_kitchen') | float / 5) | round(0) * 5) | int if states('sensor.ble_humidity_atc_kitchen') | is_number else none }}"
        unit_of_measurement: "%"
      - type: pressure
        value_template: "{{ states('sensor.air_quality_station_pressure') | float | round(0) | int if states('sensor.air_quality_station_pressure') | is_number else none }}"
        unit_of_measurement: "hPa"
      - type: co2_level
        value_template: "{{ ((states('sensor.air_quality_station_co2') | float / 100) | round(0) * 100) | int if states('sensor.air_quality_station_co2') | is_number else none }}"
        unit_of_measurement: "ppm"
      - type: pm2.5_density
        value_template: "{{ ((states('sensor.air_quality_station_pm2_5') | float / 10) | round(0) * 10) | int if states('sensor.air_quality_station_pm2_5') | is_number else none }}"
        unit_of_measurement: "μg/m³"
  sensor.ble_temperature_atc_hall:
    name: Климат
    room: Коридор
    type: sensor.climate
    properties:
      - type: temperature
        value_template: "{{ (states('sensor.ble_temperature_atc_hall') | float * 2) | round(0) / 2 if states('sensor.ble_temperature_atc_hall') | is_number else none }}"
        unit_of_measurement: "°C"
      - type: humidity
        value_template: "{{ ((states('sensor.ble_humidity_atc_hall') | float / 5) | round(0) * 5) | int if states('sensor.ble_humidity_atc_hall') | is_number else none }}"
        unit_of_measurement: "%"
  sensor.ble_temperature_atc_bathroom:
    name: Климат
    room: Ванная
    type: sensor.climate
    properties:
      - type: temperature
        value_template: "{{ (states('sensor.ble_temperature_atc_bathroom') | float * 2) | round(0) / 2 if states('sensor.ble_temperature_atc_bathroom') | is_number else none }}"
        unit_of_measurement: "°C"
      - type: humidity
        value_template: "{{ ((states('sensor.ble_humidity_atc_bathroom') | float / 5) | round(0) * 5) | int if states('sensor.ble_humidity_atc_bathroom') | is_number else none }}"
        unit_of_measurement: "%"
  sensor.ble_temperature_atc_toilet:
    name: Климат
    room: Туалет
    type: sensor.climate
    properties:
      - type: temperature
        value_template: "{{ (states('sensor.ble_temperature_atc_toilet') | float * 2) | round(0) / 2 if states('sensor.ble_temperature_atc_toilet') | is_number else none }}"
        unit_of_measurement: "°C"
      - type: humidity
        value_template: "{{ ((states('sensor.ble_humidity_atc_toilet') | float / 5) | round(0) * 5) | int if states('sensor.ble_humidity_atc_toilet') | is_number else none }}"
        unit_of_measurement: "%"
  sensor.pool_monitor_air_temperature:
    name: Климат
    room: Двор
    type: sensor.climate
    properties:
      - type: temperature
        value_template: "{{ (states('sensor.pool_monitor_air_temperature') | float * 2) | round(0) / 2 if states('sensor.pool_monitor_air_temperature') | is_number else none }}"
        unit_of_measurement: "°C"
      - type: humidity
        value_template: "{{ ((states('sensor.pool_monitor_air_humidity') | float / 5) | round(0) * 5) | int if states('sensor.pool_monitor_air_humidity') | is_number else none }}"
        unit_of_measurement: "%"
      - type: pressure
        value_template: "{{ states('sensor.pool_monitor_air_pressure') | float | round(0) | int if states('sensor.pool_monitor_air_pressure') | is_number else none }}"
        unit_of_measurement: "hPa"
