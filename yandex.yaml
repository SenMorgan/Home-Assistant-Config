  light.banana_light:
    name: Банан
    slow: true
  light.bedroom_ceiling_light:
    name: Люстра
    type: light.ceiling
  light.kitchen_ceiling_light:
    name: Люстра
    type: light.ceiling
  light.tv_lights:
    name: Подсветка телевизора
    type: light.strip
  light.kitchen_christmas_lights:
    name: Гирлянда
  media_player.model_railway:
    name: Макет
  media_player.samsung_tv:
    name: Телевизор
  scene.evening:
    name: Вечернее Освещение
  scene.movies:
    name: Сцена Кино
  switch.hollandis_charge:
    name: Зарядка Теслы
    type: socket
  switch.interactive_cz_map_enable:
    name: Карта
    type: switch
  switch.monolith_speakers:
    name: Колонки
    type: socket
  switch.moving_head_power:
    name: Голова
    type: socket
  switch.asus_pc:
    name: Компьютер
    type: socket
  switch.bedroom_baby_monitor_plug:
    name: Видео-няня
    type: socket
  button.ex_commandstation_emergency_stop:
