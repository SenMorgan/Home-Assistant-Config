    type: switch
  switch.loco_vossloh_1701_horn_hi:
    name: Гудок локомотива
    type: switch
  switch.loco_sbb_cargo_re_482_power_sound:
    name: Токоприёмник
    type: openable
  sensor.pool_monitor_bottom_water_temperature:
    name: Температура воды снизу
  sensor.pool_monitor_upper_water_temperature:
    name: Температура воды сверху
  cover.bedroom:
    name: Штора
  cover.living_cover:
    name: Штора
  fan.wc_and_bathroom:
    name: Вентиляция
  vacuum.johnny:
    name: Джонни
  # Climate sensors: one "Климат" device per room (Alice: "какая влажность в спальне?")
  sensor.ble_temperature_atc_bedroom:
    name: Климат
    room: Спальня
    type: sensor.climate
    properties:
      - type: temperature
        value_template: "{{ states('sensor.ble_temperature_atc_bedroom') | float(none) | round(1) if states('sensor.ble_temperature_atc_bedroom') | is_number else none }}"
        unit_of_measurement: "°C"
      - type: humidity
        value_template: "{{ states('sensor.ble_humidity_atc_bedroom') | float(none) | round(0) | int if states('sensor.ble_humidity_atc_bedroom') | is_number else none }}"
        unit_of_measurement: "%"
  sensor.ble_temperature_atc_living_room:
    name: Климат
    room: Гостиная
    type: sensor.climate
    properties:
      - type: temperature
        value_template: "{{ states('sensor.ble_temperature_atc_living_room') | float(none) | round(1) if states('sensor.ble_temperature_atc_living_room') | is_number else none }}"
        unit_of_measurement: "°C"
      - type: humidity
        value_template: "{{ states('sensor.ble_humidity_atc_living_room') | float(none) | round(0) | int if states('sensor.ble_humidity_atc_living_room') | is_number else none }}"
        unit_of_measurement: "%"
  sensor.ble_temperature_atc_kitchen:
    name: Климат
    room: Кухня
    type: sensor.climate
    properties:
      - type: temperature
        value_template: "{{ states('sensor.ble_temperature_atc_kitchen') | float(none) | round(1) if states('sensor.ble_temperature_atc_kitchen') | is_number else none }}"
        unit_of_measurement: "°C"
      - type: humidity
        value_template: "{{ states('sensor.ble_humidity_atc_kitchen') | float(none) | round(0) | int if states('sensor.ble_humidity_atc_kitchen') | is_number else none }}"
        unit_of_measurement: "%"
      - type: pressure
        value_template: "{{ states('sensor.air_quality_station_pressure') | float(none) | round(0) | int if states('sensor.air_quality_station_pressure') | is_number else none }}"
        unit_of_measurement: "hPa"
      - type: co2_level
        value_template: "{{ states('sensor.air_quality_station_co2') | float(none) | round(0) | int if states('sensor.air_quality_station_co2') | is_number else none }}"
        unit_of_measurement: "ppm"
      - type: tvoc
        value_template: "{{ states('sensor.air_quality_station_voc') | float(none) | round(0) | int if states('sensor.air_quality_station_voc') | is_number else none }}"
        unit_of_measurement: "μg/m³"
      - type: pm2.5_density
        value_template: "{{ states('sensor.air_quality_station_pm2_5') | float(none) | round(0) | int if states('sensor.air_quality_station_pm2_5') | is_number else none }}"
        unit_of_measurement: "μg/m³"
  sensor.ble_temperature_atc_hall:
    name: Климат
    room: Коридор
    type: sensor.climate
    properties:
      - type: temperature
        value_template: "{{ states('sensor.ble_temperature_atc_hall') | float(none) | round(1) if states('sensor.ble_temperature_atc_hall') | is_number else none }}"
        unit_of_measurement: "°C"
      - type: humidity
        value_template: "{{ states('sensor.ble_humidity_atc_hall') | float(none) | round(0) | int if states('sensor.ble_humidity_atc_hall') | is_number else none }}"
        unit_of_measurement: "%"
  sensor.ble_temperature_atc_bathroom:
    name: Климат
    room: Ванная
    type: sensor.climate
    properties:
      - type: temperature
        value_template: "{{ states('sensor.ble_temperature_atc_bathroom') | float(none) | round(1) if states('sensor.ble_temperature_atc_bathroom') | is_number else none }}"
        unit_of_measurement: "°C"
      - type: humidity
        value_template: "{{ states('sensor.ble_humidity_atc_bathroom') | float(none) | round(0) | int if states('sensor.ble_humidity_atc_bathroom') | is_number else none }}"
        unit_of_measurement: "%"
  sensor.ble_temperature_atc_toilet:
    name: Климат
    room: Туалет
    type: sensor.climate
    properties:
      - type: temperature
        value_template: "{{ states('sensor.ble_temperature_atc_toilet') | float(none) | round(1) if states('sensor.ble_temperature_atc_toilet') | is_number else none }}"
        unit_of_measurement: "°C"
      - type: humidity
        value_template: "{{ states('sensor.ble_humidity_atc_toilet') | float(none) | round(0) | int if states('sensor.ble_humidity_atc_toilet') | is_number else none }}"
        unit_of_measurement: "%"
  sensor.pool_monitor_air_temperature:
    name: Климат
    room: Двор
    type: sensor.climate
    properties:
      - type: temperature
        value_template: "{{ states('sensor.pool_monitor_air_temperature') | float(none) | round(1) if states('sensor.pool_monitor_air_temperature') | is_number else none }}"
        unit_of_measurement: "°C"
      - type: humidity
        value_template: "{{ states('sensor.pool_monitor_air_humidity') | float(none) | round(0) | int if states('sensor.pool_monitor_air_humidity') | is_number else none }}"
        unit_of_measurement: "%"
      - type: pressure
        value_template: "{{ states('sensor.pool_monitor_air_pressure') | float(none) | round(0) | int if states('sensor.pool_monitor_air_pressure') | is_number else none }}"
        unit_of_measurement: "hPa"
