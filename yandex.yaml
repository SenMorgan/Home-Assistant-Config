# Yandex Smart Home (Alice) entity filter and names.
# Privacy: no security devices (door/window contacts, motion, cameras, alarms, guest mode), no thermostats or eTRVs,
# no electricity meter and no phones are exposed: Yandex would receive every state change.
# Climate sensors are "Климат" devices assigned to rooms; values are rounded in value_template, so Yandex
# gets a report only when the rounded value changes (raw BLE values change every minute and hit HTTP 429).
filter:
  include_entities:
    # Climate sensors (temperature/humidity per room, see entity_config)
    - sensor.ble_temperature_atc_bedroom
    - sensor.ble_temperature_atc_living_room
    - sensor.ble_temperature_atc_kitchen
    - sensor.ble_temperature_atc_hall
    - sensor.ble_temperature_atc_bathroom
    - sensor.ble_temperature_atc_toilet
    - sensor.pool_monitor_air_temperature
    - button.ex_commandstation_emergency_stop
    - button.ex_commandstation_reboot
    - button.ex_commandstation_route_300
    - cover.bedroom
    - cover.living_cover
    - climate.hollandis_climate
    - fan.wc_and_bathroom
    - input_boolean.3d_printer_power
    - input_boolean.heating_allowed
    - input_boolean.home_night_mode
    - input_boolean.silent_mode
    - input_button.thermostat_10_minutes_heating
    - light.banana_light
    - light.bedroom_ceiling_light
    - light.bedroom_nightlight
    - light.christmas_tree
    - light.dollhouse_lights
    - light.cocktail_bar_neon_sign
    - light.floor_lamp
    - light.gyver_lamp
    - light.hall_edison_bulb
    - light.hall_lights
    - light.kitchen_ceiling_light
    - light.kitchen_christmas_lights
    - light.kitchen_led_strip
    - light.kitchen_spotlights
    - light.living_room_ceiling_light
    - light.mi_desk_lamp
    - light.shelf_lighting
    - light.string_lights
    - light.tv_lights
    - media_player.model_railway
    - media_player.samsung_tv
    - scene.evening
    - scene.movies
    - sensor.pool_monitor_bottom_water_temperature
    - sensor.pool_monitor_upper_water_temperature
    - switch.asus_pc
    - switch.bedroom_baby_monitor_plug
    - switch.hollandis_charge
    - switch.interactive_cz_map_enable
    - switch.loco_sbb_cargo_re_482_power_sound
    - switch.loco_vossloh_1701_engine_sound
    - switch.loco_vossloh_1701_horn_hi
    - switch.monolith_speakers
    - switch.moving_head_power
    - switch.wireless_charger
    - vacuum.johnny

