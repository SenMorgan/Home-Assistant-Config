# Configure a default setup of Home Assistant (frontend, api, etc)
default_config:

# Text to speech
tts:
  - platform: google_translate
    service_name: google_say

homeassistant:
  customize: !include customize.yaml
  packages: !include_dir_named packages

# Automations created in the UI editor (YAML automations live in packages/)
automation: !include automations.yaml

recorder:
  db_url: !secret DATABASE_URL
  # Detailed history for 2 months; long-term statistics (hourly mean/min/max) are kept forever
  purge_keep_days: 60
  # Explicit includes win over the exclude globs below (entity filter: entity include > glob exclude)
  include:
    entities:
      # Washer energy feeds the Energy dashboard; keep it despite the washing_machine_* exclusion (F2-05)
      - sensor.washing_machine_energy
  exclude:
    # Raw Meshtastic API events: ~80% of all event rows, large payloads; automations still receive them
    event_types:
      - meshtastic_api_node_updated
      - meshtastic_api_packet
      - meshtastic_api_telemetry
      - meshtastic_api_position
    entities:
      # Noisy, history not needed: clock brightness updates and printer Wi-Fi RSSI
      - light.7_seg_clock
      - sensor.3d_printer_bambu_lab_a1_wi_fi_signal
    entity_globs:
      - sensor.adsb_*
      - sensor.flightradar_*
      - sensor.fr24_*
      # ble_monitor beacon diagnostics: one iBeacon alone wrote over half of all state rows
      - sensor.ble_mac_*
      - sensor.ble_measured_power_*
      - sensor.ble_rssi_*
      # Washer (SmartThings) flaps to unavailable ~80×/hour due to its Wi-Fi (M-15, 2026-11-12);
      # temporary until the Wi-Fi is fixed. Automations still get the states, only history is lost.
      - "*.washing_machine_*"

# Sharing devices with Yandex Smart Home
yandex_smart_home: !include yandex.yaml

# Yandex devices icons
frontend:
  extra_module_url:
    - /hacsfiles/ha-yandex-icons/yandex-icons.js

# Write Python scripts that are exposed as services in Home Assistant
python_script:

# Makes it possible to send notifications to a wide variety of platforms
notify:

# Enables the ability to send magic packets to Wake on LAN capable devices to turn them on
wake_on_lan:

# Experimental LED control for ZBT2 devices
zbt2_led:

# Wake on LAN switch platform
switch:
  - platform: wake_on_lan
    name: Asus PC
    mac: !secret ASUS_PC_MAC
    host: !secret ASUS_PC_IP
    turn_off:
      - action: hassio.addon_stdin
        data:
          addon: core_rpc_shutdown
          input: ASUS-PC
  - platform: wake_on_lan
    name: Lenovo ThinkBook
    mac: !secret LENOVO_NB_MAC
    host: !secret LENOVO_NB_IP

light:
  - platform: artnet_led
    host: !secret ARTNET_DMX_CONTROLLER_IP
    refresh_every: 5
    universes:
      1:
        send_partial_universe: True
        devices:
          - channel: 1
            name: Moving Head X axis
          - channel: 2
            name: Moving Head X trim
          - channel: 3
            name: Moving Head Y axis
          - channel: 4
            name: Moving Head Y trim
          - channel: 5
            name: Moving Head Axis Speed
          - channel: 6
            name: Moving Head Brightness
          - channel: 7
            name: Moving Head Stroboscope
          - channel: 8
            name: Moving Head Color
          - channel: 9
            name: Moving Head Pattern
          - channel: 10
            name: Moving Head Prism
          - channel: 11
            name: Moving Head Mode

mqtt:
  binary_sensor: !include mqtt/mqtt-binary-sensors.yaml
  button: !include mqtt/mqtt-buttons.yaml
  sensor: !include mqtt/mqtt-sensors.yaml
  switch: !include mqtt/mqtt-switches.yaml

  cover:
    - name: "Bedroom"
      unique_id: "bedroom_cover"
      device_class: shade
      command_topic: "/blinds/set"
      position_topic: "/blinds/position"
      availability:
        - topic: "/blinds/availability"
      set_position_topic: "/blinds/set_position"
      payload_open: "OPEN"
      payload_close: "CLOSE"
      payload_stop: "STOP"
      position_open: 100
      position_closed: 0
      optimistic: false
      position_template: "{{ value }}"

  light:
    - name: "Kitchen Spotlights"
      unique_id: "kitchen_spotlights"
      state_topic: "/Sonoff-Spotlights/Status"
      command_topic: "/Sonoff-Spotlights/Switch"
      payload_on: "1"
      payload_off: "0"
      availability_topic: "/Sonoff-Spotlights/availability"
      payload_available: "online"
      payload_not_available: "offline"
      optimistic: false
